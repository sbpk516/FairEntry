name: FairEntry — backtest the Buy filter

# Seeds a point-in-time history from real Yahoo Finance prices and runs the
# rolling, benchmark-relative backtest, reporting the Buy/Watch/Avoid alpha
# ladder into the run summary. Weekly + on demand. Read-only: never deploys and
# never writes back to the live store cache.
on:
  # Runs itself when the backtest code changes (so a real result appears now and
  # whenever the logic is edited), plus weekly and on demand.
  push:
    branches: [main]
    paths:
      - ".github/workflows/backtest.yml"
      - "config/scoring.yaml"
      - "config/defaults.yaml"
      - "fairentry/scoring/**"
      - "fairentry/screeners/**"
      - "fairentry/backtest/**"
      - "scripts/backtest.py"
      - "scripts/seed_backtest.py"
      - "scripts/sfa_backtest.py"
      - "fairentry/sharadar/**"
      - "tests/test_sharadar.py"
  schedule:
    - cron: "0 6 * * 0"        # Sundays 06:00 UTC
  workflow_dispatch:
    inputs:
      limit:
        description: "How many names to seed (top-N by market cap; blank = all)"
        type: string
        default: "150"
      hold:
        description: "Forward holding window in days"
        type: string
        default: "30"
      step:
        description: "Days between cohort entries"
        type: string
        default: "7"
      target_model:
        description: "Primary target model"
        type: choice
        options: [practical]
        default: practical
      target_expiry:
        description: "Target expiry in calendar days"
        type: string
        default: "365"

permissions:
  contents: read

concurrency:
  group: fairentry-backtest
  cancel-in-progress: true

jobs:
  backtest:
    runs-on: ubuntu-latest
    env:
      FINVIZ_API_KEY: ${{ secrets.FINVIZ_API_KEY }}
      SEC_CONTACT_EMAIL: ${{ secrets.SEC_CONTACT_EMAIL }}
      PYTHONUTF8: "1"
      LIMIT: ${{ github.event.inputs.limit || '150' }}
      HOLD: ${{ github.event.inputs.hold || '30' }}
      STEP: ${{ github.event.inputs.step || '7' }}
      TARGET_MODEL: ${{ github.event.inputs.target_model || 'practical' }}
      TARGET_EXPIRY: ${{ github.event.inputs.target_expiry || '365' }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install deps
        run: pip install -r requirements.txt pytest
      - name: Verify SFA contract and synthetic parity fixtures
        run: python -m pytest -q tests/test_sharadar.py tests/test_backtest_evidence.py
      # Reuse the live store (current metrics) the refresh workflow persists.
      # Restore-only: this job must not overwrite that cache.
      - name: Restore live store
        uses: actions/cache/restore@v5
        with:
          path: data
          key: fairentry-backtest-placeholder
          restore-keys: |
            fairentry-store-
      # Always refresh and rescreen current data. The cache supplies history,
      # never permission to use an old current universe for a new run.
      - name: Refresh current official + Emerging universes
        run: python scripts/build_all.py --refresh
      - name: Verify latest official + Emerging universes
        run: python scripts/validate_live_refresh.py --max-age-minutes 120
      - name: Seed history from real prices + SEC filings
        run: python scripts/seed_backtest.py --sec-history --limit "$LIMIT"
      - name: Run rolling backtest -> summary
        run: |
          python scripts/backtest.py --db data/backtest.db --rolling \
            --hold "$HOLD" --step "$STEP" \
            --prospective-db data/fairentry.db \
            --target-model "$TARGET_MODEL" --target-expiry "$TARGET_EXPIRY" \
            --md-out "$GITHUB_STEP_SUMMARY" --json-out web/data/backtest.json --json | tee backtest_result.txt
      - name: Tune weights (regime-robust, downside-protected) -> summary
        run: |
          python scripts/tune_weights.py --db data/backtest.db \
            --holds 20,30,60 --folds 4 --step "$STEP" \
            --reg 0.4 --protect risk,survival --protect-band 3 \
            --md-out "$GITHUB_STEP_SUMMARY" | tee -a backtest_result.txt
      - name: Upload backtest result
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: fairentry-backtest
          path: |
            backtest_result.txt
            data/backtest.db
            web/data/backtest.json
            web/data/backtest-evidence/
            config/backtest.yaml
          retention-days: 14
