version: 2
name: fairentry_sfa_point_in_time_v2
universe:
  mode: sharadar_point_in_time
  sectors: live_enabled
  screened_only: true
  top_n: 1000
  market_cap_min_usd: 300000000
  price_min_usd: 1
  avg_dollar_volume_min_usd: 10000000
execution:
  entry: next_close
  target_hit: close
  slippage_bps: 10
  transaction_cost_bps: 5
  exit_slippage_bps: 10
  exit_transaction_cost_bps: 5
benchmark:
  mode: spy_total_return
horizons_days: [30, 60, 90, 180, 365, 548, 730, 1095, 1825]
target:
  models: [practical, fundamental, technical, blended, fcf, book, peer_pe, peer_ps, lynch]
  primary: practical
  expiry_days: 365
  minimum_upside_pct: 30
  maximum_upside_pct: 100
  practical_policy: fundamental_first
data_quality:
  mode: strict
  minimum_coverage_pct: 50
  strict_excluded_sources: [seed_const, current_proxy]
tuning:
  promotion: manual
  challenger_holds_days: [20, 30, 60, 90, 180]
  objective: one_year_buy_episode_targets
  primary_gain_pct: 25
  secondary_gain_pct: 30
  horizon_days: 365
  large_loss_pct: -20
  severe_drawdown_pct: -30
  minimum_completed_episodes: 50
  minimum_unique_issuers: 30
  minimum_split_episodes: 10
  candidate_count: 1000
  # These are effective verdict weights. Information-only groups stay at zero.
  weight_ranges:
    quality: [15, 30]
    survival: [3, 10]
    growth: [25, 45]
    valuation: [12, 30]
    confirmation: [10, 25]
research_cycle:
  failure_diagnosis: retrospective_later_evidence_allowed_no_score_effect
  predictive_rules: point_in_time_only_chronological_development_validation_test
  promotion: manual_only
  rules: config/predictive_rules.json
portfolio:
  max_positions: 20
