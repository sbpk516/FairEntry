# FairEntry Scoring Config — the taxonomy, weights, rules, bands, vetoes, gates.
# Categories -> items -> a rule that maps a metric to a 0-100 score.
# Category score = weighted average of its items. Base score = weighted average
# of categories. Everything here is tunable; the engine never hard-codes numbers.
#
# rule types (interpreted by fairentry/scoring/engine.py):
#   higher_better {full_at, floor_at}      value>=full_at ->100 ; <=floor_at ->0 ; linear between
#   lower_better  {full_at, floor_at}      value<=full_at ->100 ; >=floor_at ->0
#   sector_rel    {full_delta, floor_delta, lower_better?}  score from (value - sector_median)
#   band          [{max|min, score}...]    first matching bound wins
#   bool_good     {good_score, bad_score}  truthy metric -> good_score else bad_score
#   passthrough   {}                        metric already 0-100

version: 1
roic_direction_gate: true

verdict_bands: {buy: 72, watch: 50}      # >=72 Buy, 50-71 Watch, <50 Avoid
# AI/news review is information-only until a timestamped historical news source
# is replayed and validated. It must never change Buy / Watch / Avoid.
thesis_modifier: []

categories:
  quality:
    label: Business Quality
    weight: 22.5
    items:
      - {id: gross_margin_vs_sector, label: "Gross margin vs sector", weight: 30, metric: gross_margin, expected: "at least the sector median", definition: "The percentage of sales left after direct product or service costs, compared with the typical company in the same sector.", rule: {type: sector_rel, full_delta: 5, floor_delta: -15}}
      - {id: roic_quality,           label: "Return on invested capital (ROIC) vs sector", weight: 35, metric: roic, expected: "at least the sector median", definition: "How much operating profit the company produces from the money invested in the business, compared with its sector.", rule: {type: sector_rel, full_delta: 4, floor_delta: -8}}
      - {id: profitability,          label: "Operating profit margin", weight: 35, metric: oper_margin, expected: "positive; 20% or more receives full credit", definition: "The percentage of sales left after normal operating costs, before interest and taxes.", rule: {type: higher_better, full_at: 20, floor_at: -5}}
  survival:
    label: Financial Strength & Survival
    weight: 6.25
    items:
      - {id: altman_z,       label: "Altman Z financial-distress check", weight: 30, metric: altman_z, expected: "2.6 or more is the safer range", definition: "A balance-sheet formula used to estimate financial-distress risk. Higher is generally safer; it is not a guarantee.", rule: {type: band, bands: [{min: 2.6, score: 90}, {min: 1.8, score: 55}, {min: 0, score: 20}]}}
      - {id: leverage,       label: "Debt compared with shareholder equity", weight: 25, metric: debt_eq, expected: "below 0.7 is comfortable; 0.3 or less receives full credit", definition: "Total debt divided by shareholder equity. Lower usually means the company relies less on borrowed money.", rule: {type: lower_better, full_at: 0.3, floor_at: 2.0}}
      - {id: debt_direction, label: "Long-term debt burden: change from one year ago", weight: 20, metric: debt_to_assets_change_yoy_pp, expected: "a negative change means debt burden improved", definition: "Long-term debt as a percentage of assets today, minus the same percentage one year earlier. This research row is ignored by today's official score until its live and historical calculations match and testing shows that it helps.", decision_status: testing, rule: {type: lower_better, full_at: -5, floor_at: 8}}
      - {id: liquidity,      label: "Current ratio (short-term bill coverage)", weight: 15, metric: current_ratio, expected: "above 1.5; 1.8 or more receives full credit", definition: "Current assets divided by bills due within one year. Above 1 means current assets exceed current liabilities.", rule: {type: higher_better, full_at: 1.8, floor_at: 0.8}}
      - {id: dilution,       label: "Share-count change", weight: 10, metric: share_count_yoy, expected: "zero or negative means no dilution", definition: "Percentage change in shares outstanding from one year earlier. A large increase reduces each existing shareholder's ownership percentage.", rule: {type: lower_better, full_at: -1, floor_at: 10}}
  growth:
    label: Growth & Operating Momentum
    weight: 33.75
    items:
      - {id: revenue_growth, label: "Latest-quarter sales growth vs sector", weight: 35, metric: rev_growth_qoq, expected: "at least the sector median", definition: "Sales in the latest reported quarter compared with the same quarter one year earlier, then compared with the typical company in the same sector.", rule: {type: sector_rel, full_delta: 10, floor_delta: -10}}
      - {id: eps_growth,     label: "Expected EPS growth next year", weight: 30, metric: eps_growth_next_y, expected: "≥ 15%", decision_status: information_only, definition: "A current analyst forecast. It is shown as context because the SFA replay does not contain the same historical forecast series.", rule: {type: higher_better, full_at: 30, floor_at: -10}}
      - {id: margin_trend,   label: "Margin direction", weight: 35, metric: margin_trend_score, expected: "stable or improving", decision_status: testing, definition: "This research calculation does not yet match the filing-by-filing version used in the historical test. It is therefore ignored by today's official score and recommendation.", rule: {type: passthrough, drop_if_missing: true}}
  valuation:
    label: Valuation & Margin of Safety
    weight: 18.75
    items:
      - {id: intrinsic_gap,  label: "Discount to estimated fair value", weight: 40, metric: intrinsic_gap_pct, expected: "at least 12% below fair value", definition: "How far the current price is below or above FairEntry's central fair-value estimate. Positive means the estimate is above today's price.", rule: {type: higher_better, full_at: 30, floor_at: -10}}
      - {id: fcf_value,      label: "Price / free cash flow", weight: 30, metric: pfcf_ratio, expected: "below 15 is relatively inexpensive", definition: "Share price relative to free cash flow generated for shareholders. Lower is generally cheaper when cash flow is positive and sustainable.", rule: {type: lower_better, full_at: 12, floor_at: 40}}
      - {id: sales_value,    label: "Price / sales vs sector", weight: 30, metric: ps_ratio, expected: "no higher than the sector median", definition: "The company's market value divided by annual sales, compared with the typical company in its sector. Lower is cheaper, but this measure ignores profit margins.", rule: {type: sector_rel, full_delta: -1, floor_delta: 4, lower_better: true}}
  confirmation:
    label: Market Confirmation
    weight: 18.75
    items:
      - {id: price_breakout, label: "Price above prior resistance", weight: 25, metric: breakout_price_score, expected: "closing price at least 2% above prior resistance", definition: "Checks whether price has clearly moved above a recent level where earlier rallies stopped.", rule: {type: passthrough, drop_if_missing: true}}
      - {id: breakout_volume,label: "Volume supporting the price move", weight: 20, metric: breakout_volume_score, expected: "at least 1.5 times the prior 50-day average", definition: "Checks whether more shares than usual traded during the latest price move. Higher participation can make a breakout more credible.", rule: {type: passthrough, drop_if_missing: true}}
      - {id: relative_strength,label: "Three-month return vs sector and S&P 500", weight: 15, metric: relative_strength_score, expected: "stock outperforms both its sector fund and SPY", definition: "Compares the stock's three-month price return with its sector ETF and SPY. Positive means the stock performed better than those benchmarks.", rule: {type: passthrough, drop_if_missing: true}}
      - {id: trend_regime,   label: "Daily moving-average trend", weight: 15, metric: trend_regime_score, expected: "most moving-average checks are positive", definition: "Four checks: price above its 50-day average, price above its 200-day average, the 50-day average above the 200-day average, and the 50-day average rising.", rule: {type: passthrough, drop_if_missing: true}}
      - {id: liquidity_quality, label: "Trading liquidity quality", weight: 0, metric: avg_dollar_volume, expected: "$20M+ average daily dollar volume", decision_status: information_only, definition: "The active-board hard floor is $10M. Values of $20M or more receive a positive liquidity-quality label, but this indicator does not change the score or verdict.", rule: {type: higher_better, full_at: 20000000, floor_at: 10000000}}
      - {id: inst_flow,      label: "Institutional ownership change", weight: 10, metric: inst_trans, expected: "positive change in reported institutional ownership", decision_status: information_only, definition: "Finviz Institutional Transactions reports a current aggregate ownership change. It is not FairEntry's curated SEC 13F history. The replay does not reproduce this exact series, so it cannot affect the verdict.", formula: "score = clamp((institutional ownership change + 3) / 5 × 100, 0, 100)", rule: {type: higher_better, full_at: 2, floor_at: -3}}
      - {id: smart_money,    label: "Large-investor SEC filings", weight: 5, metric: thirteenf_score, expected: "tracked investors own or recently added shares", decision_status: information_only, definition: "Shows current SEC ownership filings. It is ignored by the official recommendation because the same dated investor history has not yet been tested across old decision dates.", rule: {type: passthrough, drop_if_missing: true}}
      - {id: insider_buying, label: "Company-insider buying", weight: 10, metric: insider_score, expected: "recent purchases by several insiders or a senior executive", decision_status: information_only, definition: "Shows current insider transactions. It is ignored by the official recommendation until dated historical Form 4 transactions are tested fairly.", rule: {type: passthrough, drop_if_missing: true}}
  catalysts:
    label: News & Possible Catalysts
    weight: 0
    items:
      - {id: news_sentiment, label: "News review", weight: 40, metric: news_sentiment_score, expected: "specific sourced event", decision_status: information_only, definition: "Recent news is displayed as a sourced note. The current feed has no complete historical archive, so it never changes the verdict.", rule: {type: passthrough, drop_if_missing: true}}
      - {id: analyst,        label: "Analyst consensus", weight: 25, metric: analyst_recom, expected: "2 or lower on the provider's 1-to-5 scale", decision_status: information_only, definition: "Shows current analyst opinion. It is ignored by the official formula because an equivalent dated history is not available for a fair historical test.", rule: {type: lower_better, full_at: 1.5, floor_at: 3.5}}
      - {id: est_revisions,  label: "Analyst target revisions", weight: 20, metric: estimate_revision_score, expected: "mean analyst price target rising", decision_status: information_only, definition: "Built from recent locally collected targets; the complete historical series is unavailable.", rule: {type: passthrough, drop_if_missing: true}}
      - {id: earnings_transcript, label: "Earnings and transcript review", weight: 0, metric: earnings_transcript_context, expected: "dated results, guidance changes, and evidence that management did or did not deliver", decision_status: information_only, subgroup: earnings, definition: "Shows sourced notes from quarterly results and calls. It cannot change the recommendation because a complete dated history has not yet been tested.", rule: {type: passthrough, drop_if_missing: true}}
      - {id: government_policy, label: "Government policy", weight: 0, metric: government_policy_context, expected: "a named proposed or enacted policy with a direct effect on the business", decision_status: information_only, subgroup: policy, definition: "Shows a sourced policy opportunity or risk. It is ignored by the official formula until a dated historical rule is tested and shown to help.", rule: {type: passthrough, drop_if_missing: true}}
      - {id: sqz_context,    label: "Short interest context", weight: 15, metric: short_float, expected: "moderate but not extreme", decision_status: information_only, definition: "Percentage of tradable shares sold short. This current figure is shown for context but ignored by the official formula because equivalent dated history is not available.", rule: {type: band, bands: [{min: 15, max: 30, score: 70}, {min: 5, max: 15, score: 55}, {min: 0, max: 5, score: 45}]}}
  risk:
    label: Risks & Accounting Warnings
    weight: 0
    items:
      - {id: forensic,       label: "Accounting warning review", weight: 40, metric: red_flags_score, expected: "no major accounting warnings", decision_status: information_only, definition: "Shows current filing warnings. It is ignored by the official recommendation until the same checks are tested across old filings using only information available at the time.", rule: {type: passthrough}}
      - {id: short_risk,     label: "Short interest risk", weight: 30, metric: short_float, expected: "below 10% is relatively low", decision_status: information_only, definition: "Percentage of tradable shares sold short. High values can increase risk and volatility, but this current-only figure is ignored by the official formula.", rule: {type: lower_better, full_at: 5, floor_at: 30}}
      - {id: macro,          label: "Sensitivity to market moves (beta)", weight: 30, metric: beta, expected: "near or below 1 means no more volatile than the market", decision_status: information_only, definition: "Beta estimates how strongly the stock has moved with the overall market. The live and historical sources do not match, so this row is ignored by the official formula.", rule: {type: lower_better, full_at: 0.8, floor_at: 2.2}}
      - {id: operational_disruption, label: "Operational disruption", weight: 0, metric: operational_disruption_context, expected: "evidence of a shutdown, shortage, supply-chain problem, or difficult technology transition", decision_status: information_only, subgroup: operations, definition: "Shows sourced operating events and their possible importance. It is ignored by the official formula until a complete dated history can be tested fairly.", rule: {type: passthrough, drop_if_missing: true}}
      - {id: external_events, label: "External events", weight: 0, metric: external_event_context, expected: "a specific company exposure to war, a pandemic, or a natural disaster", decision_status: information_only, subgroup: external, definition: "Shows sourced external events for a person's review. It is ignored by the official formula rather than assigning subjective points.", rule: {type: passthrough, drop_if_missing: true}}

# Hard vetoes -> force Avoid regardless of score.
vetoes:
  - {id: going_concern,        when: "going_concern == True",         reason: "Going-concern doubt confirmed", decision_status: information_only}
  - {id: distress_corroborated, when: "altman_z < 1.8 and debt_eq > 2", reason: "Corroborated financial distress"}
  - {id: substantial_dilution,  when: "share_count_yoy > 10", reason: "Substantial dilution: share count increased more than 10% year over year"}
  - {id: critical_red_flag,    when: "red_flags_critical > 0",        reason: "Critical accounting / fraud flag", decision_status: information_only}

# Production Buy entry rule. Every condition is required; missing data fails
# the entry alignment and leaves an otherwise eligible name at Watch.
buy_entry_alignment:
  monthly_ema_required: false
  category_minimum: 70
  categories: [quality, survival, growth]
  fair_value_method_minimum: 1
  ema_proximity_pct: 5
  ema_policy: any
  monthly_ema_metrics: [ema_9month, ema_20month]
  obv_metric: obv_above_20week_ema

# Retained for compatibility with config consumers. The production Buy rule
# above replaces the former upside, growth and confirmation soft gates.
soft_gates: []

# Presets — bias the weights per strategy (user can pick / edit in the UI).
presets:
  # Exact effective weights used by SFA replay sfa-927c352ce0b3. The previous
  # 18/5/27/15/15 display scale had the same proportions and is preserved below.
  backtest_recommended: {quality: 22.5, survival: 6.25, growth: 33.75, valuation: 18.75, confirmation: 18.75, catalysts: 0, risk: 0}
  pre_sfa_display_scale: {quality: 18, survival: 5, growth: 27, valuation: 15, confirmation: 15, catalysts: 15, risk: 5}
  quality_compounder:   {quality: 20, survival: 9,  growth: 24, valuation: 12, confirmation: 16, catalysts: 12, risk: 7}
  aggressive_growth:    {quality: 20, survival: 6,  growth: 28, valuation: 8,  confirmation: 18, catalysts: 14, risk: 6}
  recovery_value:       {quality: 12, survival: 12, growth: 12, valuation: 22, confirmation: 16, catalysts: 16, risk: 10}

# Human-facing guidance for the Tune Weights picker. The weights above remain
# plain numeric maps so the scoring engine and backtest tuner stay deterministic.
preset_profiles:
  backtest_recommended:
    {label: "SFA-tested current weights", risk: "Moderate-high", horizon: "1-5 years", description: "These are the exact effective percentages used in the completed SFA replay and in today's board. Growth leads; Financial Survival remains deliberately small."}
  pre_sfa_display_scale:
    {label: "Previous displayed weights (same proportions)", risk: "Moderate-high", horizon: "1-5 years", description: "Preserves the former 18, 5, 27, 15, 15 display scale. After excluding information-only areas, it produces the same effective percentages and the same score as the SFA-tested current weights."}
  quality_compounder:
    {label: "Quality Compounder", risk: "Moderate-high", horizon: "1-3 years", description: "Prioritizes durable growth and quality with enough market confirmation to avoid weak trends."}
  aggressive_growth:
    {label: "Aggressive Growth", risk: "High", horizon: "1-2 years", description: "Chases faster growth and momentum; accepts expensive valuations and larger drawdowns."}
  recovery_value:
    {label: "Recovery Value", risk: "High", horizon: "1-3 years", description: "Looks for cheap, improving businesses with catalysts and confirmation; turnaround failure risk is higher."}
