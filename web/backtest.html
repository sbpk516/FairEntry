<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <style>
    :root{--bg:#eef1f6;--panel:#fff;--ink:#171b23;--soft:#596276;--line:#dde2ec;--accent:#4a5ee0;--good:#177a45;--warn:#95670b;--bad:#b92943;--sunk:#f4f6fb;--info:#3157a4;--mono:ui-monospace,Consolas,monospace}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px system-ui,-apple-system,"Segoe UI",sans-serif}a{color:inherit;text-decoration:none}
    .top{position:sticky;top:0;z-index:3;display:flex;gap:14px;align-items:center;padding:12px 20px;background:var(--panel);border-bottom:1px solid var(--line)}.logo{font-size:19px;font-weight:850}.logo b{color:var(--accent)}.spacer{flex:1}
    .btn,select,input{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;padding:8px 10px}.btn:disabled{opacity:.45;cursor:not-allowed}
    .wrap{max-width:1440px;margin:auto;padding:18px 20px 60px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;margin-bottom:16px;overflow:hidden}.body{padding:16px}.head{padding:13px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;flex-wrap:wrap}.head h2{margin:0;font-size:16px}.head .hint{margin-left:auto}
    .hero{display:grid;grid-template-columns:1.45fr .55fr;gap:16px}.title{font-size:28px;margin:7px 0}.sub,.note{color:var(--soft);line-height:1.55}.meta{font:12px var(--mono);color:var(--soft)}
    .stats{display:grid;grid-template-columns:repeat(6,1fr);gap:9px;margin-top:15px}.stat{position:relative;padding:11px;background:var(--sunk);border-radius:9px}.stat>.k{padding-right:20px}.stat>.k>.help{position:absolute;right:9px;top:9px;margin:0}.hero .panel:first-child{position:relative;z-index:2;overflow:visible}.k{font-size:10px;text-transform:uppercase;color:var(--soft);font-weight:800}.v{font:800 20px var(--mono);margin-top:3px}.smallv{font:750 14px var(--mono);margin-top:5px}.good{color:var(--good)}.bad{color:var(--bad)}.warn{color:var(--warn)}.info{color:var(--info)}
    .tag{display:inline-block;padding:3px 8px;border-radius:20px;font-weight:800;font-size:11px}.tag.good{background:#e2f4e9}.tag.warn{background:#f7eed6}.tag.bad{background:#fbe4e8}.tag.info{background:#e6edfb}.tag.neutral{background:#edf0f5;color:var(--soft)}
    .contract{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.contract .cell,.card{border:1px solid var(--line);border-radius:10px;padding:12px}.contract .cell .value{font-weight:750;margin-top:4px;word-break:break-word}.panel,.body,.card,.grid2,.grid3,.tablewrap{min-width:0}.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.card h3{margin:0 0 9px;font-size:14px}.criteria{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.criterion{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:8px;padding:10px;background:var(--sunk);border-radius:8px}.criterion .answer{font-family:var(--mono);text-align:right}.help{position:relative;display:inline-grid;place-items:center;width:17px;height:17px;margin-left:4px;border:1px solid #99a5ba;border-radius:50%;color:var(--info);background:#fff;font:800 11px system-ui;cursor:help;vertical-align:middle}.help:focus{outline:2px solid var(--accent);outline-offset:2px}.help:hover:after,.help:focus:after{content:attr(data-tip);position:absolute;left:50%;bottom:calc(100% + 8px);transform:translateX(-50%);z-index:20;width:min(300px,80vw);padding:9px 10px;border-radius:8px;background:#19202e;color:#fff;font:12px/1.45 system-ui;box-shadow:0 8px 24px #0004;text-transform:none;letter-spacing:0;text-align:left;white-space:normal}.plain-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.result-card{border:1px solid var(--line);border-radius:10px;padding:13px}.result-card .result-main{display:flex;justify-content:space-between;align-items:center;gap:8px}.result-card .result-number{font:800 20px var(--mono)}.bar{height:8px;margin:11px 0 8px;border-radius:10px;background:#e5e9f1;overflow:hidden}.bar span{display:block;height:100%;border-radius:inherit;background:var(--accent)}.simple-details{margin-top:14px;padding:0;border:1px solid var(--line);border-radius:10px}.simple-details summary{padding:12px 14px}.simple-details>div{padding:0 14px 14px}.goal-banner{display:flex;align-items:center;gap:12px;padding:13px 15px;margin-bottom:14px;border-radius:10px;background:#e9f6ee;border-left:4px solid var(--good)}.goal-banner strong{font-size:18px}.strategy-cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.year-map{display:grid;grid-template-columns:repeat(auto-fit,minmax(95px,1fr));gap:7px;margin-top:10px}.year-button{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:8px;padding:8px;background:#fff;text-align:left;cursor:pointer}.year-button span{position:absolute;inset:auto 0 0;height:4px;background:var(--accent)}.year-button b,.year-button small{position:relative;display:block}.year-button small{color:var(--soft)}
    .filters{display:flex;gap:8px;flex-wrap:wrap}.filters input{min-width:180px}.tablewrap{overflow:auto;max-height:680px}table{width:100%;border-collapse:collapse;min-width:900px}th,td{padding:9px;border-bottom:1px solid #edf0f5;text-align:left;white-space:nowrap}th{position:sticky;top:0;background:var(--panel);font-size:10px;text-transform:uppercase;color:var(--soft);z-index:1}.num{text-align:right;font-family:var(--mono)}tr[data-id]{cursor:pointer}tr[data-id]:hover{background:var(--sunk)}
    .pager{display:flex;align-items:center;justify-content:center;gap:8px;padding:12px 16px;border-top:1px solid var(--line);background:var(--sunk)}.pager .meta{min-width:150px;text-align:center}
    .callout{padding:12px 14px;border-left:4px solid var(--warn);background:#fff9e9;border-radius:6px;line-height:1.5}.availability{display:grid;gap:8px}.availability .row{padding:9px;background:var(--sunk);border-radius:8px}.empty{text-align:center;padding:38px;color:var(--soft)}
    .success-tests{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.success-card{border:1px solid var(--line);border-radius:12px;padding:15px;background:var(--panel)}.success-card h3{margin:0 0 4px;font-size:17px}.success-main{display:flex;align-items:end;gap:10px;margin:13px 0}.success-rate{font:850 34px var(--mono)}.success-count{padding-bottom:5px;color:var(--soft)}.success-metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.success-metric{padding:9px;background:var(--sunk);border-radius:8px}.success-metric b{display:block;margin-top:3px;font:800 16px var(--mono)}.deadline-ladder{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px;margin-top:12px}.deadline-step{padding:8px;border:1px solid var(--line);border-radius:8px;text-align:center}.deadline-step b,.deadline-step small{display:block}.deadline-step small{color:var(--soft);margin-top:2px}.episode-list{display:grid;gap:8px}.episode-columns,.episode-row>summary{display:grid;grid-template-columns:1.15fr .9fr .9fr .9fr 1.05fr 1.3fr 1.05fr 1.05fr;gap:12px;align-items:center}.episode-columns{padding:10px 13px 7px;color:var(--soft);font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.03em}.episode-row{padding:0;border:1px solid var(--line);border-radius:10px;background:var(--panel);overflow:hidden}.episode-row>summary{padding:11px 13px;list-style:none}.episode-row>summary::-webkit-details-marker{display:none}.episode-row>summary:hover{background:var(--sunk)}.episode-cell small,.mobile-label{display:block;color:var(--soft);margin-top:3px}.mobile-label{display:none;margin:0 0 4px;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.03em}.reason-link{display:inline-block;margin-top:5px;color:var(--accent);font-weight:750;text-decoration:underline}.reason-evidence{margin:8px 0 0;padding-left:18px}.reason-evidence li{margin:4px 0}.episode-body{padding:13px;border-top:1px solid var(--line);background:var(--sunk)}.episode-body .card{background:var(--panel)}
    .episode-body .wide-card{grid-column:1/-1}.counting-line{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:9px 0}.counting-line .note{margin:0}.return-controls{display:flex;gap:10px;flex-wrap:wrap;align-items:end}.return-controls label{display:grid;gap:5px;color:var(--soft);font:12px var(--mono)}.return-controls select{min-width:150px}.return-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:14px 0}.return-chart{border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--panel)}.return-chart-head{display:flex;gap:10px;align-items:baseline}.return-chart-head .meta{margin-left:auto;text-align:right}.return-chart svg{display:block;width:100%;height:290px}.return-grid{stroke:var(--line);stroke-width:1}.return-axis{fill:var(--soft);font:12px var(--mono)}.return-axis-title{fill:var(--ink);font:12px var(--mono)}.return-area{fill:#e6edfb}.return-line{fill:none;stroke:var(--accent);stroke-width:3}.return-point{fill:var(--panel);stroke:var(--accent);stroke-width:3}.return-point.selected{fill:var(--good);stroke:var(--panel)}.return-guide{stroke:var(--good);stroke-width:1.5;stroke-dasharray:5 4}.return-detail{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:8px;padding:10px 12px;border-radius:8px;background:#e2f4e9}.return-matrix td.selected{background:#e2f4e9;color:var(--good);font-weight:800}.return-matrix small{display:block;color:var(--soft);margin-top:2px}
    dialog{width:min(1050px,94vw);max-height:90vh;border:0;border-radius:14px;padding:0;color:var(--ink);background:var(--panel);box-shadow:0 18px 60px #0005}dialog::backdrop{background:#10141d99}.dlghead{position:sticky;top:0;background:var(--panel);padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;z-index:1}.dlgbody{padding:18px;overflow:auto}.dlgbody .card{margin-bottom:14px}details{border-top:1px solid var(--line);padding:10px 0}summary{font-weight:750;cursor:pointer}.path{font:11px var(--mono);white-space:pre-wrap;color:var(--soft)}
    @media(max-width:1000px){.hero,.grid2,.grid3,.success-tests{grid-template-columns:1fr}.contract{grid-template-columns:repeat(2,1fr)}.stats{grid-template-columns:repeat(3,1fr)}.plain-grid{grid-template-columns:1fr}.criteria{grid-template-columns:1fr}.episode-columns{display:none}.mobile-label{display:block}.episode-row>summary{grid-template-columns:repeat(3,minmax(0,1fr))}}
    @media(max-width:620px){.wrap{padding:12px}.stats,.contract,.return-stats,.strategy-cards,.success-metrics,.deadline-ladder{grid-template-columns:1fr}.pager,.top{flex-wrap:wrap}.top .spacer{display:none}.top .meta{display:none}.top .btn{flex:1;text-align:center}.return-controls label,.return-controls select{width:100%}.return-chart-head{display:block}.return-chart-head .meta{margin-top:4px;text-align:left}.criterion{grid-template-columns:auto minmax(0,1fr)}.criterion .answer{grid-column:2;text-align:left}.episode-row>summary{grid-template-columns:1fr 1fr}.help:hover:after,.help:focus:after{position:fixed;left:20px;right:20px;top:90px;bottom:auto;transform:none;width:auto}}
  </style>

<body>
  <nav class="top"><a href="index.html" class="logo">Fair<b>Entry</b></a><span class="meta">backtest evidence</span><a class="btn" href="backtest.html?source=sfa">SFA replay</a><a class="btn" href="backtest.html?source=legacy">Legacy replay</a><span class="spacer"></span><a class="btn" id="download-json" href="data/backtest.json" download>Download JSON</a><a class="btn" href="index.html">Board</a></nav>
  <main class="wrap" id="app"><section class="panel"><div class="empty">Loading evidence...</div></section></main>
  <dialog id="detail"><div class="dlghead"><strong id="dt"></strong><span class="spacer"></span><button class="btn" onclick="detail.close()">Close</button></div><div class="dlgbody" id="db"></div></dialog>
<script>
"use strict";
let DATA,ROWS=[],EPISODE_ROWS=[],PAGE=Math.max(1,Number(new URLSearchParams(location.search).get('page'))||1),PAGE_SIZE=100;
const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pct=x=>x==null||Number.isNaN(Number(x))?"—":`${x>=0?"+":""}${Number(x).toFixed(2)}%`,money=x=>x==null?"—":"$"+Number(x).toFixed(2),num=x=>x==null?"—":Number(x).toLocaleString();
const tag=(label,tone='neutral')=>`<span class="tag ${tone}">${esc(label)}</span>`;
const help=text=>`<span class="help" tabindex="0" aria-label="More information: ${esc(text)}" data-tip="${esc(text)}">i</span>`;
const mean=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;
const median=a=>{if(!a.length)return null;let s=[...a].sort((x,y)=>x-y),m=Math.floor(s.length/2);return s.length%2?s[m]:(s[m-1]+s[m])/2};
function toneForStatus(s){return s==='reached'||s==='within_one_year'||s==='Buy'||s==='strict'?'good':s==='expired'||s==='never_within_three_years'||s==='closed_early_failure'||s==='missed_within_one_year_tracking'||s==='Avoid'||s==='experimental'?'bad':s==='reached_late'||s==='during_year_two'||s==='during_year_three'||s==='after_three_years'||s==='still_waiting'||s==='active'||s==='Watch'||s==='mostly_point_in_time'||s==='already_above_at_entry'?'warn':s==='closed_early_excluded'?'info':'neutral'}
function statusTag(s,label){return tag(label||s||'unavailable',toneForStatus(s))}
function health(b){let buy=b.by_verdict?.Buy||{},spread=b.buy_minus_avoid_pct,two=b.spread_ci90_two_way||[],checks=[spread>0,b.significant===true,two.length&&two[0]>0,b.monotonic===true,buy.hit_rate_pct>50,b.cohorts>=30];return {checks,pass:checks.every(Boolean),positive:checks.filter(Boolean).length,label:checks.every(Boolean)?'Acceptance criteria met':'Backtest not validated · review gaps'}}
function actualEntryRange(b){let c=b.per_cohort||[];return c.length?[c[0].entry,c[c.length-1].entry]:b.window||[]}

function overview(b){let t=b.target_summary||{},primaryPractical=b.buy_return_achievement?.primary_success_contract?.practical_target_with_compounding_deadline,buy=b.by_verdict?.Buy||{},h=health(b),ci=b.spread_ci90||[],entries=actualEntryRange(b),sfa=b.data_quality?.universe_bias==='active_and_delisted_point_in_time',universe=sfa?'companies that existed then, including companies later removed from the market':'only companies that still exist today',sampling=sfa?'checked every trading day':'checked on selected weekly dates',sample=b.public_evidence_sample,independence='The same company can appear on several test dates. Those repeated decisions are useful, but they are not separate independent investments. The cautious ranges on this page allow for that repetition.';return `<section class="hero">
  <div class="panel"><div class="body"><div class="meta">BACKTEST ${esc(b.run_id)}</div><h1 class="title">From each recommendation to what happened next</h1><p class="sub">Every result can be opened from a simple answer into its rules, dates, calculations, and stock-level evidence.</p>
  <div>${tag(h.pass?'All reliability checks passed':`${h.positive} of ${h.checks.length} reliability checks passed`,h.pass?'good':'warn')}</div><div class="stats">
    <div class="stat"><div class="k">Buy extra return ${help(`Average Buy return after ${b.hold_days} days minus the S&P 500 return over the same dates.`)}</div><div class="v ${buy.mean_alpha_pct>=0?'good':'bad'}">${pct(buy.mean_alpha_pct)}</div></div>
    <div class="stat"><div class="k">Buy advantage over Avoid ${help('Average Buy result minus average Avoid result. This was previously called spread.')}</div><div class="v ${b.buy_minus_avoid_pct>=0?'good':'bad'}">${pct(b.buy_minus_avoid_pct)}</div></div>
    <div class="stat"><div class="k">Likely Buy advantage ${help('A likely range after allowing for stronger and weaker test dates. This was previously called the 90% spread CI.')}</div><div class="smallv">${ci.length?`${pct(ci[0])} to ${pct(ci[1])}`:'—'}</div></div>
    <div class="stat"><div class="k">${primaryPractical?'Practical Target on time':'Practical value reached'} ${help(primaryPractical?'Of completed Practical Targets, the percentage reached within the size-based deadline shown in the second success test. Late and still-waiting cases are separate.':'Of completed Practical value goals, the percentage reached before their allowed time ended. Goals already below the Buy price and goals still in progress are kept separate.')}</div><div class="v">${(primaryPractical?.hit_rate_pct??t.hit_rate_pct)==null?'—':(primaryPractical?.hit_rate_pct??t.hit_rate_pct)+'%'}</div></div>
    <div class="stat"><div class="k">Test dates ${help('The number of historical dates on which the system made a fresh set of decisions. Previously called cohorts.')}</div><div class="v">${num(b.cohorts)}</div></div>
    <div class="stat"><div class="k">Decision dates</div><div class="smallv">${esc(entries[0]||'—')}<br>${esc(entries[1]||'—')}</div></div>
  </div></div></div>
  <div class="panel"><div class="body note"><b>What this backtest can and cannot prove ${help('Important limits that should be read before relying on the headline results.')}</b><p>${esc(b.data_quality?.warning||'No data warning was recorded.')}</p><p>Data source: ${esc(b.provider||'Older saved sources')}<br>Saved data version: ${esc(b.snapshot_id||'Not applicable')}<br>Companies included: ${esc(universe)}<br>How often a value was checked: ${esc(sampling)}<br>Main value method: <b>${esc(t.primary_model||b.strategy?.primary_target)}</b></p><div class="callout">${esc(independence)}</div>${sample?`<p>All calculations use ${num(sample.total)} decisions. The stock table shows a safe sample of ${num(sample.displayed)} rows because the raw licensed data cannot be published.</p>`:''}${b.public_data_boundary?`<p><a href="${esc(b.public_data_boundary.attribution_url)}">${esc(b.public_data_boundary.attribution)}</a> · licensed source records are not exposed.</p>`:''}</div></div>
  </section>`}

function successContract(b){let a=b.buy_return_achievement||{},c=a.primary_success_contract;if(!a.views?.episodes)return '';if(!c){let old=a.views.episodes.matrix?.['30']?.['365']||{};return `<section class="panel"><div class="head"><h2>Our two success tests</h2></div><div class="body"><div class="goal-banner"><strong>+30% within one year: ${old.hit_rate_pct??'—'}%</strong><span>${num(old.reached)} of ${num(old.evaluable)} completed Buy episodes reached the fixed goal. Run the upgraded replay to add the separate Practical Target deadline test and stock-level evidence.</span></div></div></section>`}let f=c.fixed_30_within_one_year||{},timing=c.fixed_30_timing||{},p=c.practical_target_with_compounding_deadline||{},bands=p.by_deadline_years||{},episodeCount=a.episode_details?.length??a.views.episodes.observations;let bandRows=Object.values(bands).sort((x,y)=>x.deadline_years-y.deadline_years).map(x=>`<div class="deadline-step"><b>${x.deadline_years} year${x.deadline_years===1?'':'s'}</b><small>${x.hit_rate_pct==null?'No completed cases':x.hit_rate_pct+'% on time · '+num(x.reached)+'/'+num(x.evaluable)}</small></div>`).join('');return `<section class="panel" id="success-contract"><div class="head"><h2>Our two success tests ${help('Every continuous Buy period is tested once. The fixed +30% promise and the stock-specific Practical Target remain separate.')}</h2><span class="hint meta">${num(episodeCount)} Buy episodes · first Buy starts the clock</span></div><div class="body"><div class="success-tests"><div class="success-card"><h3>1. Did it reach +30% within one year?</h3><p class="note">The same fixed minimum goal for every Buy episode.</p><div class="success-main"><span class="success-rate ${f.hit_rate_pct>=50?'good':'warn'}">${f.hit_rate_pct==null?'—':f.hit_rate_pct+'%'}</span><span class="success-count">${num(f.reached)} reached · ${num(f.evaluable)} completed</span></div><div class="success-metrics"><div class="success-metric">Typical time<b>${f.median_days_to_hit==null?'—':num(f.median_days_to_hit)+' days'}</b></div><div class="success-metric">One-year result still waiting<b>${num(f.active)}</b></div><div class="success-metric">Reached in year 2<b>${num(timing.during_year_two)}</b></div><div class="success-metric">Reached in year 3<b>${num(timing.during_year_three)}</b></div><div class="success-metric">Reached after 3 years<b>${num(timing.after_three_years)}</b></div><div class="success-metric">Never within 3 years<b>${num(timing.never_within_three_years)}</b></div><div class="success-metric">Still inside 3-year follow-up<b>${num(timing.still_waiting)}</b></div></div></div><div class="success-card"><h3>2. Did it reach its Practical Target on time?</h3><p class="note">Each frozen target gets a deadline based on the size of its expected gain.</p><div class="success-main"><span class="success-rate ${p.hit_rate_pct>=50?'good':'warn'}">${p.hit_rate_pct==null?'—':p.hit_rate_pct+'%'}</span><span class="success-count">${num(p.reached)} on time · ${num(p.evaluable)} completed</span></div><div class="success-metrics"><div class="success-metric">Typical time<b>${p.median_days_to_hit==null?'—':num(p.median_days_to_hit)+' days'}</b></div><div class="success-metric">Reached late<b>${num(p.reached_late)}</b></div><div class="success-metric">Deadline passed<b>${num(p.expired)}</b></div><div class="success-metric">Still waiting<b>${num(p.active)}</b></div><div class="success-metric">Valid targets<b>${num(p.observations)}</b></div><div class="success-metric">Beyond 5-year range<b>${num(p.outside_five_year_range)}</b></div></div></div></div><div class="deadline-ladder">${bandRows||'<div class="note">No Practical Target deadline groups are available.</div>'}</div><p class="note">Deadline rule: up to +30% gets 1 year; about +70% gets 2 years; +120% gets 3 years; and +271% gets 5 years. A late hit remains visible but is not counted as an on-time success.</p></div></section>`}

const renderSuccessContract=successContract;
successContract=function(b){let html=renderSuccessContract(b),c=b.buy_return_achievement?.primary_success_contract||{},timing=c.fixed_30_timing||{},f=c.fixed_30_within_one_year||{},p=c.practical_target_with_compounding_deadline||{},missCounts=c.fixed_30_miss_breakdown?.counts||{},missTotal=Object.values(missCounts).reduce((a,x)=>a+(x||0),0),missRows=missTotal?`<div class="deadline-ladder"><div class="deadline-step"><b>${num(missCounts.stayed_at_or_below_entry)}</b><small>Never above entry price</small></div><div class="deadline-step"><b>${num(missCounts.modest_gain_short_of_target)}</b><small>Gained, but well short</small></div><div class="deadline-step"><b>${num(missCounts.close_but_short_of_target)}</b><small>Came close, but short</small></div><div class="deadline-step"><b>${num(missCounts.near_target_no_qualifying_close)}</b><small>Near target, no qualifying close</small></div></div><p class="note">Why the ${num(missTotal)} stocks that never reached +30% within 3 years fell short, grouped by how close the price actually got (peak return over the full 3 years). Filterable below as “never reached” reasons.</p>`:'';return html.replace('Never within 3 years','Did not reach after full 3 years').replace('Deadline passed','Did not reach by deadline').replace('<div class="success-metric">Still inside 3-year follow-up',`<div class="success-metric">Excluded from this 1-year result<b>${num(f.excluded)}</b></div><div class="success-metric">Ended early anywhere in 3-year window · not counted<b>${num(timing.closed_early_excluded)}</b></div><div class="success-metric">Business ended early · counted failure<b>${num(timing.closed_early_failure)}</b></div><div class="success-metric">Missed within 1 year · still tracking to year 3<b>${num(timing.missed_within_one_year_tracking)}</b></div><div class="success-metric">Still inside 3-year follow-up`).replace('<div class="success-metric">Still waiting<b>',`<div class="success-metric">Ended early · not counted<b>${num(p.excluded)}</b></div><div class="success-metric">Still waiting<b>`).replace('</div></div><div class="success-card"><h3>2.',`</div>${missRows}</div><div class="success-card"><h3>2.`)};

function strategyCard(b){let s=b.strategy||{},a=b.artifact||{},r=b.runtime_contract||{},entries=actualEntryRange(b),models=(s.target_models||[]).join(', '),cost=(s.slippage_bps??0)+(s.transaction_cost_bps??0),exitCost=(s.exit_slippage_bps??0)+(s.exit_transaction_cost_bps??0);let main=[
  ['Dates tested',entries.join(' → '),'The first and last dates on which the system made a historical decision.'],
  ['How often we tested',`Every ${b.step_days} days · ${b.cohorts} test dates`,'Each test date freezes the information available on that date and makes a new decision.'],
  ['Stocks considered',b.screened_only?'Only stocks that passed the starting checks':'All available stocks','This defines which stocks were allowed to enter the test before Buy, Watch, or Avoid was decided.'],
  ['Price used to buy',s.entry==='next_close'?'Next available closing price':String(s.entry||'Historical closing price').replaceAll('_',' '),'The backtest does not assume we could buy before the recommendation was known.'],
  ['Market comparison',s.benchmark==='spy_total_return'?'S&P 500 including dividends':String(s.benchmark||'Average tested stock').replaceAll('_',' '),'A stock result is compared with this market result over the same dates.'],
  ['Main value goal',`+${s.minimum_upside_pct??30}% to +${s.maximum_upside_pct??100}%`,'The Practical value estimate must normally be at least 30% above the entry price. This is separate from the return explorer, where you can ask about any chosen gain.'],
  ['Time allowed for main goal',`${s.target_expiry_days??365} days normally`,'Some valuation methods use a longer period. Their exact time limit is shown in the target results.'],
  ['Buying and selling costs',`${cost/100}% when buying · ${exitCost/100}% when selling`,'These estimated costs are deducted so results do not assume free trading.'],
  ['Duplicate company rule',b.issuer_deduplication?.enabled?'One share class per company':'No company rule recorded','For companies such as Alphabet, only one representative share class is used on a test date.'],
  ['Data rule',s.data_quality_mode==='strict'?'Strict: only information known on that date':String(s.data_quality_mode||'Not recorded').replaceAll('_',' '),'This prevents later filings or later corrections from leaking into an earlier decision.']
];let technical=[['Strategy version',`${s.name||'—'} · v${s.version??'—'}`],['Strategy ID',s.strategy_id||'—'],['Code fingerprint',b.implementation_fingerprint||'Not recorded'],['Created',a.generated_at||'Not recorded'],['Source code version',r.git_commit||a.source_commit||'Not recorded'],['Full source-data dates',(b.window||[]).join(' → ')],['Warm-up data',`${b.warmup_days} days`],['Return check dates',(s.horizons_days||[]).map(x=>x+' days').join(', ')],['How a target counts as reached',`${s.target_hit||'close'} · ${b.data_quality?.universe_bias==='active_and_delisted_point_in_time'?'checked every trading day':'checked on sampled dates'}`],['Value methods',models||'—'],['Primary value method',`${s.primary_target||'practical'} · ${s.practical_target_policy||'nearest credible'}`],['Weight-change rule',s.tuning_promotion||'—'],['Extra check periods',(s.challenger_holds_days||[]).map(x=>x+' days').join(', ')],['Evidence storage',b.evidence_delivery?.mode||'inline'],['Built by',a.generator||'Not recorded']];return `<section class="panel"><div class="head"><h2>1. What rules did this backtest use?</h2><span class="hint meta">Start simple · open details when needed</span></div><div class="body"><div class="goal-banner"><strong>Main valuation goal: at least +${s.minimum_upside_pct??30}%</strong><span>The Practical estimate can range up to +${s.maximum_upside_pct??100}%. The return explorer below can test smaller or larger gains.</span></div><div class="contract">${main.map(x=>`<div class="cell"><div class="k">${esc(x[0])}${help(x[2])}</div><div class="value">${esc(x[1])}</div></div>`).join('')}</div><details class="simple-details"><summary>Open technical details needed to reproduce this test ${help('These exact IDs and settings help us prove which code and rules produced this result.')}</summary><div><div class="contract">${technical.map(x=>`<div class="cell"><div class="k">${esc(x[0])}${help('Recorded so this exact backtest can be checked or run again.')}</div><div class="value">${esc(x[1])}</div></div>`).join('')}</div></div></details></div></section>`}

function validation(b){let h=health(b),buy=b.by_verdict?.Buy||{},maxN=Math.max(...['Buy','Watch','Avoid'].map(v=>b.by_verdict?.[v]?.n||0),1),cards=['Buy','Watch','Avoid'].map(v=>{let x=b.by_verdict?.[v]||{};return `<div class="result-card"><div class="result-main">${statusTag(v)}<span class="result-number ${x.mean_alpha_pct>=0?'good':'bad'}">${pct(x.mean_alpha_pct)}</span></div><div class="bar"><span style="width:${Math.max(2,(x.n||0)/maxN*100)}%"></span></div><b>${num(x.n)} decisions checked</b><p class="note">Average extra return versus the S&P 500: <b>${pct(x.mean_alpha_pct)}</b><br>Typical extra return: <b>${pct(x.median_alpha_pct)}</b></p></div>`}).join('');let criteria=[
  ['Buy advantage over Avoid',b.buy_minus_avoid_pct>0,pct(b.buy_minus_avoid_pct),'Average Buy result minus average Avoid result. Positive is better.'],
  ['Likely Buy advantage across different test dates',b.significant===true,(b.spread_ci90||[]).map(pct).join(' to ')||'—','A likely range after allowing for stronger and weaker test dates. The old name was “cohort 90% CI”.'],
  ['More cautious likely range',(b.spread_ci90_two_way||[])[0]>0,(b.spread_ci90_two_way||[]).map(pct).join(' to ')||'—','A stricter range that allows for different test dates and the same company appearing again. The old name was “cohort + issuer CI”.'],
  ['Results improve from Avoid to Watch to Buy',b.monotonic===true,b.monotonic?'Yes':'No','Checks whether the three labels are ordered in the direction we intended.'],
  ['Buys beat the market more than half the time',buy.hit_rate_pct>50,(buy.hit_rate_pct??'—')+'%','The percentage of Buy decisions whose return was higher than the S&P 500 over the same period.'],
  ['Enough different test dates',b.cohorts>=30,num(b.cohorts),'More test dates reduce the chance that one unusual period controls the answer.']
];let strategyCards=Object.entries(b.by_strategy||{}).map(([k,x])=>{let xb=x.by_verdict?.Buy||{},xa=x.by_verdict?.Avoid||{};return `<div class="card"><h3>${esc(k.replaceAll('_',' '))}</h3><p>Rules used: <b>${esc(String(x.preset||'default').replaceAll('_',' '))}</b>${help('The scoring weights used by the live strategy were replayed separately.')}</p><div class="grid2"><div><span class="k">Buy decisions</span><div class="smallv">${num(xb.n)} · ${pct(xb.mean_alpha_pct)} extra</div></div><div><span class="k">Avoid decisions</span><div class="smallv">${num(xa.n)} · ${pct(xa.mean_alpha_pct)} extra</div></div></div><p><b>Buy advantage over Avoid: ${pct(x.buy_minus_avoid_pct)}</b></p></div>`}).join('');return `<section class="panel"><div class="head"><h2>2. How reliable are these results? ${help('These checks look for evidence that Buy decisions behaved better than Watch and Avoid decisions, while allowing for repeated dates and companies.')}</h2>${tag(`${h.positive} of ${h.checks.length} checks passed`,h.pass?'good':'warn')}</div><div class="body"><div class="plain-grid">${cards}</div><p class="note">“Extra return” means the stock's ${b.hold_days}-day return minus the S&P 500 return over the same dates. Repeated recommendations are counted here, so the cautious ranges below make that repetition visible.</p><h3>Six reliability checks</h3><div class="criteria">${criteria.map(c=>`<div class="criterion">${tag(c[1]?'Passed':'Needs review',c[1]?'good':'warn')}<b>${esc(c[0])}${help(c[3])}</b><span class="answer">${esc(c[2])}</span></div>`).join('')}</div><details class="simple-details"><summary>Open results for each live strategy ${help('Deep Value and Quality Growth are checked separately using their own live scoring rules.')}</summary><div><div class="strategy-cards">${strategyCards||'<p>Not available</p>'}</div><p class="note">A stock that passes both starting checks is placed in Deep Value, matching the live recommendations page.</p></div></details></div></section>`}

function horizons(b){let rows=Object.values(b.horizon_summary||{}).map(x=>{let buy=x.by_verdict?.Buy||{},avoid=x.by_verdict?.Avoid||{},market=(buy.mean_raw_return_pct??0)-(buy.mean_alpha_pct??0),ci=x.spread_ci90_cohort||[],two=x.spread_ci90_two_way||[];return `<tr><td><b>${num(x.calendar_days)} days</b><br><span class="meta">about ${x.approximately_months} months</span></td><td class="num">${num(buy.n)}</td><td class="num">${pct(buy.mean_raw_return_pct)}</td><td class="num">${pct(market)}</td><td class="num ${buy.mean_alpha_pct>=0?'good':'bad'}"><b>${pct(buy.mean_alpha_pct)}</b></td><td class="num">${pct(avoid.mean_alpha_pct)}</td><td class="num">${pct(x.buy_minus_avoid_pct)}</td><td class="num">${ci.length?ci.map(pct).join(' to '):'—'}</td><td class="num">${two.length?two.map(pct).join(' to '):'—'}</td><td>${tag(x.significant?'Passed':'Needs review',x.significant?'good':'warn')} ${tag(x.monotonic?'Ordered correctly':'Not ordered',x.monotonic?'good':'warn')}</td></tr>`}).join('');return rows?`<section class="panel"><div class="head"><h2>3. Does the Buy advantage last over time? ${help('The same decisions are checked after several holding periods, so we can see whether the result is short-lived or persistent.')}</h2><span class="hint meta">Trading costs included</span></div><div class="body"><div class="callout"><b>Read this first:</b> A negative Buy extra return means FairEntry Buys did worse than simply holding the S&P 500 for the same time. The Buy return and S&P 500 return are shown side by side.</div></div><details class="simple-details" open><summary>Open the results by holding period</summary><div class="tablewrap"><table><thead><tr><th>Time held</th><th class="num">Buy decisions</th><th class="num">Buy return</th><th class="num">S&P 500 return</th><th class="num">Buy extra return ${help('Buy return minus the S&P 500 return over the same matched dates. Negative means the S&P 500 did better.')}</th><th class="num">Avoid extra return</th><th class="num">Buy advantage over Avoid</th><th class="num">Likely range by test date ${help('Allows for stronger and weaker test dates. Previously called cohort CI.')}</th><th class="num">More cautious likely range ${help('Also allows for the same company appearing more than once.')}</th><th>Check result</th></tr></thead><tbody>${rows}</tbody></table></div></details><div class="body note">The 365-day row is one year; 730, 1,095 and 1,825 days are two, three and five years. Recent recommendations without enough time remain incomplete, not failures. A positive Buy return is not enough when the S&P 500 earned more over the same dates.</div></section>`:''}

function weightValidation(b){
  let w=b.weight_validation;if(!w)return '';
  if(!w.ok)return `<section class="panel"><div class="head"><h2>4. Can different weights improve one-year Buy results?</h2>${tag('Keep current weights','warn')}</div><div class="body"><div class="callout"><b>The weight test could not be completed:</b> ${esc(w.reason||'Not enough completed history.')}</div><p class="note">The live default was not changed.</p></div></section>`;
  let policy=w.policy||{},primary=policy.primary_gain_pct??25,secondary=policy.secondary_gain_pct??30,
      rate=x=>x==null?'—':Number(x).toFixed(1)+'%', signed=x=>x==null?'—':pct(x),
      dates=Object.entries(w.split||{}).map(([key,x])=>`<tr><td><b>${esc(key==='development'?'Older dates used to choose':key==='validation'?'Later dates used to reject weak choices':'Final untouched dates')}</b></td><td>${esc(x.first)} → ${esc(x.last)}</td><td class="num">${num(x.cohorts)}</td></tr>`).join(''),
      weights=(w.active_categories||[]).map(key=>{let old=w.current_weights?.[key],next=w.challenger_weights?.[key],change=(typeof old==='number'&&typeof next==='number')?next-old:null;return `<tr><td><b>${esc(key.replaceAll('_',' '))}</b></td><td class="num">${rate(old)}</td><td class="num">${rate(next)}</td><td class="num ${change>=0?'good':'bad'}">${signed(change)}</td></tr>`}).join(''),
      splitRows=['development','validation','test'].map(key=>{let old=w.current?.[key]||{},next=w.challenger?.[key]||{},label=key==='development'?'Older dates used to choose':key==='validation'?'Later check':'Final untouched check';return `<tr><td><b>${label}</b></td><td class="num">${num(old.completed_episodes)}</td><td class="num">${rate(old.primary_hit_rate_pct)}</td><td class="num">${rate(next.primary_hit_rate_pct)}</td><td class="num">${rate(old.secondary_hit_rate_pct)}</td><td class="num">${rate(next.secondary_hit_rate_pct)}</td><td class="num">${rate(old.large_loss_rate_pct)}</td><td class="num">${rate(next.large_loss_rate_pct)}</td><td class="num">${signed(old.mean_one_year_alpha_pct)}</td><td class="num">${signed(next.mean_one_year_alpha_pct)}</td></tr>`}).join(''),
      checkValue=(value,id)=>value==null?'—':(['enough_episodes','all_episodes','all_issuers','years','sectors'].includes(id)?num(value):rate(value)),
      checks=(rows,title)=>`<div class="card"><h3>${title}</h3><div class="criteria">${(rows||[]).map(x=>`<div class="criterion">${tag(x.passed?'Passed':'Did not pass',x.passed?'good':'warn')}<b>${esc(x.label)}${help(x.rule)}</b><span class="answer">Current ${checkValue(x.current,x.id)} → challenger ${checkValue(x.challenger,x.id)}</span></div>`).join('')}</div></div>`,
      oldAll=w.current?.all||{},newAll=w.challenger?.all||{},status=w.promotion_eligible?'Ready for manual review':'Keep current weights';
  return `<section class="panel"><div class="head"><h2>4. Can different weights improve one-year Buy results? ${help(`The main goal is one Buy episode reaching +${primary}% within one year. Repeated weekly Buys are not separate investments.`)}</h2>${tag(status,w.promotion_eligible?'good':'warn')}</div><div class="body"><div class="goal-banner"><strong>Goal: improve +${primary}% within one year</strong><span>Protect +${secondary}%, large losses, typical declines and the one-year result versus the S&amp;P 500.</span></div><div class="callout"><b>No automatic change:</b> ${esc(w.promotion_note)} The result shown here is a challenger, not a new default.</div><div class="plain-grid"><div class="result-card"><div class="k">Current weights</div><div class="v">${rate(oldAll.primary_hit_rate_pct)}</div><p class="note">Reached +${primary}%: ${num(oldAll.primary_reached)} of ${num(oldAll.completed_episodes)} completed Buy episodes<br>Likely range: ${(oldAll.primary_hit_ci90||[]).map(rate).join(' to ')||'—'}<br>Different companies: ${num(oldAll.unique_issuers)}</p></div><div class="result-card"><div class="k">Challenger weights</div><div class="v ${newAll.primary_hit_rate_pct>oldAll.primary_hit_rate_pct?'good':'bad'}">${rate(newAll.primary_hit_rate_pct)}</div><p class="note">Reached +${primary}%: ${num(newAll.primary_reached)} of ${num(newAll.completed_episodes)} completed Buy episodes<br>Likely range: ${(newAll.primary_hit_ci90||[]).map(rate).join(' to ')||'—'}<br>Different companies: ${num(newAll.unique_issuers)}</p></div><div class="result-card"><div class="k">Decision</div><div class="v">${esc(status)}</div><p class="note">${num(w.candidates_evaluated)} total choices checked: the current weights plus ${num(w.candidates_generated)} generated challengers.<br>The configured default remains unchanged.</p></div></div><details class="simple-details" open><summary>Compare the current and challenger results</summary><div class="tablewrap"><table><thead><tr><th>Historical period</th><th class="num">Current completed episodes</th><th class="num">Current +${primary}%</th><th class="num">Challenger +${primary}%</th><th class="num">Current +${secondary}%</th><th class="num">Challenger +${secondary}%</th><th class="num">Current large losses</th><th class="num">Challenger large losses</th><th class="num">Current extra return</th><th class="num">Challenger extra return</th></tr></thead><tbody>${splitRows}</tbody></table></div></details><details class="simple-details"><summary>Open the exact current and challenger weights</summary><div class="tablewrap"><table><thead><tr><th>Tested area</th><th class="num">Current effective weight</th><th class="num">Challenger weight</th><th class="num">Change</th></tr></thead><tbody>${weights}</tbody></table></div><p class="note">${(w.inactive_categories||[]).map(x=>esc(x.replaceAll('_',' '))).join(' and ')} remain information only and have zero verdict weight.</p></details><details class="simple-details"><summary>Open every pass/fail condition</summary><div class="grid2">${checks(w.validation_checks,'Later-date checks')}${checks(w.test_checks,'Final untouched checks')}${checks(w.sample_checks,'Sample-size checks')}<div class="card"><h3>Consistency across years and business areas</h3>${tag(w.stability?.passed?'Passed':'Did not pass',w.stability?.passed?'good':'warn')}<p>${rate(w.stability?.not_materially_worse_pct)} of comparable groups were not materially worse.</p><p class="note">${esc(w.stability?.rule||'')}</p></div></div></details><details class="simple-details"><summary>Open the dates used for choosing and checking</summary><div class="tablewrap"><table><thead><tr><th>Purpose</th><th>Date range</th><th class="num">Decision dates</th></tr></thead><tbody>${dates}</tbody></table></div></details></div></section>`
}

function exactReplayWeights(b){let w=b.weight_validation;if(!w?.ok)return '';let names={growth:'Growth',quality:'Business quality',valuation:'Valuation',confirmation:'Market confirmation',survival:'Financial survival'},order=['growth','quality','valuation','confirmation','survival'],rows=order.filter(k=>w.current_weights?.[k]!=null).map(k=>`<tr><td><b>${names[k]||esc(k)}</b></td><td class="num"><b>${Number(w.current_weights[k]).toFixed(2)}%</b></td><td class="num">${w.challenger_weights?.[k]==null?'â€”':Number(w.challenger_weights[k]).toFixed(2)+'%'}</td></tr>`).join('');return `<section class="panel"><div class="head"><h2>Exact weights used in this SFA replay ${help('These are the actual percentage shares used to calculate every historical tested score.')}</h2><span class="hint meta">Run ${esc(b.run_id||'')}</span></div><div class="body"><div class="goal-banner"><strong>These are the replayed weights, not suggested ranges.</strong><span>The board displays the same percentages for today's live decisions.</span></div><div class="tablewrap"><table><thead><tr><th>Tested area</th><th class="num">SFA replay weight</th><th class="num">Best rejected challenger</th></tr></thead><tbody>${rows}</tbody></table></div><p class="note">Catalysts, news and risk notes had 0% verdict weight because they were not reproduced historically. The former 18, 5, 27, 15, 15 display scale is preserved as “Previous displayed weights (same proportions).” It produces the same score because its proportions are identical.</p></div></section>`}
function groupedReturns(rows,keyFn,hold){let groups={};rows.forEach(o=>{let r=o.horizons?.[String(hold)]?.return_pct;if(typeof r!=='number')return;let k=keyFn(o)||'Unknown';let g=groups[k]||(groups[k]={Buy:[],Watch:[],Avoid:[],tickers:new Set()});(g[o.verdict]||=[]).push(r);g.tickers.add(o.ticker)});return Object.entries(groups).map(([key,g])=>({key,unique:g.tickers.size,n:g.Buy.length+g.Watch.length+g.Avoid.length,Buy:mean(g.Buy),Watch:mean(g.Watch),Avoid:mean(g.Avoid)}))}
function stability(b){let obs=b.observations||[],hold=b.hold_days||30,summary=b.evidence_return_summary||{},years=(summary.by_year||groupedReturns(obs,o=>(o.entry_date||'').slice(0,4),hold)).sort((a,c)=>a.key.localeCompare(c.key)),sectors=(summary.by_sector||groupedReturns(obs,o=>o.sector,hold)).sort((a,c)=>(c.n-a.n)).slice(0,12),coh=[...(b.per_cohort||[])].filter(x=>typeof x.buy_alpha_pct==='number').sort((a,c)=>a.buy_alpha_pct-c.buy_alpha_pct),worst=coh[0],best=coh[coh.length-1],pros=b.survivorship_control||{},sfa=b.data_quality?.universe_bias==='active_and_delisted_point_in_time';let table=rows=>`<div class="tablewrap"><table><thead><tr><th>Group</th><th class="num">Observations</th><th class="num">Unique</th><th class="num">Buy raw</th><th class="num">Watch raw</th><th class="num">Avoid raw</th></tr></thead><tbody>${rows.map(x=>`<tr><td>${esc(x.key)}</td><td class="num">${num(x.n)}</td><td class="num">${num(x.unique)}</td><td class="num">${pct(x.Buy)}</td><td class="num">${pct(x.Watch)}</td><td class="num">${pct(x.Avoid)}</td></tr>`).join('')}</tbody></table></div>`;return `<section class="panel"><div class="head"><h2>3. Stability and concentration</h2><span class="hint meta">Full-population raw returns at ${hold} days</span></div><div class="body"><div class="grid2"><div class="card"><h3>By entry year</h3>${table(years)}</div><div class="card"><h3>By sector (largest samples)</h3>${table(sectors)}</div></div><div class="grid3"><div class="card"><h3>Worst Buy cohort</h3><div class="v bad">${worst?pct(worst.buy_alpha_pct):'—'}</div><p class="note">${worst?`${esc(worst.entry)} · ${worst.buy_n} Buys · cohort return ${pct(worst.mkt_return_pct)}`:'Not available'}</p></div><div class="card"><h3>Best Buy cohort</h3><div class="v good">${best?pct(best.buy_alpha_pct):'—'}</div><p class="note">${best?`${esc(best.entry)} · ${best.buy_n} Buys · cohort return ${pct(best.mkt_return_pct)}`:'Not available'}</p></div><div class="card"><h3>Evidence availability</h3><div class="availability"><div class="row"><b>Historical replay</b><br>${tag(sfa?'Included · point-in-time active + delisted':'Included · current survivors',sfa?'good':'warn')}</div><div class="row"><b>Prospective signal comparison</b><br>${tag(`${num(pros.prospective_signal_events||0)} signals · ${pros.status||'not bundled'}`,pros.prospective_signal_events?'good':'warn')}</div><div class="row"><b>Default vs challenger weights</b><br>${tag('Workflow summary only','warn')}</div></div></div></div><p class="note">Year and sector tables show full-population raw outcome returns, not independently bootstrapped alpha. Prospective signals are reported separately and never mixed into historical replay.</p>${qualityPanel(obs)}</div></section>`}
function qualityPanel(obs){let counts={};obs.forEach(o=>{let q=o.quality_grade||'unknown';counts[q]=(counts[q]||0)+1});let total=obs.length||1;return `<div class="card"><h3>Data-quality distribution ${DATA?.public_evidence_sample?'(display sample)':''}</h3><div class="stats">${Object.entries(counts).map(([k,n])=>`<div class="stat"><div class="k">${esc(k.replaceAll('_',' '))}</div><div class="v">${num(n)}</div><div class="meta">${(n/total*100).toFixed(1)}%</div></div>`).join('')}</div><p class="note">Coverage counts only observed evidence; neutral defaults no longer masquerade as available data. Public quality counts describe the licensed-data-safe drill-down sample.</p></div>`}

function ciText(x){return x?.length?`${x[0].toFixed(1)}–${x[1].toFixed(1)}%`:'—'}
function expiryText(x){return x?.length?(x[0]===x[1]?x[0]+'d':x[0]+'–'+x[1]+'d'):'—'}
function methods(b){let m=b.target_method_summary||{},rows=Object.keys(m).map(k=>{let x=m[k];return `<tr><td><b>${esc(k.replaceAll('_',' '))}</b></td><td class="num">${num(x.observations)}</td><td class="num">${num(x.unique_stocks)}</td><td class="num">${num(x.unique_cohorts)}</td><td class="num">${num(x.already_above_at_entry)}</td><td class="num">${num(x.active)}</td><td class="num">${num(x.reached)}</td><td class="num">${num(x.expired)}</td><td class="num">${num(x.evaluable)}</td><td class="num">${x.hit_rate_pct==null?'—':x.hit_rate_pct+'%'}</td><td class="num">${ciText(x.hit_rate_ci90)}</td><td class="num">${ciText(x.hit_rate_cohort_ci90)}</td><td class="num">${ciText(x.hit_rate_two_way_ci90)}</td><td class="num">${x.median_days_to_target??'—'}</td><td class="num">${pct(x.median_upside_pct)}</td><td class="num">${expiryText(x.expiry_days_range)}</td></tr>`}).join('');return `<section class="panel"><div class="head"><h2>6. Did each estimated value get reached? ${help('Compares every value estimate made on a Buy date with the later daily prices.')}</h2><span class="hint meta">Buy decisions only</span></div><div class="body"><div class="goal-banner"><strong>The +100% setting is not a maximum possible gain.</strong><span>It only stops the main valuation method from choosing an implausibly distant value. Actual gains can be higher, and the return explorer now checks through +200%.</span></div><div class="callout"><b>How the reached percentage is calculated:</b> reached later ÷ (reached later + time ended). Values already below the Buy price are labeled “Already above on Buy day,” not successes. Goals still in progress are not failures.</div><details class="simple-details"><summary>Open the detailed results for every value method</summary><div class="tablewrap"><table><thead><tr><th>Value method</th><th class="num">Available estimates</th><th class="num">Different stocks</th><th class="num">Different test dates</th><th class="num">Already above on Buy day</th><th class="num">Still in progress</th><th class="num">Reached later</th><th class="num">Time ended</th><th class="num">Completed cases</th><th class="num">Reached percentage</th><th class="num">Simple likely range ${help('A likely range based on the number of completed cases.')}</th><th class="num">Range allowing for test dates ${help('Allows for stronger and weaker historical test dates.')}</th><th class="num">Most cautious range ${help('Allows for both repeated test dates and repeated companies.')}</th><th class="num">Typical days to reach</th><th class="num">Typical estimated gain</th><th class="num">Time allowed</th></tr></thead><tbody>${rows}</tbody></table></div></details><p class="note">Different value methods can have different time limits. Compare both the reached percentage and the “Time allowed” column; a four-year goal is not directly comparable with a one-year goal.</p></div></section>`}

function sfaExtras(b){if(!b.regime_summary)return '';let p=b.portfolio_summary||{},reg=Object.entries(b.regime_summary).map(([k,v])=>`<tr><td>${esc(k)}</td><td class="num">${num(v.cohorts)}</td><td class="num">${pct(v.mean_buy_alpha_pct)}</td></tr>`).join('');return `<section class="panel"><div class="head"><h2>SFA regime and portfolio diagnostics</h2><span class="hint meta">Point-in-time historical universe</span></div><div class="body grid2"><div class="card"><h3>Market regimes</h3><table><thead><tr><th>Regime</th><th class="num">Cohorts</th><th class="num">Buy alpha</th></tr></thead><tbody>${reg}</tbody></table></div><div class="card"><h3>Constrained Buy portfolio</h3><p>Cohort periods: <b>${num(p.cohort_periods)}</b> · cash periods: <b>${num(p.cash_periods)}</b><br>Positions traded: <b>${num(p.positions_traded)}</b> · maximum per cohort: <b>${num(p.max_positions_per_cohort)}</b><br>Compounded return: <b>${pct(p.compounded_return_pct)}</b><br>Maximum drawdown (${esc(p.drawdown_frequency||'endpoints')}): <b>${pct(p.max_drawdown_pct)}</b><br>Annualized Sharpe: <b>${p.annualized_sharpe_approx??'—'}</b></p><p class="note">Equal-weight highest-score Buys; no-Buy cohorts remain in cash; configured entry and exit costs are included. ${p.overlapping?'Holding windows overlap.':'Default cohort spacing is non-overlapping.'}</p></div></div></section>`}

function returnHorizonLabel(days){return days===90?'3 months':days===180?'6 months':days===270?'9 months':days===365?'1 year':days===730?'2 years':days===1095?'3 years':days===1825?'5 years':days+' days'}
function returnExplorer(b){let a=b.buy_return_achievement;if(!a?.views?.episodes)return '';let thresholds=a.thresholds_pct||[],horizons=a.horizons_days||[];return `<section class="panel" id="return-explorer"><div class="head"><h2>5. How often did a Buy reach my chosen gain?</h2><span class="hint meta">Trading costs included</span></div><div class="body"><div class="goal-banner"><strong>The main valuation goal is +30%.</strong><span>This explorer is different: choose any gain from +${Math.min(...thresholds)}% to +${Math.max(...thresholds)}% and see what happened historically.</span></div><p class="note">Choose a gain and a time period. We show how many completed cases reached it and how long successful cases took. Historical results are evidence, not a promise.</p><div class="return-controls"><label>Gain I want ${help('This is your question for the history. It does not change the main Practical valuation goal of at least +30%.')}<select id="return-threshold">${thresholds.map(x=>`<option value="${x}" ${x===30?'selected':''}>+${x}%</option>`).join('')}</select></label><label>Time I am willing to wait ${help('A case is complete only when this full amount of time has passed, unless the stock stopped trading earlier.')}<select id="return-horizon">${horizons.map(x=>`<option value="${x}" ${x===365?'selected':''}>${returnHorizonLabel(x)}</option>`).join('')}</select></label><label>How repeated Buys are counted ${help('A Buy signal is every date the system said Buy. A Buy episode combines consecutive Buy signals for the same company into one investment story, starting with the first Buy.')}<select id="return-view"><option value="episodes" selected>One continuous Buy period per company</option><option value="signals">Every date that said Buy</option></select></label></div><div class="return-stats"><div class="stat"><div class="k" id="return-rate-label">Reached goal</div><div class="v good" id="return-rate">—</div><div class="meta" id="return-count"></div></div><div class="stat"><div class="k">Typical time among successes</div><div class="v" id="return-days">—</div><div class="meta" id="return-days-range"></div></div><div class="stat"><div class="k">Likely historical range ${help('A range that shows the uncertainty caused by having a limited number of completed cases.')}</div><div class="v" id="return-ci">—</div><div class="meta">Incomplete cases are not treated as failures</div></div></div><div class="return-chart"><div class="return-chart-head"><h3 id="return-chart-title">Percentage reaching the chosen gain over time</h3><span class="meta" id="return-view-note"></span></div><svg id="return-svg" role="img" aria-label="Percentage of completed Buy cases reaching the selected return over time"></svg><div class="return-detail"><b id="return-detail-main"></b><span class="meta" id="return-detail-more"></span></div></div><details class="simple-details"><summary>Open every gain and time combination</summary><div class="tablewrap"><table class="return-matrix"><thead><tr><th>Chosen gain</th>${horizons.map(x=>`<th class="num">${returnHorizonLabel(x)}</th>`).join('')}</tr></thead><tbody id="return-matrix"></tbody></table></div></details><div class="callout" style="margin-top:14px"><b>Why two counting choices?</b> “One continuous Buy period” avoids making five consecutive Buy dates look like five independent investments. “Every date” remains available so you can inspect every decision the system actually made.</div><details class="simple-details"><summary>Open the exact counting rules</summary><div class="note">${esc(a.episode_definition)} ${esc(a.active_policy)}</div></details></div></section>`}
function missReasonLabel(code){return ({stayed_at_or_below_entry:'Never above entry price',modest_gain_short_of_target:'Gained, but well short',close_but_short_of_target:'Came close, but short',near_target_no_qualifying_close:'Near target, no qualifying close'})[code]||''}
function fixedEpisodeLabel(x){return ({within_one_year:'Reached within 1 year',during_year_two:'Reached during year 2',during_year_three:'Reached during year 3',after_three_years:'Reached after 3 years',never_within_three_years:'Did not reach within 3 years',closed_early_failure:'Business ended early',closed_early_excluded:'Result unavailable',missed_within_one_year_tracking:'Missed within 1 year · tracking',still_waiting:'Still waiting'})[x.fixed_30_status]||'Not available'}
function practicalEpisodeLabel(p){return ({reached:'Reached on time',reached_late:'Reached late',expired:'Did not reach by deadline',closed_early_failure:'Business ended early',closed_early_excluded:'Result unavailable',active:'Still waiting',unavailable:'No valid target',already_above_at_entry:'Already above on Buy day'})[p?.status]||'Not available'}
function practicalMethodLabel(method){return ({peer_ps:'Peer sales comparison',fcf:'Free cash flow value',fundamental:'Combined fundamental value'})[method]||'No usable method'}
function practicalUnavailableReason(p){return p?.reason||(p?.status==='unavailable'?'No tested stock-specific value was both credible and inside the allowed Practical Target gain range.':'')}
function reasonEvidence(r){return (r?.evidence||[]).filter(x=>x.value!=null).map(x=>`<li>${esc(x.label)}: <b>${esc(x.value)}${esc(x.unit||'')}</b></li>`).join('')}
function reasonCard(title,r,id,sharedEnding=false){if(!r)return `<div class="card" id="${id}"><h3>${esc(title)}</h3><p>No explanation was recorded.</p></div>`;let endingCodes=['acquired','merged','bankruptcy_or_liquidation','regulatory_delisting','voluntary_delisting','unclassified_trading_end'],details=sharedEnding&&endingCodes.includes(r.code)?'The shared “Why observation ended” card below explains the early ending and whether this test was counted.':r.details;return `<div class="card" id="${id}"><h3>${esc(title)}</h3><p><b>${esc(r.short||'Result explanation')}</b></p><p>${esc(details||'No further details were recorded.')}</p>${reasonEvidence(r)?`<ul class="reason-evidence">${reasonEvidence(r)}</ul>`:''}</div>`}
function terminalCard(t){if(!t)return '';let counted=t.counts_as_failure===true,label=counted?'Counted as a failed result':'Not counted in success percentage',tone=counted?'bad':'info';return `<div class="card wide-card"><h3>Why observation ended ${help('This explains why later prices stopped and whether an unfinished target is included in the success percentage.')}</h3><p><b>${esc(t.label||'The price history ended.')}</b></p><div class="counting-line">${tag(label,tone)}<span class="note">${esc(t.counting_reason||'No counting explanation was recorded.')}</span></div><p>Last available or event date: <b>${esc(t.event_date||'—')}</b>${t.successor?`<br>Recorded successor: <b>${esc(t.successor)}</b>`:''}</p></div>`}
function currencyCard(c,p){if(!c)return '';let converted=c.converted_fcf_usd_rounded_millions!=null?`About $${num(c.converted_fcf_usd_rounded_millions)} million`:c.converted_fcf_usd!=null?money(c.converted_fcf_usd):'Not available',check=c.country_check==='review'?'Currency and country need review':c.country_check==='matches'?'Currency matches country':'Country check not available',method=p?.selected_method,relevance=method==='fcf'?'FCF set this Practical Target.':method==='fundamental'?'FCF may be one part of the combined fundamental value.':method?`FCF did not set this Practical Target. The selected method was ${practicalMethodLabel(method)}.`:'This calculation did not produce the selected Practical Target.';return `<div class="card wide-card"><h3>Historical FCF currency calculation ${help('The reporting currency and exchange rate come from the same historical financial report. Country is only a warning check and never supplies the rate.')}</h3><p><b>${esc(relevance)}</b></p><p>Reporting currency: <b>${esc(c.reporting_currency||'—')}</b><br>Financial report date: <b>${esc(c.financial_report_date||'—')}</b><br>Historical exchange rate: <b>${c.historical_fxusd==null?'—':num(c.historical_fxusd)+' local currency per US dollar'}</b><br>Converted FCF: <b>${converted}</b><br>Country check: <b>${esc(check)}</b></p><p class="note">${esc(c.calculation||c.reason||'No FCF currency calculation was available.')} ${c.licensed_amounts_redacted?'The public page rounds the converted amount; exact licensed values remain in the private local result.':''}</p></div>`}
function countingEvidence(e){if(!e)return '';let counted=e.counted_in_success_rate===true,label=counted?'Yes — counted':'No — not counted',tone=counted?'good':e.result==='active'?'warn':'info';return `<div class="counting-line">${tag(label,tone)}<span class="note">${esc(e.counting_reason||'No counting explanation was recorded.')}</span></div><p>Days actually observed: <b>${num(e.observed_days)}</b><br>Days required: <b>${num(e.required_days)}</b><br>Last available price date: <b>${esc(e.last_observed_date||'—')}</b><br>Required deadline: <b>${esc(e.deadline_date||'—')}</b></p>`}
function episodeCard(x){
  let p=x.practical_target||{},fe=x.fixed_30_evaluation||{},te=(x.fixed_30_status==='closed_early_excluded'||x.fixed_30_status==='closed_early_failure'||p.status==='closed_early_excluded'||p.status==='closed_early_failure')?x.terminal_evaluation||null:null,
      fixedLabel=fixedEpisodeLabel(x),practicalLabel=practicalEpisodeLabel(p),
      fixedTone=toneForStatus(x.fixed_30_status),pTone=toneForStatus(p.status),
      fixedDays=x.days_to_30_pct==null?'—':num(x.days_to_30_pct)+' days',
      pDays=p.days_to_target==null?'—':num(p.days_to_target)+' days',
      deadline=p.deadline_years?`${p.deadline_years} year${p.deadline_years===1?'':'s'}`:'—',
      method=practicalMethodLabel(p.selected_method),reason=practicalUnavailableReason(p),
      key=String(`${x.ticker}-${x.started}`).replace(/[^a-z0-9_-]/gi,'-'),
      fixedId=`fixed-reason-${key}`,practicalId=`practical-reason-${key}`,
      fr=x.fixed_30_reason||{},pr=p.result_reason||{},ticker=esc(x.ticker||'stock'),
      fixedObserved=fe.observed_days,
      fixedWindow=typeof fixedObserved==='number'&&fixedObserved<365?`${num(fixedObserved)} observed days`:'first year',
      practicalEval={counted_in_success_rate:p.counted_in_success_rate,result:p.status==='active'?'active':p.status==='closed_early_excluded'?'excluded':null,counting_reason:p.counting_reason,observed_days:p.last_observed_days,required_days:p.deadline_days,last_observed_date:p.last_observed_date,deadline_date:p.deadline_date};
  return `<details class="episode-row"><summary><span class="episode-cell"><span class="mobile-label">Stock</span><b>${esc(x.ticker||'—')}</b><small>${esc(x.company||'')} · ${esc((x.strategy||'').replaceAll('_',' '))}</small></span><span class="episode-cell"><span class="mobile-label">First Buy</span><b>${esc(x.started)}</b><small>${num(x.buy_signals)} Buy signals</small></span><span class="episode-cell"><span class="mobile-label">Entry price</span><b>${money(x.entry_price??x.entry_price_low)}</b><small>Range ${money(x.entry_price_low)}–${money(x.entry_price_high)}</small></span><span class="episode-cell"><span class="mobile-label">+30% goal</span><b>${money(x.fixed_30_target_price)}</b></span><span class="episode-cell"><span class="mobile-label">+30% result</span>${tag(fixedLabel,fixedTone)}<small>${fixedDays}</small><a class="reason-link" href="#${fixedId}" data-reason-target="${fixedId}" aria-label="View +30% result details for ${ticker}">View details</a></span><span class="episode-cell"><span class="mobile-label">Why (+30% result)</span><small>${esc(fr.short||'—')}</small></span><span class="episode-cell"><span class="mobile-label">Practical Target</span><b>${money(p.price)}</b><small>${pct(p.upside_pct)} · ${deadline} · ${esc(method)}</small></span><span class="episode-cell"><span class="mobile-label">Practical result</span>${tag(practicalLabel,pTone)}<small>${pDays}</small><a class="reason-link" href="#${practicalId}" data-reason-target="${practicalId}" aria-label="View Practical Target result details for ${ticker}">View details</a></span></summary><div class="episode-body"><div class="grid2"><div class="card"><h3>Fixed +30% test</h3><p>Entry price: <b>${money(x.entry_price??x.entry_price_low)}</b><br>Frozen +30% price: <b>${money(x.fixed_30_target_price)}</b><br>Result: ${statusTag(x.fixed_30_status,fixedLabel)}<br>First reached: <b>${esc(x.fixed_30_hit_date||'—')}</b><br>Time taken: <b>${fixedDays}</b><br>Highest gain during ${fixedWindow}: <b>${pct(x.highes fetch(ARTIFACT,{cache:'no-store'}).then(r=>{if(!r.ok)throw Error();return r.json()}).then(b=>{DATA=b;$('#app').innerHTML=overview(b)+successContract(b)+episodeDetails(b)+strategyCard(b)+validation(b)+horizons(b)+weightValidation(b)+exactReplayWeights(b)+stability(b)+sfaExtras(b)+returnExplorer(b)+methods(b)+controls(b);['q','v','s','g','year','order','page-size'].forEach(id=>$('#'+id).oninput=()=>{PAGE=1;draw()});document.querySelector('.pager').onclick=e=>{let x=e.target.closest('[data-page]');if(x&&!x.disabled)movePage(x.dataset.page)};document.querySelector('.year-map')?.addEventListener('click',e=>{let x=e.target.closest('[data-year]');if(!x)return;$('#year').value=x.dataset.year;PAGE=1;draw();$('#rows').closest('.tablewrap').scrollIntoView({behavior:'smooth',block:'start'})});setupEpisodeDetails();setupReturnExplorer();draw()}).catch(err=>$('#app').innerHTML=`<section class="panel"><div class="empty">No ${esc(SOURCE)} evidence artifact found. Generate ${esc(ARTIFACT)} first.<br>${esc(err.message||'')}</div></section>`);
</script>
</body>
</html>
