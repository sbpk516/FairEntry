<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FairEntry Backtest Evidence</title>
<style>
:root{--bg:#eef1f6;--panel:#fff;--ink:#171b23;--soft:#596276;--line:#dde2ec;--accent:#4a5ee0;--good:#177a45;--warn:#95670b;--bad:#b92943;--sunk:#f4f6fb;--mono:ui-monospace,Consolas,monospace}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px system-ui,-apple-system,"Segoe UI",sans-serif}a{color:inherit;text-decoration:none}.top{position:sticky;top:0;z-index:3;display:flex;gap:14px;align-items:center;padding:12px 20px;background:var(--panel);border-bottom:1px solid var(--line)}.logo{font-size:19px;font-weight:850}.logo b{color:var(--accent)}.spacer{flex:1}.btn,select,input{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;padding:8px 10px}.wrap{max-width:1400px;margin:auto;padding:18px 20px 60px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;margin-bottom:16px;overflow:hidden}.body{padding:16px}.head{padding:13px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}.head h2{margin:0;font-size:16px}.hero{display:grid;grid-template-columns:1.4fr .6fr;gap:16px}.title{font-size:28px;margin:7px 0}.sub,.note{color:var(--soft);line-height:1.55}.meta{font:12px var(--mono);color:var(--soft)}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:9px;margin-top:15px}.stat{padding:11px;background:var(--sunk);border-radius:9px}.k{font-size:10px;text-transform:uppercase;color:var(--soft);font-weight:800}.v{font:800 21px var(--mono);margin-top:3px}.good{color:var(--good)}.bad{color:var(--bad)}.warn{color:var(--warn)}.filters{display:flex;gap:8px;flex-wrap:wrap}.filters input{min-width:180px}.tablewrap{overflow:auto;max-height:680px}table{width:100%;border-collapse:collapse;min-width:1050px}th,td{padding:9px;border-bottom:1px solid #edf0f5;text-align:left;white-space:nowrap}th{position:sticky;top:0;background:var(--panel);font-size:10px;text-transform:uppercase;color:var(--soft)}.num{text-align:right;font-family:var(--mono)}.pill{padding:3px 8px;border-radius:20px;font-weight:800;font-size:11px}.Buy,.reached,.strict{background:#e2f4e9;color:var(--good)}.Watch,.active,.mostly_point_in_time{background:#f7eed6;color:var(--warn)}.Avoid,.expired,.experimental{background:#fbe4e8;color:var(--bad)}tr[data-id]{cursor:pointer}tr[data-id]:hover{background:var(--sunk)}dialog{width:min(1050px,94vw);max-height:90vh;border:0;border-radius:14px;padding:0;color:var(--ink);background:var(--panel);box-shadow:0 18px 60px #0005}dialog::backdrop{background:#10141d99}.dlghead{position:sticky;top:0;background:var(--panel);padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;z-index:1}.dlgbody{padding:18px;overflow:auto}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.card{border:1px solid var(--line);border-radius:10px;padding:12px}.card h3{margin:0 0 10px;font-size:14px}details{border-top:1px solid var(--line);padding:10px 0}summary{font-weight:750;cursor:pointer}.path{font:11px var(--mono);white-space:pre-wrap;color:var(--soft)}.empty{text-align:center;padding:38px;color:var(--soft)}@media(max-width:900px){.hero,.grid{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}}
.btn:disabled{opacity:.45;cursor:not-allowed}.pager{display:flex;align-items:center;justify-content:center;gap:8px;padding:12px 16px;border-top:1px solid var(--line);background:var(--sunk)}.pager .meta{min-width:150px;text-align:center}
</style></head><body>
<nav class="top"><a href="index.html" class="logo">Fair<b>Entry</b></a><span class="meta">backtest evidence</span><span class="spacer"></span><a class="btn" href="data/backtest.json" download>Download JSON</a><a class="btn" href="index.html">Board</a></nav>
<main class="wrap" id="app"><section class="panel"><div class="empty">Loading evidence…</div></section></main>
<dialog id="detail"><div class="dlghead"><strong id="dt"></strong><span class="spacer"></span><button class="btn" onclick="detail.close()">Close</button></div><div class="dlgbody" id="db"></div></dialog>
<script>
"use strict";let DATA,ROWS=[],PAGE=Math.max(1,Number(new URLSearchParams(location.search).get('page'))||1),PAGE_SIZE=100;const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])),pct=x=>x==null?"—":`${x>=0?"+":""}${Number(x).toFixed(2)}%`,money=x=>x==null?"—":"$"+Number(x).toFixed(2),pill=x=>`<span class="pill ${esc(x)}">${esc(x)}</span>`;
function overview(b){let t=b.target_summary||{},buy=b.by_verdict.Buy||{};return `<section class="hero"><div class="panel"><div class="body"><div class="meta">RUN ${esc(b.run_id)} · STRATEGY ${esc(b.strategy?.strategy_id)}</div><h1 class="title">Recommendation evidence, from decision to outcome</h1><p class="sub">Frozen targets, time-to-target, horizon returns and every input used. Active targets are not counted as failures.</p><div class="stats"><div class="stat"><div class="k">Buy alpha</div><div class="v ${buy.mean_alpha_pct>=0?'good':'bad'}">${pct(buy.mean_alpha_pct)}</div></div><div class="stat"><div class="k">Target hit rate</div><div class="v">${t.hit_rate_pct==null?'—':t.hit_rate_pct+'%'}</div></div><div class="stat"><div class="k">Reached</div><div class="v good">${t.reached||0}</div></div><div class="stat"><div class="k">Evaluable</div><div class="v">${t.evaluable||0}</div></div><div class="stat"><div class="k">Median days</div><div class="v">${t.median_days_to_target??'—'}</div></div></div></div></div><div class="panel"><div class="body note"><b>Trust boundary</b><p>${esc(b.data_quality?.warning)}</p><p>Primary target: <b>${esc(t.primary_model)}</b><br>Universe: current top-N survivors<br>Target detection: sampled weekly close</p></div></div></section>`}
function methods(b){let m=b.target_method_summary||{},rows=Object.keys(m).map(k=>{let x=m[k];return `<tr><td>${esc(k)}</td><td class="num">${x.evaluable}</td><td class="num">${x.hit_rate_pct==null?'—':x.hit_rate_pct+'%'}</td><td class="num">${x.median_days_to_target??'—'}</td><td class="num">${pct(x.median_upside_pct)}</td></tr>`}).join('');return `<section class="panel"><div class="head"><h2>Which targets were reached?</h2></div><div class="tablewrap"><table><thead><tr><th>Target method</th><th class="num">Evaluable Buys</th><th class="num">Hit rate</th><th class="num">Median days</th><th class="num">Median upside</th></tr></thead><tbody>${rows}</tbody></table></div></section>`}
function controls(){return `<section class="panel"><div class="head"><h2>Historical recommendations</h2><span class="spacer"></span><span class="meta" id="count"></span></div><div class="body filters"><input id="q" placeholder="Ticker or company"><select id="v"><option value="">All verdicts</option><option>Buy</option><option>Watch</option><option>Avoid</option></select><select id="s"><option value="">All target states</option><option>reached</option><option>expired</option><option>active</option></select><select id="g"><option value="">All quality grades</option><option>strict</option><option>mostly_point_in_time</option><option>experimental</option></select><select id="order"><option value="newest">Newest entries first</option><option value="oldest">Oldest entries first</option></select><select id="page-size"><option>50</option><option selected>100</option><option>250</option><option>500</option></select></div><div class="tablewrap"><table><thead><tr><th>Entry</th><th>Ticker</th><th>Verdict</th><th class="num">Score</th><th class="num">Entry</th><th class="num">Target</th><th>Status</th><th class="num">Days</th><th class="num">30d</th><th class="num">60d</th><th class="num">90d</th><th>Quality</th></tr></thead><tbody id="rows"></tbody></table></div><div class="pager"><button class="btn" data-page="first">First</button><button class="btn" data-page="prev">Previous</button><span class="meta" id="page-label"></span><button class="btn" data-page="next">Next</button><button class="btn" data-page="last">Last</button></div></section>`}
function target(o){return o.target||o.outcome?.targets?.[DATA.strategy.primary_target]||{}}
function draw(){let q=$('#q').value.toLowerCase(),v=$('#v').value,s=$('#s').value,g=$('#g').value,order=$('#order').value;PAGE_SIZE=Number($('#page-size').value)||100;ROWS=(DATA.observations||[]).filter(o=>(!q||(o.ticker+' '+(o.company||'')).toLowerCase().includes(q))&&(!v||o.verdict===v)&&(!s||target(o).status===s)&&(!g||(o.quality_grade||o.data_quality?.grade)===g)).sort((a,b)=>order==='newest'?String(b.entry_date).localeCompare(String(a.entry_date)):String(a.entry_date).localeCompare(String(b.entry_date)));let pages=Math.max(1,Math.ceil(ROWS.length/PAGE_SIZE));PAGE=Math.min(Math.max(1,PAGE),pages);let start=(PAGE-1)*PAGE_SIZE,end=Math.min(start+PAGE_SIZE,ROWS.length);$('#count').textContent=ROWS.length?`${(start+1).toLocaleString()}–${end.toLocaleString()} of ${ROWS.length.toLocaleString()} observations`:'0 observations';$('#page-label').textContent=`Page ${PAGE.toLocaleString()} of ${pages.toLocaleString()}`;document.querySelector('[data-page="first"]').disabled=document.querySelector('[data-page="prev"]').disabled=PAGE===1;document.querySelector('[data-page="next"]').disabled=document.querySelector('[data-page="last"]').disabled=PAGE===pages;let url=new URL(location.href);if(PAGE===1)url.searchParams.delete('page');else url.searchParams.set('page',PAGE);history.replaceState(null,'',url);$('#rows').innerHTML=ROWS.slice(start,end).map(o=>{let t=target(o),h=o.horizons||o.outcome?.horizons||{};return `<tr data-id="${esc(o.observation_id)}"><td>${o.entry_date}</td><td><b>${esc(o.ticker)}</b></td><td>${pill(o.verdict)}</td><td class="num">${o.score}</td><td class="num">${money(o.entry_price)}</td><td class="num">${money(t.price)}</td><td>${pill(t.status||'unavailable')}</td><td class="num">${t.days_to_target??'—'}</td><td class="num">${pct(h['30']?.return_pct)}</td><td class="num">${pct(h['60']?.return_pct)}</td><td class="num">${pct(h['90']?.return_pct)}</td><td>${pill(o.quality_grade||o.data_quality?.grade)}</td></tr>`}).join('');document.querySelectorAll('tr[data-id]').forEach(r=>r.onclick=async()=>{let summary=(DATA.observations||[]).find(o=>o.observation_id===r.dataset.id);if(summary.detail_path){$('#dt').textContent='Loading evidence…';$('#db').innerHTML='<div class="empty">Loading stock evidence…</div>';detail.showModal();let pack=await fetch(summary.detail_path,{cache:'no-store'}).then(x=>x.json());show(pack.observations.find(o=>o.observation_id===summary.observation_id),true)}else show(summary)})}
function movePage(where){let pages=Math.max(1,Math.ceil(ROWS.length/PAGE_SIZE));PAGE=where==='first'?1:where==='prev'?PAGE-1:where==='next'?PAGE+1:pages;draw();$('#rows').closest('.tablewrap').scrollTop=0}
function show(o,alreadyOpen){let targets=Object.entries(o.outcome?.targets||{}).sort((a,b)=>(a[0]==='practical'?-1:b[0]==='practical'?1:a[1].price-b[1].price)).map(([k,t])=>`<tr><td><b>${esc(k)}</b><br><span class="meta">${esc(t.role||'')} ${t.excluded?'· excluded':''}</span></td><td>${money(t.price)}</td><td>${pct(t.upside_pct)}</td><td>${pill(t.status)}</td><td>${t.hit_date||'—'}</td><td class="num">${t.days_to_target??'—'}</td></tr>`).join(''),h=Object.entries(o.outcome?.horizons||{}).map(([k,x])=>`<tr><td>${k}d</td><td>${x.date||x.status}</td><td>${money(x.price)}</td><td class="num">${pct(x.return_pct)}</td></tr>`).join(''),cats=(o.categories||[]).map(c=>`<details><summary>${esc(c.label)} — ${c.score??'unknown'} (weight ${c.weight})</summary>${(c.items||[]).map(i=>`<p><b>${esc(i.label)}</b>: ${esc(i.actual)} · score ${i.score??'unknown'} · ${esc(i.status)}<br><span class="meta">${esc(i.source)} · ${esc(i.fetched_at)}</span></p>`).join('')}</details>`).join(''),fields=(o.data_quality?.fields||[]).map(f=>`<tr><td>${esc(f.field)}</td><td>${esc(f.value)}</td><td>${esc(f.source)}</td><td>${esc(f.effective_at)}</td><td>${pill(f.quality)}</td></tr>`).join('');$('#dt').textContent=`${o.ticker} · ${o.entry_date} · ${o.verdict}`;$('#db').innerHTML=`<div class="grid"><div class="card"><h3>Frozen practical expectation</h3><p>Entry ${money(o.entry_price)} · target ${money(o.practical_target?.price)} · expected within ${o.practical_target?.expiry_days||'—'} days<br>Status ${pill(o.practical_target?.status)} · reached in ${o.practical_target?.days_to_target??'—'} days<br>Max gain ${pct(o.outcome?.max_gain_pct)} · max drawdown ${pct(o.outcome?.max_drawdown_pct)}</p><p class="meta">Weights ${esc(JSON.stringify(o.weights))}</p></div><div class="card"><h3>Screening</h3>${(o.screening||[]).map(s=>`<p><b>${esc(s.id)}</b>: ${s.passed?'passed':'failed'}<br><span class="meta">${esc(JSON.stringify(s.detail))}</span></p>`).join('')}</div></div><div class="card"><h3>All target milestones</h3><table><tr><th>Model</th><th>Price</th><th>Upside</th><th>Status</th><th>Hit date</th><th>Days</th></tr>${targets}</table></div><div class="card"><h3>Forward outcomes</h3><table><tr><th>Horizon</th><th>Date</th><th>Price</th><th>Return</th></tr>${h}</table></div><div class="card"><h3>Scoring factors, gates and vetoes</h3><p><b>Gates:</b> ${esc(JSON.stringify(o.soft_gates))}<br><b>Vetoes:</b> ${esc(JSON.stringify(o.vetoes))}</p>${cats}</div><details><summary>Raw point-in-time inputs and provenance</summary><div class="tablewrap"><table><tr><th>Field</th><th>Value</th><th>Source</th><th>Effective</th><th>Quality</th></tr>${fields}</table></div></details><details><summary>Price path</summary><div class="path">${esc(JSON.stringify(o.outcome?.path||[],null,2))}</div></details>`;if(!alreadyOpen)detail.showModal()}
fetch('data/backtest.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error();return r.json()}).then(b=>{DATA=b;$('#app').innerHTML=overview(b)+methods(b)+controls();['q','v','s','g','order','page-size'].forEach(id=>$('#'+id).oninput=()=>{PAGE=1;draw()});document.querySelector('.pager').onclick=e=>{let b=e.target.closest('[data-page]');if(b&&!b.disabled)movePage(b.dataset.page)};draw()}).catch(()=>$('#app').innerHTML='<section class="panel"><div class="empty">No evidence artifact found. Run the seeded rolling backtest to generate web/data/backtest.json.</div></section>');
</script></body></html>
