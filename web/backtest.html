  let details=(r.episode_scores||[]).slice().sort((a,b)=>(b.score??-1)-(a.score??-1)).map(x=>{let parts=(x.components||[]).map(c=>`${esc(c.id.replaceAll('_',' '))}: ${c.score==null?'unavailable':Number(c.score).toFixed(1)}`).join('<br>');return `<tr><td><b>${esc(x.ticker)}</b><br><span class="meta">${esc(x.company||'')}</span></td><td>${esc(x.entry_date)}</td><td>${esc(x.sector||'—')}</td><td class="num">${x.score==null?'—':Number(x.score).toFixed(1)}</td><td class="num">${pct(x.evidence_coverage_pct)}</td><td>${x.eligible_for_selector?tag('Eligible','good'):tag('Gate failed','warn')}</td><td class="meta">${parts}</td></tr>`}).join('');
  let missing=(r.missing_for_full_replay||[]).map(x=>`<li>${esc(x)}</li>`).join(''),bt=base.test?.primary||{},tt=selectors.top_half?.test?.primary||{};
  return `<section class="panel" id="capability-moat-research"><div class="head"><h2>Can rare capability improve Buy precision?</h2><span class="hint meta">Existing Buys only · chronological test · 0 score effect</span></div><div class="body"><div class="callout"><b>${r.promotion_allowed?'Eligible for manual promotion review':'Production remains unchanged.'}</b> The primary experiment invests in the highest-ranked half of each Buy-date cohort. All-Buy final test: ${pct(bt.success_rate_pct)} (${num(bt.reached)}/${num(bt.completed_episodes)}); selected: ${pct(tt.success_rate_pct)} (${num(tt.reached)}/${num(tt.completed_episodes)}); difference: ${r.final_test_top_half_improvement_pp==null?'—':(r.final_test_top_half_improvement_pp>=0?'+':'')+r.final_test_top_half_improvement_pp+' pp'}.</div><div class="contract"><div class="cell"><div class="k">Historical Buy episodes</div><div class="value">${num(r.coverage?.buy_episodes)}</div></div><div class="cell"><div class="k">Capability-gate eligible</div><div class="value">${num(r.coverage?.selector_eligible)}</div></div><div class="cell"><div class="k">Dated competition evidence</div><div class="value">${num(r.coverage?.direct_competition_evidence)}</div></div><div class="cell"><div class="k">Official recommendation effect</div><div class="value">None</div></div></div><p class="note">${esc(r.interpretation)} Heavy R&amp;D or capital spending is paired with execution, commercial proof and returns; spending alone cannot qualify a company.</p></div><div class="tablewrap"><table><thead><tr><th>Concentration policy</th><th class="num">All reached/completed</th><th class="num">All-history success</th><th class="num">Final reached/completed</th><th class="num">Final success</th><th class="num">Final median drawdown</th><th class="num">Final mean alpha</th></tr></thead><tbody>${rows}</tbody></table></div><details class="simple-details"><summary>Open promotion gates and missing evidence</summary><div class="tablewrap"><table><thead><tr><th>Result</th><th>Gate</th><th class="num">Actual</th><th class="num">Required</th></tr></thead><tbody>${checks}</tbody></table></div><div class="body"><p><b>Still required for the full capability definition:</b></p><ul>${missing}</ul></div></details><details class="simple-details"><summary>Open company capability scores</summary><div class="tablewrap"><table><thead><tr><th>Stock</th><th>First Buy</th><th>Sector</th><th class="num">Capability score</th><th class="num">Evidence coverage</th><th>Selector gate</th><th>Components</th></tr></thead><tbody>${details}</tbody></table></div></details></section>`;
}
function wma200Research(b){
  let r=b.wma200_research;if(!r?.ok)return '';
  let rows=(r.threshold_comparison||[]).map(x=>{let n=x.near||{},a=x.away||{},t=n.one_year_targets||{},a30=a.one_year_targets?.['30']||{},bounce=n.bounce||{};return `<tr><td><b>Within ±${esc(x.threshold_pct)}%</b></td><td class="num">${num(n.events)}</td><td class="num">${num(bounce.reached)}/${num(bounce.completed_events)} · ${pct(bounce.success_rate_pct)}</td><td class="num">${num(t['20']?.reached)}/${num(t['20']?.completed_events)} · ${pct(t['20']?.success_rate_pct)}</td><td class="num">${num(t['25']?.reached)}/${num(t['25']?.completed_events)} · ${pct(t['25']?.success_rate_pct)}</td><td class="num">${num(t['30']?.reached)}/${num(t['30']?.completed_events)} · ${pct(t['30']?.success_rate_pct)}</td><td class="num">${pct(a30.success_rate_pct)}</td><td class="num">${x.near_minus_away_30pct_pp==null?'—':(x.near_minus_away_30pct_pp>=0?'+':'')+x.near_minus_away_30pct_pp+' pp'}</td><td class="num">${pct(t['30']?.median_max_drawdown_pct)}</td></tr>`}).join('');
  let p=(r.threshold_comparison||[]).find(x=>x.threshold_pct===r.primary_threshold_pct)||(r.threshold_comparison||[])[0]||{},p30=p.near?.one_year_targets?.['30']||{};
  let answer=r.research_signal?`The strict ±${esc(r.primary_threshold_pct)}% cohort passed the initial aggregate research checks, but still requires chronological unseen-period validation.`:`The 200-week hypothesis is now measured, but it is not proven and does not change Buy scoring.`;
  return `<section class="panel" id="wma200-research"><div class="head"><h2>Do strong businesses bounce near the 200-week average?</h2><span class="hint meta">Research only · production unchanged</span></div><div class="body"><div class="callout"><b>${answer}</b> Primary result: ${num(p30.reached)}/${num(p30.completed_events)} reached +30% within one year (${pct(p30.success_rate_pct)}).</div><div class="contract"><div class="cell"><div class="k">Strong-business rule</div><div class="value">Quality, Financial Strength and Growth ≥70</div></div><div class="cell"><div class="k">Historical proximity</div><div class="value">±${esc(r.primary_threshold_pct)}%</div></div><div class="cell"><div class="k">WMA observations available</div><div class="value">${num(r.observations_with_wma)}</div></div><div class="cell"><div class="k">Automatic score effect</div><div class="value">None</div></div></div><p class="note">${esc(r.moving_average_definition)} ${esc(r.event_definition)} “Bounce” means +10% within 90 days. ${esc(r.interpretation)}</p></div><div class="tablewrap"><table><thead><tr><th>Distance from 200 WMA</th><th class="num">Near events</th><th class="num">+10% / 90d</th><th class="num">+20% / 1y</th><th class="num">+25% / 1y</th><th class="num">+30% / 1y</th><th class="num">Strong businesses away: +30%</th><th class="num">Difference</th><th class="num">Median drawdown</th></tr></thead><tbody>${rows}</tbody></table></div></section>`;
}
function factorExplorer(b){
  let r=b.factor_explorer,w=r?.walk_forward;if(!r?.ok||!w)return '';
  let comparisons=r.factor_comparison||[],labels=Object.fromEntries(comparisons.map(x=>[x.id,x.label])),base=w.out_of_sample_baseline||{},leaders=w.hypothesis_leaderboard||[],best=leaders[0]||{},bestResult=best.out_of_sample_selected||{},bestBase=best.out_of_sample_baseline||{};
  let value=(x,u)=>x==null?'—':`${Number(x).toFixed(2)}${u==='%'?'%':u==='percentage points'?' pp':u==='x'?'x':''}`,rate=x=>x==null?'—':Number(x).toFixed(1)+'%',change=x=>x==null?'—':(x>=0?'+':'')+Number(x).toFixed(1)+' pp',condition=c=>`${labels[c.factor_id]||c.factor_id} ${c.op} ${Number(c.value).toFixed(2)}`;
  let leaderRows=leaders.slice(0,12).map(x=>{let y=x.out_of_sample_selected||{};return `<tr><td><b>${esc(x.label||x.id)}</b><br><span class="meta">${x.kind==='predeclared_combination'?'Pre-declared combination':'Single factor'} · ${num(x.folds_evaluated)}/3 unseen periods</span></td><td class="num">${num(y.reached)}/${num(y.completed_episodes)}</td><td class="num">${rate(y.success_rate_pct)}</td><td class="num">${change(x.out_of_sample_improvement_pp)}</td><td class="num">${num(x.folds_nonworse)}/${num(x.folds_evaluated)}</td><td class="num">${change(x.median_drawdown_change_pp)}</td><td>${x.research_signal?tag('Eligible for frozen test','good'):tag('Not proven','warn')}</td></tr>`}).join('');
  let factorRows=comparisons.map(x=>`<tr><td><b>${esc(x.label)}</b><br><span class="meta">${esc(x.meaning)}</span></td><td>${esc(x.category||(x.theme||'').replaceAll('_',' '))}</td><td class="num">${rate(x.coverage_pct)}</td><td class="num">${value(x.success_distribution?.median,x.unit)}</td><td class="num">${value(x.failure_distribution?.median,x.unit)}</td><td>${x.direction_matches_hypothesis?tag('Aligned','good'):tag('Not aligned','warn')}</td></tr>`).join('');
  let foldRows=(w.folds||[]).map(x=>{let selected=x.selected_test||{},baseline=x.baseline_test||{},rule=x.selected_rule?.conditions?.map(condition).join(' AND ')||'No rule passed the older-data checks';return `<tr><td><b>Period ${num(x.fold)}</b><br><span class="meta">Unseen dates ${esc(x.test?.first)} to ${esc(x.test?.last)}</span></td><td>${esc(rule)}</td><td class="num">${num(selected.completed_episodes)}</td><td class="num">${rate(baseline.success_rate_pct)}</td><td class="num">${rate(selected.success_rate_pct)}</td><td class="num">${change(x.test_improvement_pp)}</td></tr>`}).join('');
  let unavailable=(r.unavailable_factors||[]).map(x=>`<div class="card"><h3>${esc(x.label)} ${tag('Not backtestable','info')}</h3><p class="note">${esc(x.reason)}</p><p class="meta">Shown as non-quantifiable information under ${esc(x.category)} · no score effect</p></div>`).join('');
  let bestFailed=!best.research_signal,answer=bestFailed?`No stronger rule is ready. The best research-only result was ${esc(best.label||best.id)} at ${rate(bestResult.success_rate_pct)}, compared with ${rate(bestBase.success_rate_pct)} for all Buys. It still failed one or more confidence requirements.`:`${esc(best.label||best.id)} passed the research gates and may now be tested as one frozen rule; production is still unchanged.`;
  return `<section class="panel" id="factor-explorer"><div class="head"><h2>Can stronger factors improve the +30% success rate?</h2><span class="hint meta">Research only · production unchanged</span></div><div class="body"><div class="callout"><b>${answer}</b> Nothing here changes a Buy, score or weight.</div><div class="contract"><div class="cell"><div class="k">All-Buy unseen baseline</div><div class="value">${rate(base.success_rate_pct)} (${num(base.reached)}/${num(base.completed_episodes)})</div></div><div class="cell"><div class="k">Best researched hypothesis</div><div class="value">${rate(bestResult.success_rate_pct)} (${num(bestResult.reached)}/${num(bestResult.completed_episodes)})</div></div><div class="cell"><div class="k">Improvement</div><div class="value">${change(best.out_of_sample_improvement_pp)}</div></div><div class="cell"><div class="k">Production change</div><div class="value">None</div></div></div><p class="note">How this was tested: learn thresholds on older history → confirm them on a second older period → test once on the next unseen period. Results below combine those unseen tests. Coverage: ${num(r.enrichment?.enriched)}/${num(r.enrichment?.observations)} Buy observations enriched; missing values were excluded rather than filled from the future.</p></div><div class="tablewrap"><table><thead><tr><th>Hypothesis</th><th class="num">Reached / completed</th><th class="num">Success</th><th class="num">Vs all Buys</th><th class="num">Periods not worse</th><th class="num">Drawdown change</th><th>Decision</th></tr></thead><tbody>${leaderRows}</tbody></table></div><details class="simple-details"><summary>See factors that cannot be backtested</summary><div class="grid2">${unavailable}</div></details><details class="simple-details"><summary>See success-versus-failure factor comparison</summary><div class="tablewrap"><table><thead><tr><th>Entry-date factor</th><th>Existing category / evidence family</th><th class="num">Coverage</th><th class="num">Success median</th><th class="num">Failure median</th><th>Expected direction?</th></tr></thead><tbody>${factorRows}</tbody></table></div></details><details class="simple-details"><summary>See the three rolling unseen-period selections</summary><div class="tablewrap"><table><thead><tr><th>Unseen period</th><th>Rule chosen using older data only</th><th class="num">Completed</th><th class="num">All-Buy success</th><th class="num">Selected success</th><th class="num">Improvement</th></tr></thead><tbody>${foldRows}</tbody></table></div></details><div class="body note">A good-looking median is only a clue. A rule must also improve unseen success, retain enough stocks, remain stable across periods and avoid worse drawdowns. ${esc(w.interpretation)}</div></section>`}
function emergingCandidateBacktest(b){
  let r=b.emerging_candidate_backtest;if(!r?.ok)return '';
  let main=r.results?.['5m_to_20m']||{},labels={screened:'All eligible $5M–$20M stocks (baseline)',shadow_buy_watch:'Model Buy/Watch subset',broad:'Basic Match',balanced:'Strong Match',selective:'Strict Match'},order=['screened','shadow_buy_watch','broad','balanced','selective'];
  let rows=order.map(k=>{let x=main[k]||{},a=x.all||{},t=x.test||{},a30=a.targets_within_365_days?.['30']||{},t30=t.targets_within_365_days?.['30']||{},g=a.graduation||{},v=r.validation?.[k];return `<tr><td><b>${esc(labels[k])}</b>${v?`<br>${v.validated?tag('Historical advantage proven','good'):tag('Advantage not proven','warn')}`:''}</td><td class="num">${num(a30.reached)}/${num(a30.completed_episodes)}</td><td class="num">${pct(a30.success_rate_pct)}</td><td class="num">${pct(t30.success_rate_pct)}</td><td class="num">${(t30.success_rate_ci90_pct||[]).map(pct).join(' to ')||'—'}</td><td class="num">${pct(a.median_max_drawdown_pct)}</td><td class="num">${pct(g.official_liquidity_10m?.rate_pct)}</td><td class="num">${pct(g.positive_liquidity_20m?.rate_pct)}</td><td class="num">${pct(g.official_buy?.rate_pct)}</td></tr>`}).join('');
  let targets=[20,25,28,30,35].map(target=>{let cells=['broad','balanced','selective'].map(k=>{let x=main[k]?.all?.targets_within_365_days?.[String(target)]||{};return `<td class="num">${num(x.reached)}/${num(x.completed_episodes)} · ${pct(x.success_rate_pct)}</td>`}).join('');return `<tr><td><b>+${target}% within one year</b></td>${cells}</tr>`}).join('');
  let bands=['5m_to_10m','10m_to_20m','20m_plus','all'].map(scope=>{let cells=['broad','balanced','selective'].map(k=>{let x=r.results?.[scope]?.[k]?.all?.targets_within_365_days?.['30']||{};return `<td class="num">${num(x.reached)}/${num(x.completed_episodes)} · ${pct(x.success_rate_pct)}</td>`}).join('');return `<tr><td><b>${esc(scope.replaceAll('_',' '))}</b></td>${cells}</tr>`}).join('');
  return `<section class="panel" id="emerging-candidate-backtest"><div class="head"><h2>Emerging-candidate backtest</h2><span class="hint meta">Basic · Strong · Strict Match</span></div><div class="body"><div class="callout"><b>Production remains unchanged.</b> The default comparison covers $5M–$20M average daily dollar volume. Match level and liquidity range are tested independently using the same rules as the live screen.</div><div class="contract"><div class="cell"><div class="k">Rule version</div><div class="value">${esc(r.version)}</div></div><div class="cell"><div class="k">Historical cohorts</div><div class="value">${num(r.replay?.cohorts)}</div></div><div class="cell"><div class="k">Entry evidence attached</div><div class="value">${num(r.enrichment?.entry_evidence?.attached)}/${num(r.enrichment?.entry_evidence?.eligible_for_attachment)}</div></div><div class="cell"><div class="k">Official decision effect</div><div class="value">None</div></div></div><p class="note"><b>How the test was kept honest:</b> the oldest 60% of dates formed the development period, the next 20% was a separate validation period, and the newest 20% was the final exam. The newest period was not used to choose or adjust these rules.</p><p class="note"><b>How to read the table:</b> “All-history +30%” uses every completed episode. “Newest 20% +30%” shows how the same unchanged rule performed in the final untouched period. A match level is only proven when it beats the baseline there with enough completed cases. ${esc(r.interpretation||'')}</p></div><div class="tablewrap"><table><thead><tr><th>Research group</th><th class="num">Reached / completed</th><th class="num">All-history +30%</th><th class="num">Newest 20% +30%</th><th class="num">Newest-period uncertainty range</th><th class="num">Median drawdown</th><th class="num">Reached $10M</th><th class="num">Reached $20M</th><th class="num">Official Buy</th></tr></thead><tbody>${rows}</tbody></table></div><details class="simple-details"><summary>Compare +20%, +25% and +30% across the three match levels</summary><div class="tablewrap"><table><thead><tr><th>Target</th><th class="num">Basic Match</th><th class="num">Strong Match</th><th class="num">Strict Match</th></tr></thead><tbody>${targets}</tbody></table></div></details><details class="simple-details"><summary>Compare +30% by liquidity band</summary><div class="tablewrap"><table><thead><tr><th>Liquidity band</th><th class="num">Basic Match</th><th class="num">Strong Match</th><th class="num">Strict Match</th></tr></thead><tbody>${bands}</tbody></table></div></details></section>`;
}
const baseSfaExtras=sfaExtras;sfaExtras=function(b){return emergingCandidateBacktest(b)+liquidityComparison(b)+highConfidenceValidation(b)+researchCycle(b)+valuationResearch(b)+highConvictionResearch(b)+capabilityMoatResearch(b)+wma200Research(b)+factorExplorer(b)+baseSfaExtras(b)};
const REQUESTED_SOURCE=new URLSearchParams(location.search).get('source'),SOURCE=REQUESTED_SOURCE==='sfa'?'sfa':'legacy',ARTIFACT=SOURCE==='sfa'?'data/backtest-sfa.json':'data/backtest.json';$('#download-json').href=ARTIFACT;
fetch(ARTIFACT,{cache:'no-store'}).then(r=>{if(!r.ok)throw Error();return r.json()}).then(b=>{DATA=b;$('#app').innerHTML=overview(b)+successContract(b)+scoreBandCalibration(b)+entryOpportunityResearch(b)+movementCapacityResearch(b)+relativeMomentumResearch(b)+targetFailureSummary(b)+researchedFailureTable(b)+failureResearchQueue(b)+strategyCard(b)+validation(b)+episodeDetails(b)+horizons(b)+weightValidation(b)+exactReplayWeights(b)+stability(b)+sfaExtras(b)+returnExplorer(b)+methods(b)+controls(b);['q','v','s','g','year','order','page-size'].forEach(id=>$('#'+id).oninput=()=>{PAGE=1;draw()});document.querySelector('.pager').onclick=e=>{let x=e.target.closest('[data-page]');if(x&&!x.disabled)movePage(x.dataset.page)};document.querySelector('.year-map')?.addEventListener('click',e=>{let x=e.target.closest('[data-year]');if(!x)return;$('#year').value=x.dataset.year;PAGE=1;draw();$('#rows').closest('.tablewrap').scrollIntoView({behavior:'smooth',block:'start'})});renumberSections();buildToc();setupTocSpy();setupEpisodeDetails();setupReturnExplorer();draw()}).catch(err=>$('#app').innerHTML=`<section class="panel"><div class="empty">No ${esc(SOURCE)} evidence artifact found. Generate ${esc(ARTIFACT)} first.<br>${esc(err.message||'')}</div></section>`);
</script>
