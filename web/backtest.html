<html lang="en">
<head>

  <style>

    .toc{display:flex;gap:6px;overflow-x:auto;padding:8px 20px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);scrollbar-width:thin}.toc:empty{display:none}.toc a{flex:none;padding:6px 12px;border-radius:20px;background:var(--sunk);color:var(--soft);font-size:12px;font-weight:700;white-space:nowrap;border:1px solid transparent;transition:background .15s,color .15s}.toc a:hover{background:#e6edfb;color:var(--ink)}.toc a.active{background:var(--accent);color:#fff;border-color:var(--accent)}
    .btn,select,input{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;padding:8px 10px}.btn:disabled{opacity:.45;cursor:not-allowed}
    .wrap{max-width:1440px;margin:auto;padding:18px 20px 60px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;margin-bottom:16px;overflow:hidden;box-shadow:0 1px 2px #0000000a,0 10px 28px -16px #00000018;scroll-margin-top:98px}.body{padding:16px}.head{padding:13px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;flex-wrap:wrap}.head h2{margin:0;font-size:16px}.head .hint{margin-left:auto}
    .hero{display:grid;grid-template-columns:1.45fr .55fr;gap:16px}.title{font-size:28px;margin:7px 0}.sub,.note{color:var(--soft);line-height:1.55}.meta{font:12px var(--mono);color:var(--soft)}
    .stats{display:grid;grid-template-columns:repeat(6,1fr);gap:9px;margin-top:15px}.stat{position:relative;padding:11px;background:var(--sunk);border-radius:9px}.stat>.k{padding-right:20px}.stat>.k>.help{position:absolute;right:9px;top:9px;margin:0}.hero .panel:first-child{position:relative;z-index:2;overflow:visible}.k{font-size:10px;text-transform:uppercase;color:var(--soft);font-weight:800}.v{font:800 20px var(--mono);margin-top:3px}.smallv{font:750 14px var(--mono);margin-top:5px}.good{color:var(--good)}.bad{color:var(--bad)}.warn{color:var(--warn)}.info{color:var(--info)}
    .tag{display:inline-block;padding:3px 8px;border-radius:20px;font-weight:800;font-size:11px}.tag.good{background:#e2f4e9}.tag.warn{background:#f7eed6}.tag.bad{background:#fbe4e8}.tag.info{background:#e6edfb}.tag.neutral{background:#edf0f5;color:var(--soft)}
    .contract{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.contract .cell,.card{border:1px solid var(--line);border-radius:10px;padding:12px}.contract .cell .value{font-weight:750;margin-top:4px;word-break:break-word}.panel,.body,.card,.grid2,.grid3,.tablewrap{min-width:0}.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.card h3{margin:0 0 9px;font-size:14px}.criteria{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.criterion{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:8px;padding:10px;background:var(--sunk);border-radius:8px}.criterion .answer{font-family:var(--mono);text-align:right}.help{position:relative;display:inline-grid;place-items:center;width:17px;height:17px;margin-left:4px;border:1px solid #99a5ba;border-radius:50%;color:var(--info);background:#fff;font:800 11px system-ui;cursor:help;vertical-align:middle}.help:focus{outline:2px solid var(--accent);outline-offset:2px}.kv-list{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:4px}.kv-list li{display:flex;justify-content:space-between;gap:10px;padding:6px 8px;background:var(--sunk);border-radius:6px;font:12px var(--mono)}.kv-list .kv-key{color:var(--soft);text-transform:capitalize}.kv-list .kv-val{font-weight:700;text-align:right;word-break:break-word}.help:hover:after,.help:focus:after{content:attr(data-tip);position:absolute;left:50%;bottom:calc(100% + 8px);transform:translateX(-50%);z-index:20;width:min(300px,80vw);padding:9px 10px;border-radius:8px;background:#19202e;color:#fff;font:12px/1.45 system-ui;box-shadow:0 8px 24px #0004;text-transform:none;letter-spacing:0;text-align:left;white-space:normal}.plain-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.result-card{border:1px solid var(--line);border-radius:10px;padding:13px}.result-card .result-main{display:flex;justify-content:space-between;align-items:center;gap:8px}.result-card .result-number{font:800 20px var(--mono)}.bar{height:8px;margin:11px 0 8px;border-radius:10px;background:#e5e9f1;overflow:hidden}.bar span{display:block;height:100%;border-radius:inherit;background:var(--accent)}.simple-details{margin-top:14px;padding:0;border:1px solid var(--line);border-radius:10px}.simple-details summary{padding:12px 14px}.simple-details>div{padding:0 14px 14px}.goal-banner{display:flex;align-items:center;gap:12px;padding:13px 15px;margin-bottom:14px;border-radius:10px;background:#e9f6ee;border-left:4px solid var(--good)}.goal-banner strong{font-size:18px}.strategy-cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.year-map{display:grid;grid-template-columns:repeat(auto-fit,minmax(95px,1fr));gap:7px;margin-top:10px}.year-button{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:8px;padding:8px;background:#fff;text-align:left;cursor:pointer}.year-button span{position:absolute;inset:auto 0 0;height:4px;background:var(--accent)}.year-button b,.year-button small{position:relative;display:block}.year-button small{color:var(--soft)}
    .filters{display:flex;gap:8px;flex-wrap:wrap}.filters input{min-width:180px}.tablewrap{overflow:auto;max-height:680px}table{width:100%;border-collapse:collapse;min-width:900px}th,td{padding:9px;border-bottom:1px solid #edf0f5;text-align:left;white-space:nowrap}th{position:sticky;top:0;background:var(--panel);font-size:10px;text-transform:uppercase;color:var(--soft);z-index:1}.num{text-align:right;font-family:var(--mono)}tr[data-id]{cursor:pointer}tr[data-id]:hover{background:var(--sunk)}
    .pager{display:flex;align-items:center;justify-content:center;gap:8px;padding:12px 16px;border-top:1px solid var(--line);background:var(--sunk)}.pager .meta{min-width:150px;text-align:center}
    .callout{padding:12px 14px;border-left:4px solid var(--warn);background:#fff9e9;border-radius:6px;line-height:1.5}.availability{display:grid;gap:8px}.availability .row{padding:9px;background:var(--sunk);border-radius:8px}.empty{text-align:center;padding:38px;color:var(--soft)}
    .success-tests{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.success-card{border:1px solid var(--line);border-radius:12px;padding:15px;background:var(--panel)}.success-card h3{margin:0 0 4px;font-size:17px}.success-main{display:flex;align-items:end;gap:10px;margin:13px 0}.success-rate{font:850 34px var(--mono)}.success-count{padding-bottom:5px;color:var(--soft)}.success-metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.success-metric{padding:9px;background:var(--sunk);border-radius:8px}.success-metric b{display:block;margin-top:3px;font:800 16px var(--mono)}.deadline-ladder{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px;margin-top:12px}.deadline-step{padding:8px;border:1px solid var(--line);border-radius:8px;text-align:center}.deadline-step b,.deadline-step small{display:block}.deadline-step small{color:var(--soft);margin-top:2px}.episode-list{display:grid;gap:8px}.episode-columns,.episode-row>summary{display:grid;grid-template-columns:1.15fr .9fr .9fr .9fr 1.05fr 1.3fr 1.05fr 1.05fr;gap:12px;align-items:center}.episode-columns{padding:10px 13px 7px;color:var(--soft);font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.03em}.episode-row{padding:0;border:1px solid var(--line);border-radius:10px;background:var(--panel);overflow:hidden}.episode-row>summary{padding:11px 13px;list-style:none}.episode-row>summary::-webkit-details-marker{display:none}.episode-row>summary:hover{background:var(--sunk)}.episode-cell small,.mobile-label{display:block;color:var(--soft);margin-top:3px}.mobile-label{display:none;margin:0 0 4px;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.03em}.reason-link{display:inline-block;margin-top:5px;color:var(--accent);font-weight:750;text-decoration:underline}.reason-evidence{margin:8px 0 0;padding-left:18px}.reason-evidence li{margin:4px 0}.episode-body{padding:13px;border-top:1px solid var(--line);background:var(--sunk)}.episode-body .card{background:var(--panel)}
    .episode-body .wide-card{grid-column:1/-1}.counting-line{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:9px 0}.counting-line .note{margin:0}.return-controls{display:flex;gap:10px;flex-wrap:wrap;align-items:end}.return-controls label{display:grid;gap:5px;color:var(--soft);font:12px var(--mono)}.return-controls select{min-width:150px}.return-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:14px 0}.return-chart{border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--panel)}.return-chart-head{display:flex;gap:10px;align-items:baseline}.return-chart-head .meta{margin-left:auto;text-align:right}.return-chart svg{display:block;width:100%;height:290px}.return-grid{stroke:var(--line);stroke-width:1}.return-axis{fill:var(--soft);font:12px var(--mono)}.return-axis-title{fill:var(--ink);font:12px var(--mono)}.return-area{fill:#e6edfb}.return-line{fill:none;stroke:var(--accent);stroke-width:3}.return-point{fill:var(--panel);stroke:var(--accent);stroke-width:3}.return-point.selected{fill:var(--good);stroke:var(--panel)}.return-guide{stroke:var(--good);stroke-width:1.5;stroke-dasharray:5 4}.return-detail{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:8px;padding:10px 12px;border-radius:8px;background:#e2f4e9}.return-matrix td.selected{background:#e2f4e9;color:var(--good);font-weight:800}.return-matrix small{display:block;color:var(--soft);margin-top:2px}
    dialog{width:min(1050px,94vw);max-height:90vh;border:0;border-radius:14px;padding:0;color:var(--ink);background:var(--panel);box-shadow:0 18px 60px #0005}dialog::backdrop{background:#10141d99}.dlghead{position:sticky;top:0;background:var(--panel);padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;z-index:1}.dlgbody{padding:18px;overflow:auto}.dlgbody .card{margin-bottom:14px}details{border-top:1px solid var(--line);padding:10px 0}summary{font-weight:750;cursor:pointer}.path{font:11px var(--mono);white-space:pre-wrap;color:var(--soft)}
    @media(max-width:1000px){.hero,.grid2,.grid3,.success-tests{grid-template-columns:1fr}.contract{grid-template-columns:repeat(2,1fr)}.stats{grid-template-columns:repeat(3,1fr)}.plain-grid{grid-template-columns:1fr}.criteria{grid-template-columns:1fr}.episode-columns{display:none}.mobile-label{display:block}.episode-row>summary{grid-template-columns:repeat(3,minmax(0,1fr))}}
    @media(max-width:620px){.wrap{padding:12px}.stats,.contract,.return-stats,.strategy-cards,.success-metrics,.deadline-ladder{grid-template-columns:1fr}.pager,.top{flex-wrap:wrap}.top .spacer{display:none}.top .meta{display:none}.top .btn{flex:1;text-align:center}.return-controls label,.return-controls select{width:100%}.return-chart-head{display:block}.return-chart-head .meta{margin-top:4px;text-align:left}.criterion{grid-template-columns:auto minmax(0,1fr)}.criterion .answer{grid-column:2;text-align:left}.episode-row>summary{grid-template-columns:1fr 1fr}.help:hover:after,.help:focus:after{position:fixed;left:20px;right:20px;top:90px;bottom:auto;transform:none;width:auto}}

<body>
  <header class="page-head">
    <nav class="top"><a href="index.html" class="logo">Fair<b>Entry</b></a><span class="meta">backtest evidence</span><a class="btn" href="backtest.html?source=sfa">SFA replay</a><a class="btn" href="backtest.html?source=legacy">Legacy replay</a><span class="spacer"></span><a class="btn" id="download-json" href="data/backtest.json" download>Download JSON</a><a class="btn" href="index.html">Board</a></nav>
    <nav class="toc" id="toc" aria-label="Jump to section"></nav>
  </header>
  <main class="wrap" id="app"><section class="panel"><div class="empty">Loading evidence...</div></section></main>
  <dialog id="detail"><div class="dlghead"><strong id="dt"></strong><span class="spacer"></span><button class="btn" onclick="detail.close()">Close</button></div><div class="dlgbody" id="db"></div></dialog>
<script>
"use strict";
let DATA,ROWS=[],EPISODE_ROWS=[],PAGE=Math.max(1,Number(new URLSearchParams(location.search).get('page'))||1),PAGE_SIZE=100;
const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pct=x=>x==null||Number.isNaN(Number(x))?"—":`${x>=0?"+":""}${Number(x).toFixed(2)}%`,pp=x=>x==null||Number.isNaN(Number(x))?"—":`${x>=0?"+":""}${Number(x).toFixed(1)} pp`,money=x=>x==null?"—":"$"+Number(x).toFixed(2),num=x=>x==null?"—":Number(x).toLocaleString();
const tag=(label,tone='neutral')=>`<span class="tag ${tone}">${esc(label)}</span>`;
const help=text=>`<span class="help" tabindex="0" aria-label="More information: ${esc(text)}" data-tip="${esc(text)}">i</span>`;
const mean=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;
const median=a=>{if(!a.length)return null;let s=[...a].sort((x,y)=>x-y),m=Math.floor(s.length/2);return s.length%2?s[m]:(s[m-1]+s[m])/2};
function toneForStatus(s){return s==='reached'||s==='within_one_year'||s==='Buy'||s==='strict'?'good':s==='expired'||s==='never_within_three_years'||s==='closed_early_failure'||s==='missed_within_one_year_tracking'||s==='Avoid'||s==='experimental'?'bad':s==='reached_late'||s==='during_year_two'||s==='during_year_three'||s==='after_three_years'||s==='still_waiting'||s==='active'||s==='Watch'||s==='mostly_point_in_time'||s==='already_above_at_entry'?'warn':s==='closed_early_excluded'?'info':'neutral'}
function statusTag(s,label){return tag(label||s||'unavailable',toneForStatus(s))}
function health(b){let buy=b.by_verdict?.Buy||{},spread=b.buy_minus_avoid_pct,two=b.spread_ci90_two_way||[],checks=[spread>0,b.significant===true,two.length&&two[0]>0,b.monotonic===true,buy.hit_rate_pct>50,b.cohorts>=30];return {checks,pass:checks.every(Boolean),positive:checks.filter(Boolean).length,label:checks.every(Boolean)?'Acceptance criteria met':'Backtest not validated · review gaps'}}
function actualEntryRange(b){let c=b.per_cohort||[];return c.length?[c[0].entry,c[c.length-1].entry]:b.window||[]}

function overview(b){let t=b.target_summary||{},primaryPractical=b.buy_return_achievement?.primary_success_contract?.practical_target_with_compounding_deadline,buy=b.by_verdict?.Buy||{},h=health(b),ci=b.spread_ci90||[],entries=actualEntryRange(b),sfa=b.data_quality?.universe_bias==='active_and_delisted_point_in_time',universe=sfa?'companies that existed then, including companies later removed from the market':'only companies that still exist today',sampling=sfa?'checked every trading day':'checked on selected weekly dates',sample=b.public_evidence_sample,independence='The same company can appear on several test dates. Those repeated decisions are useful, but they are not separate independent investments. The cautious ranges on this page allow for that repetition.';return `<section class="hero" id="overview">
  <div class="panel"><div class="body"><div class="meta">BACKTEST ${esc(b.run_id)}</div><h1 class="title">From each recommendation to what happened next</h1><p class="sub">Every result can be opened from a simple answer into its rules, dates, calculations, and stock-level evidence.</p>
  <div>${tag(h.pass?'All reliability checks passed':`${h.positive} of ${h.checks.length} reliability checks passed`,h.pass?'good':'warn')}</div><div class="stats">
    <div class="stat"><div class="k">Buy extra return ${help(`Average Buy return after ${b.hold_days} days minus the S&P 500 return over the same dates.`)}</div><div class="v ${buy.mean_alpha_pct>=0?'good':'bad'}">${pct(buy.mean_alpha_pct)}</div></div>
    <div class="stat"><div class="k">Buy advantage over Avoid ${help('Average Buy result minus average Avoid result. This was previously called spread.')}</div><div class="v ${b.buy_minus_avoid_pct>=0?'good':'bad'}">${pct(b.buy_minus_avoid_pct)}</div></div>
    <div class="stat"><div class="k">Likely Buy advantage ${help('A likely range after allowing for stronger and weaker test dates. This was previously called the 90% spread CI.')}</div><div class="smallv">${ci.length?`${pct(ci[0])} to ${pct(ci[1])}`:'—'}</div></div>
    <div class="stat"><div class="k">${primaryPractical?'Practical Target on time':'Practical value reached'} ${help(primaryPractical?'Of completed Practical Targets, the percentage reached within the size-based deadline shown in the second success test. Late and still-waiting cases are separate.':'Of completed Practical value goals, the percentage reached before their allowed time ended. Goals already below the Buy price and goals still in progress are kept separate.')}</div><div class="v">${(primaryPractical?.hit_rate_pct??t.hit_rate_pct)==null?'—':(primaryPractical?.hit_rate_pct??t.hit_rate_pct)+'%'}</div></div>
    <div class="stat"><div class="k">Test dates ${help('The number of historical dates on which the system made a fresh set of decisions. Previously called cohorts.')}</div><div class="v">${num(b.cohorts)}</div></div>
    <div class="stat"><div class="k">Decision dates</div><div class="smallv">${esc(entries[0]||'—')}<br>${esc(entries[1]||'—')}</div></div>
  </div></div></div>
  <div class="panel"><div class="body note"><b>What this backtest can and cannot prove ${help('Important limits that should be read before relying on the headline results.')}</b><p>${esc(b.data_quality?.warning||'No data warning was recorded.')}</p><p>Data source: ${esc(b.provider||'Older saved sources')}<br>Saved data version: ${esc(b.snapshot_id||'Not applicable')}<br>Companies included: ${esc(universe)}<br>How often a value was checked: ${esc(sampling)}<br>Main value method: <b>${esc(t.primary_model||b.strategy?.primary_target)}</b></p><div class="callout">${esc(independence)}</div>${sample?`<p>All calculations use ${num(sample.total)} decisions. The stock table shows a safe sample of ${num(sample.displayed)} rows because the raw licensed data cannot be published.</p>`:''}${b.public_data_boundary?`<p><a href="${esc(b.public_data_boundary.attribution_url)}">${esc(b.public_data_boundary.attribution)}</a> · licensed source records are not exposed.</p>`:''}</div></div>
  </section>`}

function successContract(b){let a=b.buy_return_achievement||{},c=a.primary_success_contract;if(!a.views?.episodes)return '';if(!c){let old=a.views.episodes.matrix?.['30']?.['365']||{};return `<section class="panel"><div class="head"><h2>Our two success tests</h2></div><div class="body"><div class="goal-banner"><strong>+30% within one year: ${old.hit_rate_pct??'—'}%</strong><span>${num(old.reached)} of ${num(old.evaluable)} completed Buy episodes reached the fixed goal. Run the upgraded replay to add the separate Practical Target deadline test and stock-level evidence.</span></div></div></section>`}let f=c.fixed_30_within_one_year||{},timing=c.fixed_30_timing||{},p=c.practical_target_with_compounding_deadline||{},bands=p.by_deadline_years||{},episodeCount=a.episode_details?.length??a.views.episodes.observations;let bandRows=Object.values(bands).sort((x,y)=>x.deadline_years-y.deadline_years).map(x=>`<div class="deadline-step"><b>${x.deadline_years} year${x.deadline_years===1?'':'s'}</b><small>${x.hit_rate_pct==null?'No completed cases':x.hit_rate_pct+'% on time · '+num(x.reached)+'/'+num(x.evaluable)}</small></div>`).join('');return `<section class="panel" id="success-contract"><div class="head"><h2>Our two success tests ${help('Every continuous Buy period is tested once. The fixed +30% promise and the stock-specific Practical Target remain separate.')}</h2><span class="hint meta">${num(episodeCount)} Buy episodes · first Buy starts the clock</span></div><div class="body"><div class="success-tests"><div class="success-card"><h3>1. Did it reach +30% within one year?</h3><p class="note">The same fixed minimum goal for every Buy episode.</p><div class="success-main"><span class="success-rate ${f.hit_rate_pct>=50?'good':'warn'}">${f.hit_rate_pct==null?'—':f.hit_rate_pct+'%'}</span><span class="success-count">${num(f.reached)} reached · ${num(f.evaluable)} completed</span></div><div class="success-metrics"><div class="success-metric">Typical time<b>${f.median_days_to_hit== function scoreBandCalibration(b){let c=b.buy_return_achievement?.score_band_calibration;if(!c?.bands?.length)return '';let targets=c.targets_pct||[25,28,30,35],overall=c.overall||{},cards=targets.map(t=>{let x=overall[String(t)]||{};return `<div class="result-card"><div class="k">Reached +${t}% within 1 year</div><div class="v ${x.hit_rate_pct>=50?'good':'warn'}">${x.hit_rate_pct==null?'—':x.hit_rate_pct+'%'}</div><p class="note">${num(x.reached)} of ${num(x.evaluable)} completed Buy episodes · median ${x.median_days_to_hit==null?'—':num(x.median_days_to_hit)+' days'} · average ${x.average_days_to_hit==null?'—':num(x.average_days_to_hit)+' days'}</p></div>`}).join(''),rows=c.bands.map(x=>`<tr><td><b>${esc(x.label)}</b></td><td class="num">${num(x.episodes)}</td>${targets.map(t=>{let y=x.targets?.[String(t)]||{};return `<td class="num"><b>${y.hit_rate_pct==null?'—':y.hit_rate_pct+'%'}</b><br><span class="meta">${num(y.reached)}/${num(y.evaluable)}</span></td>`}).join('')}<td class="num">${pct(x.median_max_drawdown_pct)}</td><td class="num">${pct(x.worst_max_drawdown_pct)}</td></tr>`).join('');return `<section class="panel" id="score-calibration"><div class="head"><h2>What the one FairEntry score achieved</h2><span class="hint meta">One-year Buy episodes · no score change</span></div><div class="body"><div class="goal-banner"><strong>+30% remains the primary target.</strong><span>+25% is the acceptable lower target, +28% shows the middle, and +35% tests stronger upside. These are outcome checks—not additional scores.</span></div><div class="plain-grid">${cards}</div><div class="callout"><b>How to read score bands:</b> This full-history table is descriptive. A higher score band should be trusted as higher probability only if a separate walk-forward test reproduces a stable improvement. Nothing here changes a historical or current verdict.</div></div><div class="tablewrap"><table><thead><tr><th>Official score at first Buy</th><th class="num">Episodes</th>${targets.map(t -details" open><summary>Test the proposed low-range exclusion directly</summary><div class="tablewrap"><table><thead><tr><th>Cutoff</th><th class="num">Below cutoff: all history</th><th class="num">At/above: all history</th><th class="num">Difference</th><th class="num">Below: newest period</th><th class="num">At/above: newest period</th><th class="num">Newest difference</th></tr></thead><tbody>${cutoffRows}</tbody></table></div><div class="body note">A positive difference means stocks at or above the range cutoff reached +30% more often. This is evidence about one-year target attainability—not proof of higher expected returns.</div></details><details class="simple-details"><summary>Combine trend and downside volatility</summary><div class="tablewrap"><table><thead><tr><th>Point-in-time combination</th><th class="num">Episodes</th><th class="num">+30% / 1y</th><th class="num">Newest +30% / 1y</th><th class="num">+30% / 2y</th><th class="num">Typical 1y decline</th></tr></thead><tbody>${combinationRows}</tbody></table></div></details><details class="simple-details"><summary>Open stock-by-stock movement-capacity evidence</summary><div class="tablewrap"><table><thead><tr><th>Stock</th><th>First Buy</th><th class="num">52w range</th><th class="num">Range ÷ 30%</th><th class="num">Position in range</th><th class="num">126d volatility</th><th class="num">Target distance</th><th class="num">Trend</th><th class="num">Down/up volatility</th><th>Combination</th><th class="num">Days to +30%</th><th class="num">Days to +50%</th></tr></thead><tbody>${details}</tbody></table></div></details><div class="body note">${esc(r.interpretation||'')} ${esc(r.missing_history_policy||'')}</div></section>`;
}
function relativeMomentumResearch(b){
  let r=b.relative_momentum_research;if(!r?.ok)return '';
  let key='primary_30_within_one_year',periods=[['all_history','All history'],['development','Oldest 60% · development'],['validation','Next 20% · validation'],['final_historical_test','Newest 20% · frozen historical test']];
  let rate=x=>x?.success_rate_pct==null?'—':Number(x.success_rate_pct).toFixed(1)+'%',count=x=>`${num(x?.reached)}/${num(x?.completed_episodes)}`,change=x=>x==null?'—':(x>=0?'+':'')+Number(x).toFixed(1)+' pp';
  let rows=periods.map(([id,label])=>{let x=r.results?.[id]||{},base=x.baseline?.[key]||{},support=x.groups?.improving?.outcomes?.[key]||{},against=x.groups?.deteriorating?.outcomes?.[key]||{};return `<tr><td><b>${esc(label)}</b></td><td class="num">${count(base)} · ${rate(base)}</td><td class="num">${num(support.episodes)}</td><td class="num">${count(support)} · <b>${rate(support)}</b></td><td class="num">${num(against.episodes)}</td><td class="num">${count(against)} · <b>${rate(against)}</b></td><td class="num">${change(x.supportive_minus_contradictory_pp)}</td><td class="num">${pct(support.median_max_drawdown_pct)}</td></tr>`}).join('');
  let all=r.results?.all_history||{},secondary=[['secondary_25_within_one_year','+25% within one year'],['secondary_30_within_two_years','+30% within two years']].map(([outcome,label])=>{let base=all.baseline?.[outcome]||{},support=all.groups?.improving?.outcomes?.[outcome]||{},neutral=all.groups?.neutral?.outcomes?.[outcome]||{},against=all.groups?.deteriorating?.outcomes?.[outcome]||{};return `<tr><td><b>${label}</b></td><td class="num">${count(base)} · ${rate(base)}</td><td class="num">${count(support)} · ${rate(support)}</td><td class="num">${count(neutral)} · ${rate(neutral)}</td><td class="num">${count(against)} · ${rate(against)}</td></tr>`}).join('');
  let details=(r.episode_details||[]).map(x=>`<tr><td><b>${esc(x.ticker)}</b><br><span class="meta">${esc(x.company||'')}</span></td><td>${esc(x.earliest_buy_date)}</td><td>${esc(x.sector_benchmark||'—')}</td><td>${x.evidence_available?tag(esc(x.display_direction),x.classification==='improving'?'good':x.classification==='deteriorating'?'bad':'neutral'):tag('Unavailable','info')}</td><td class="num">${pct(x.stock_return_6m_pct)}</td><td class="num">${pct(x.sector_return_6m_pct)}</td><td class="num">${pct(x.relative_momentum_6m_pct)}</td><td class="num">${x.relative_momentum_change_1m_pp==null?'—':(x.relative_momentum_change_1m_pp>=0?'+':'')+Number(x.relative_momentum_change_1m_pp).toFixed(1)+' pp'}</td><td>${esc(x.measurement_as_of||'—')}</td><td class="num">${x.days_to_30_pct==null?'—':num(x.days_to_30_pct)+' days'}</td></tr>`).join('');
  let coverage=r.coverage||{},controls=r.anti_overfitting_controls||{},final=r.results?.final_historical_test||{};
  return `<section class="panel" id="relative-momentum-research"><div class="head"><h2>Does improving six-month relative momentum help?</h2><span class="hint meta">One frozen definition · research only · no score change</span></div><div class="body"><div class="callout"><b>${esc(r.research_conclusion||'Research conclusion unavailable')}</b> This remains “not validated” even if the historical checks look favorable.</div><div class="contract"><div class="cell"><div class="k">Definitions tested</div><div class="value">${num(r.experiment_registry?.definitions_tested)}</div></div><div class="cell"><div class="k">Earliest Buy episodes</div><div class="value">${num(coverage.earliest_buy_episodes)}</div></div><div class="cell"><div class="k">With aligned evidence</div><div class="value">${num(coverage.with_relative_momentum)}</div></div><div class="cell"><div class="k">Automatic scoring effect</div><div class="value">None</div></div></div><p class="note"><b>Frozen rule:</b> ${esc(r.factor_definition?.improving_rule||'')} The comparison benchmark is ${esc(r.factor_definition?.benchmark||'the sector ETF')}. ${esc(r.measurement_boundary||'')}</p><p class="note"><b>Anti-overfitting:</b> oldest ${num(controls.chronological_development_pct)}% development → next ${num(controls.chronological_validation_pct)}% validation → newest ${num(controls.chronological_final_historical_test_pct)}% one-time historical test. ${esc(controls.global_holdout_warning||'')} Trial registry: <span class="meta">${esc(r.experiment_registry?.path||'')}</span>.</p></div><div class="tablewrap"><table><thead><tr><th>Chronological period</th><th class="num">All Buys: reached/completed</th><th class="num">Supportive candidates</th><th class="num">Supportive +30% / 1y</th><th class="num">Contradictory candidates</th><th class="num">Contradictory +30% / 1y</th><th class="num">Supportive difference</th><th class="num">Supportive median drawdown</th></tr></thead><tbody>${rows}</tbody></table></div><details class="simple-details"><summary>See secondary target results</summary><div class="tablewrap"><table><thead><tr><th>Outcome</th><th class="num">All Buys</th><th class="num">Supportive</th><th class="num">Neutral</th><th class="num">Contradictory</th></tr></thead><tbody>${secondary}</tbody></table></div></details><details class="simple-details"><summary>Open stock-by-stock relative-momentum evidence</summary><div class="tablewrap"><table><thead><tr><th>Stock</th><th>First Buy</th><th>Sector ETF</th><th>Direction</th><th class="num">Stock 6m</th><th class="num">Sector 6m</th><th class="num">Stock minus sector</th><th class="num">Change vs one month earlier</th><th>Measured as of</th><th class="num">Days to +30%</th></tr></thead><tbody>${details}</tbody></table></div></details><div class="body note">${esc(r.interpretation||'')} Final historical comparison: supportive versus contradictory ${change(final.supportive_minus_contradictory_pp)}; supportive versus all Buys ${change(final.supportive_minus_all_buy_pp)}.</div></section>`;
}

function strategyCard(b){let s=b.strategy||{},a=b.artifact||{},r=b.runtime_contract||{},d=b.dilution_veto_research||{},entries=actualEntryRange(b),models=(s.target_models||[]).join(', '),cost=(s.slippage_bps??0)+(s.transaction_cost_bps??0),exitCost=(s.exit_slippage_bps??0)+(s.exit_transaction_cost_bps??0);let main=[
  ['Dates tested',entries.join(' → '),'The first and last dates on which the system made a historical decision.'],

  ['Stocks considered',b.screened_only?'Only stocks that passed the starting checks':'All available stocks','This defines which stocks were allowed to enter the test before Buy, Watch, or Avoid was decided.'],
  ['Price used to buy',s.entry==='next_close'?'Next available closing price':String(s.entry||'Historical closing price').replaceAll('_',' '),'The backtest does not assume we could buy before the recommendation was known.'],
  ['Market comparison',s.benchmark==='spy_total_return'?'S&P 500 including dividends':String(s.benchmark||'Average tested stock').replaceAll('_',' '),'A stock result is compared with this market result over the same dates.'],
  ['Main value goal',`+${s.minimum_upside_pct??30}% to +${s.maximum_upside_pct??100}%`,'The Practical value estimate must normally be at least 30% above the entry price. This is separate from the return explorer, where you can ask about any chosen gain.'],
  ['Time allowed for main goal',`${s.target_expiry_days??365} days normally`,'Some valuation methods use a longer period. Their exact time limit is shown in the target results.'],
  ['Buying and selling costs',`${cost/100}% when buying · ${exitCost/100}% when selling`,'These estimated costs are deducted so results do not assume free trading.'],
  ['Duplicate company rule',b.issuer_deduplication?.enabled?'One share class per company':'No company rule recorded','For companies such as Alphabet, only one representative share class is used on a test date.'],
  ['Data rule',s.data_quality_mode==='strict'?'Strict: only information known on that date':String(s.data_quality_mode||'Not recorded').replaceAll('_',' '),'This prevents later filings or later corrections from leaking into an earlier decision.'],
  ['Ticker identity',s.ticker_identity_policy==='strict_point_in_time'?'Ticker must have existed on that date':'Permanent vendor ticker history',s.ticker_identity_policy==='strict_point_in_time'?'Historical rows are removed when the displayed ticker began trading only after that decision date.':'The same current ticker may be displayed on dates before that ticker existed.'],
  ['Substantial dilution veto',d.production_effect==='tested_hard_veto'?`Avoid above ${d.selected_threshold_pct??10}% share-count growth YoY`:'Not recorded','A measured year-over-year share-count increase above the tested cutoff forces Avoid. Missing share-count history does not trigger the veto.']
];let technical=[['Strategy version',`${s.name||'—'} · v${s.version??'—'}`],['Strategy ID',s.strategy_id||'—'],['Code fingerprint',b.implementation_fingerprint||'Not recorded'],['Created',a.generated_at||'Not recorded'],['Source code version',r.git_commit||a.source_commit||'Not recorded'],['Full source-data dates',(b.window||[]).join(' → ')],['Warm-up data',`${b.warmup_days} days`],['Return check dates',(s.horizons_days||[]).map(x=>x+' days').join(', ')],['How a target counts as reached',`${s.target_hit||'close'} · ${b.data_quality?.universe_bias==='active_and_delisted_point_in_time'?'checked every trading day':'checked on sampled dates'}`],['Invalid ticker rows removed',`${num(b.ticker_identity_control?.excluded_universe_rows||0)} rows · ${num(b.ticker_identity_control?.excluded_unique_tickers||0)} tickers`],['Invalid ticker observations remaining',num(b.ticker_identity_control?.remaining_invalid_observations||0)],['Dilution thresholds compared',(d.thresholds_tested_pct||[]).map(x=>x+'%').join(', ')||'Not recorded'],['Dilution-veto evidence',d.selected?`${num(d.selected.removed_buy_signals)} Buy signals removed · ${pp(d.selected.full_history_change_pp)} full history · ${pp(d.selected.final_unseen_change_pp)} final unseen`:'Not recorded'],['Value methods',models||'—'],['Primary value method',`${s.primary_target||'practical'} · ${s.practical_target_policy||'nearest credible'}`],['Weight-change rule',s.tuning_promotion||'—'],['Extra check periods',(s.challenger_holds_days||[]).map(x=>x+' days').join(', ')],['Evidence storage',b.evidence_delivery?.mode||'inline'],['Built by',a.generator||'Not recorded']];return `<section class="panel" id="rules"><div class="head"><h2>1. What rules did this backtest use?</h2><span class="hint meta">Start simple · open details when needed</span></div><div class="body"><div class="goal-banner"><strong>Main valuation goal: at least +${s.minimum_upside_pct??30}%</strong><span>The Practical estimate can range up to +${s.maximum_upside_pct??100}%. The return explorer below can test smaller or larger gains.</span></div><div class="contract">${main.map(x=>`<div class="cell"><div class="k">${esc(x[0])}${help(x[2])}</div><div class="value">${esc(x[1])}</div></div>`).join('')}</div><details class="simple-details"><summary>Open technical details needed to reproduce this test ${help('These exact IDs and settings help us prove which code and rules produced this result.')}</summary><div><div class="contract">${technical.map(x=>`<div class="cell"><div class="k">${esc(x[0])}${help('Recorded so this exact backtest can be checked or run again.')}</div><div class="value">${esc(x[1])}</div></div>`).join('')}</div></div></details></div></section>`}

function validation(b){let h=health(b),buy=b.by_verdict?.Buy||{},maxN=Math.max(...['Buy','Watch','Avoid'].map(v=>b.by_verdict?.[v]?.n||0),1),cards=['Buy','Watch','Avoid'].map(v=>{let x=b.by_verdict?.[v]||{};return `<div class="result-card"><div class="result-main">${statusTag(v)}<span class="result-number ${x.mean_alpha_pct>=0?'good':'bad'}">${pct(x.mean_alpha_pct)}</span></div><div class="bar"><span style="width:${Math.max(2,(x.n||0)/maxN*100)}%"></span></div><b>${num(x.n)} decisions checked</b><p class="note">Average extra return versus the S&P 500: <b>${pct(x.mean_alpha_pct)}</b><br>Typical extra return: <b>${pct(x.median_alpha_pct)}</b></p></div>`}).join('');let criteria=[
  ['Buy advantage over Avoid',b.buy_minus_avoid_pct>0,pct(b.buy_minus_avoid_pct),'Average Buy result minus average Avoid result. Positive is better.'],
  ['Likely Buy advantage across different test dates',b.significant===true,(b.spread_ci90||[]).map(pct).join(' to ')||'—','A likely range after allowing for stronger and weaker test dates. The old name was “cohort 90% CI”.'],
  ['More cautious likely range',(b.spread_ci90_two_way||[])[0]>0,(b.spread_ci90_two_way||[]).map(pct).join(' to ')||'—','A stricter range that allows for different test dates and the same company appearing again. The old name was “cohort + issuer CI”.'],

];let strategyCards=Object.entries(b.by_strategy||{}).map(([k,x])=>{let xb=x.by_verdict?.Buy||{},xa=x.by_verdict?.Avoid||{};return `<div class="card"><h3>${esc(k.replaceAll('_',' '))}</h3><p>Rules used: <b>${esc(String(x.preset||'default').replaceAll('_',' '))}</b>${help('The scoring weights used by the live strategy were replayed separately.')}</p><div class="grid2"><div><span class="k">Buy decisions</span><div class="smallv">${num(xb.n)} · ${pct(xb.mean_alpha_pct)} extra</div></div><div><span class="k">Avoid decisions</span><div class="smallv">${num(xa.n)} · ${pct(xa.mean_alpha_pct)} extra</div></div></div><p><b>Buy advantage over Avoid: ${pct(x.buy_minus_avoid_pct)}</b></p></div>`}).join('');return `<section class="panel" id="reliability"><div class="head"><h2>2. How reliable are these results? ${help('These checks look for evidence that Buy decisions behaved better than Watch and Avoid decisions, while allowing for repeated dates and companies.')}</h2>${tag(`${h.positive} of ${h.checks.length} checks passed`,h.pass?'good':'warn')}</div><div class="body"><div class="plain-grid">${cards}</div><p class="note">“Extra return” means the stock's ${b.hold_days}-day return minus the S&P 500 return over the same dates. Repeated recommendations are counted here, so the cautious ranges below make that repetition visible.</p><h3>Six reliability checks</h3><div class="criteria">${criteria.map(c=>`<div class="criterion">${tag(c[1]?'Passed':'Needs review',c[1]?'good':'warn')}<b>${esc(c[0])}${help(c[3])}</b><span class="answer">${esc(c[2])}</span></div>`).join('')}</div><details class="simple-details"><summary>Open results for each live strategy ${help('Deep Value and Quality Growth are checked separately using their own live scoring rules.')}</summary><div><div class="strategy-cards">${strategyCards||'<p>Not available</p>'}</div><p class="note">A stock that passes both starting checks is placed in Deep Value, matching the live recommendations page.</p></div></details></div></section>`}

function horizons(b){let rows=Object.values(b.horizon_summary||{}).map(x=>{let buy=x.by_verdict?.Buy||{},avoid=x.by_verdict?.Avoid||{},market=(buy.mean_raw_return_pct??0)-(buy.mean_alpha_pct??0),ci=x.spread_ci90_cohort||[],two=x.spread_ci90_two_way||[];return `<tr><td><b>${num(x.calendar_days)} days</b><br><span class="meta">about ${x.approximately_months} months</span></td><td class="num">${num(buy.n)}</td><td class="num">${pct(buy.mean_raw_return_pct)}</td><td class="num">${pct(market)}</td><td class="num ${buy.mean_alpha_pct>=0?'good':'bad'}"><b>${pct(buy.mean_alpha_pct)}</b></td><td class="num">${pct(avoid.mean_alpha_pct)}</td><td class="num">${pct(x.buy_minus_avoid_pct)}</td><td class="num">${ci.length?ci.map(pct).join(' to '):'—'}</td><td class="num">${two.length?two.map(pct).join(' to '):'—'}</td><td>${tag(x.significant?'Passed':'Needs review',x.significant?'good':'warn')} ${tag(x.monotonic?'Ordered correctly':'Not ordered',x.monotonic?'good':'warn')}</td></tr>`}).join('');return rows?`<section class="panel" id="durability"><div class="head"><h2>3. Does the Buy advantage last over time? ${help('The same decisions are checked after several holding periods, so we can see whether the result is short-lived or persistent.')}</h2><span class="hint meta">Trading costs included</span></div><div class="body"><div class="callout"><b>Read this first:</b> A negative Buy extra return means FairEntry Buys did worse than simply holding the S&P 500 for the same time. The Buy return and S&P 500 return are shown side by side.</div></div><details class="simple-details" open><summary>Open the results by holding period</summary><div class="tablewrap"><table><thead><tr><th>Time held</th><th class="num">Buy decisions</th><th class="num">Buy return</th><th class="num">S&P 500 return</th><th class="num">Buy extra return ${help('Buy return minus the S&P 500 return over the same matched dates. Negative means the S&P 500 did better.')}</th><th class="num">Avoid extra return</th><th class="num">Buy advantage over Avoid</th><th class="num">Likely range by test date ${help('Allows for stronger and weaker test dates. Previously called cohort CI.')}</th><th class="num">More cautious likely range ${help('Also allows for the same company appearing more than once.')}</th><th>Check result</th></tr></thead><tbody>${rows}</tbody></table></div></details><div class="body note">The 365-day row is one year; 730, 1,095 and 1,825 days are two, three and five years. Recent recommendations without enough time remain incomplete, not failures. A positive Buy return is not enough when the S&P 500 earned more over the same dates.</div></section>`:''}

function weightValidation(b){
  let w=b.weight_validation;if(!w)return '';
  if(!w.ok)return `<section class="panel" id="weights"><div class="head"><h2>4. Can different weights improve one-year Buy results?</h2>${tag('Keep current weights','warn')}</div><div class="body"><div class="callout"><b>The weight test could not be completed:</b> ${esc(w.reason||'Not enough completed history.')}</div><p class="note">The live default was not changed.</p></div></section>`;
  let policy=w.policy||{},lower=policy.lower_gain_pct??25,primary=policy.primary_gain_pct??30,upper=policy.upper_gain_pct??policy.secondary_gain_pct??35,
      rate=x=>x==null?'—':Number(x).toFixed(1)+'%', signed=x=>x==null?'—':pct(x),
      dates=Object.entries(w.split||{}).map(([key,x])=>`<tr><td><b>${esc(key==='development'?'Older dates used to choose':key==='validation'?'Later dates used to reject weak choices':'Final untouched dates')}</b></td><td>${esc(x.first)} → ${esc(x.last)}</td><td class="num">${num(x.cohorts)}</td></tr>`).join(''),
      weights=(w.active_categories||[]).map(key=>{let old=w.current_weights?.[key],next=w.challenger_weights?.[key],change=(typeof old==='number'&&typeof next==='number')?next-old:null;return `<tr><td><b>${esc(key.replaceAll('_',' '))}</b></td><td class="num">${rate(old)}</td><td class="num">${rate(next)}</td><td class="num ${change>=0?'good':'bad'}">${signed(change)}</td></tr>`}).join(''),
      splitRows=['development','validation','test'].map(key=>{let old=w.current?.[key]||{},next=w.challenger?.[key]||{},label=key==='development'?'Older dates used to choose':key==='validation'?'Later check':'Final untouched check';return `<tr><td><b>${label}</b></td><td class="num">${num(old.completed_episodes)}</td><td class="num">${rate(old.lower_hit_rate_pct)}</td><td class="num">${rate(next.lower_hit_rate_pct)}</td><td class="num">${rate(old.primary_hit_rate_pct)}</td><td class="num">${rate(next.primary_hit_rate_pct)}</td><td class="num">${rate(old.upper_hit_rate_pct??old.secondary_hit_rate_pct)}</td><td class="num">${rate(next.upper_hit_rate_pct??next.secondary_hit_rate_pct)}</td><td class="num">${rate(old.large_loss_rate_pct)}</td><td class="num">${rate(next.large_loss_rate_pct)}</td><td class="num">${signed(old.mean_one_year_alpha_pct)}</td><td class="num">${signed(next.mean_one_year_alpha_pct)}</td></tr>`}).join(''),
      checkValue=(value,id)=>value==null?'—':(['enough_episodes','all_episodes','all_issuers','years','sectors'].includes(id)?num(value):rate(value)),
      checks=(rows,title)=>`<div class="card"><h3>${title}</h3><div class="criteria">${(rows||[]).map(x=>`<div class="criterion">${tag(x.passed?'Passed':'Did not pass',x.passed?'good':'warn')}<b>${esc(x.label)}${help(x.rule)}</b><span class="answer">Current ${checkValue(x.current,x.id)} → challenger ${checkValue(x.challenger,x.id)}</span></div>`).join('')}</div></div>`,
      oldAll=w.current?.all||{},newAll=w.challenger?.all||{},status=w.promotion_eligible?'Ready for manual review':'Keep current weights';
  return `<section class="panel" id="weights"><div class="head"><h2>4. Can different weights improve one-year Buy results? ${help(`The main goal is one Buy episode reaching +${primary}% within one year. Repeated weekly Buys are not separate investments.`)}</h2>${tag(status,w.promotion_eligible?'good':'warn')}</div><div class="body"><div class="goal-banner"><strong>Goal: improve +${primary}% within one year</strong><span>Protect the acceptable +${lower}% result, confirm stronger +${upper}% upside, and do not worsen large losses, typical declines or the one-year result versus the S&amp;P 500.</span></div><div class="callout"><b>No automatic change:</b> ${esc(w.promotion_note)} The result shown here is a challenger, not a new default.</div><div class="plain-grid"><div class="result-card"><div class="k">Current weights</div><div class="v">${rate(oldAll.primary_hit_rate_pct)}</div><p class="note">Reached +${primary}%: ${num(oldAll.primary_reached)} of ${num(oldAll.completed_episodes)} completed Buy episodes<br>Likely range: ${(oldAll.primary_hit_ci90||[]).map(rate).join(' to ')||'—'}<br>Different companies: ${num(oldAll.unique_issuers)}</p></div><div class="result-card"><div class="k">Challenger weights</div><div class="v ${newAll.primary_hit_rate_pct>oldAll.primary_hit_rate_pct?'good':'bad'}">${rate(newAll.primary_hit_rate_pct)}</div><p class="note">Reached +${primary}%: ${num(newAll.primary_reached)} of ${num(newAll.completed_episodes)} completed Buy episodes<br>Likely range: ${(newAll.primary_hit_ci90||[]).map(rate).join(' to ')||'—'}<br>Different companies: ${num(newAll.unique_issuers)}</p></div><div class="result-card"><div class="k">Decision</div><div class="v">${esc(status)}</div><p class="note">${num(w.candidates_evaluated)} total choices checked: the current weights plus ${num(w.candidates_generated)} generated challengers.<br>The configured default remains unchanged.</p></div></div><details class="simple-details" open><summary>Compare the current and challenger results</summary><div class="tablewrap"><table><thead><tr><th>Historical period</th><th class="num">Current completed episodes</th><th class="num">Current +${lower}%</th><th class="num">Challenger +${lower}%</th><th class="num">Current +${primary}%</th><th class="num">Challenger +${primary}%</th><th class="num">Current +${upper}%</th><th class="num">Challenger +${upper}%</th><th class="num">Current large losses</th><th class="num">Challenger large losses</th><th class="num">Current extra return</th><th class="num">Challenger extra return</th></tr></thead><tbody>${splitRows}</tbody></table></div></details><details class="simple-details"><summary>Open the exact current and challenger weights</summary><div class="tablewrap"><table><thead><tr><th>Tested area</th><th class="num">Current effective weight</th><th class="num">Challenger weight</th><th class="num">Change</th></tr></thead><tbody>${weights}</tbody></table></div><p class="note">${(w.inactive_categories||[]).map(x=>esc(x.replaceAll('_',' '))).join(' and ')} remain information only and have zero verdict weight.</p></details><details class="simple-details"><summary>Open every pass/fail condition</summary><div class="grid2">${checks(w.validation_checks,'Later-date checks')}${checks(w.test_checks,'Final untouched checks')}${checks(w.sample_checks,'Sample-size checks')}<div class="card"><h3>Consistency across years and business areas</h3>${tag(w.stability?.passed?'Passed':'Did not pass',w.stability?.passed?'good':'warn')}<p>${rate(w.stability?.not_materially_worse_pct)} of comparable groups were not materially worse.</p><p class="note">${esc(w.stability?.rule||'')}</p></div></div></details><details class="simple-details"><summary>Open the dates used for choosing and checking</summary><div class="tablewrap"><table><thead><tr><th>Purpose</th><th>Date range</th><th class="num">Decision dates</th></tr></thead><tbody>${dates}</tbody></table></div></details></div></section>`
}

function exactReplayWeights(b){let w=b.weight_validation;if(!w?.ok)return '';let names={growth:'Growth',quality:'Business quality',valuation:'Valuation',confirmation:'Market confirmation',survival:'Financial survival'},order=['growth','quality','valuation','confirmation','survival'],rows=order.filter(k=>w.current_weights?.[k]!=null).map(k=>`<tr><td><b>${names[k]||esc(k)}</b></td><td class="num"><b>${Number(w.current_weights[k]).toFixed(2)}%</b></td><td class="num">${w.challenger_weights?.[k]==null?'â€”':Number(w.challenger_weights[k]).toFixed(2)+'%'}</td></tr>`).join('');return `<section class="panel" id="exact-weights"><div class="head"><h2>Exact weights used in this SFA replay ${help('These are the actual percentage shares used to calculate every historical tested score.')}</h2><span class="hint meta">Run ${esc(b.run_id||'')}</span></div><div class="body"><div class="goal-banner"><strong>These are the replayed weights, not suggested ranges.</strong><span>The board displays the same percentages for today's live decisions.</span></div><div class="tablewrap"><table><thead><tr><th>Tested area</th><th class="num">SFA replay weight</th><th class="num">Best rejected challenger</th></tr></thead><tbody>${rows}</tbody></table></div><p class="note">Catalysts, news and risk notes had 0% verdict weight because they were not reproduced historically. The former 18, 5, 27, 15, 15 display scale is preserved as “Previous displayed weights (same proportions).” It produces the same score because its proportions are identical.</p></div></section>`}
function groupedReturns(rows,keyFn,hold){let groups={};rows.forEach(o=>{let r=o.horizons?.[String(hold)]?.return_pct;if(typeof r!=='number')return;let k=keyFn(o)||'Unknown';let g=groups[k]||(groups[k]={Buy:[],Watch:[],Avoid:[],tickers:new Set()});(g[o.verdict]||=[]).push(r);g.tickers.add(o.ticker)});return Object.entries(groups).map(([key,g])=>({key,unique:g.tickers.size,n:g.Buy.length+g.Watch.length+g.Avoid.length,Buy:mean(g.Buy),Watch:mean(g.Watch),Avoid:mean(g.Avoid)}))}
function stability(b){let obs=b.observations||[],hold=b.hold_days||30,summary=b.evidence_return_summary||{},years=(summary.by_year||groupedReturns(obs,o=>(o.entry_date||'').slice(0,4),hold)).sort((a,c)=>a.key.localeCompare(c.key)),sectors=(summary.by_sector||groupedReturns(obs,o=>o.sector,hold)).sort((a,c)=>(c.n-a.n)).slice(0,12),coh=[...(b.per_cohort||[])].filter(x=>typeof x.buy_alpha_pct==='number').sort((a,c)=>a.buy_alpha_pct-c.buy_alpha_pct),worst=coh[0],best=coh[coh.length-1],pros=b.survivorship_control||{},sfa=b.data_quality?.universe_bias==='active_and_delisted_point_in_time';let table=rows=>`<div class="tablewrap"><table><thead><tr><th>Group</th><th class="num">Observations</th><th class="num">Unique</th><th class="num">Buy raw</th><th class="num">Watch raw</th><th class="num">Avoid raw</th></tr></thead><tbody>${rows.map(x=>`<tr><td>${esc(x.key)}</td><td class="num">${num(x.n)}</td><td class="num">${num(x.unique)}</td><td class="num">${pct(x.Buy)}</td><td class="num">${pct(x.Watch)}</td><td class="num">${pct(x.Avoid)}</td></tr>`).join('')}</tbody></table></div>`;return `<section class="panel" id="stability"><div class="head"><h2>3. Stability and concentration</h2><span class="hint meta">Full-population raw returns at ${hold} days</span></div><div class="body"><div class="grid2"><div class="card"><h3>By entry year</h3>${table(years)}</div><div class="card"><h3>By sector (largest samples)</h3>${table(sectors)}</div></div><div class="grid3"><div class="card"><h3>Worst Buy cohort</h3><div class="v bad">${worst?pct(worst.buy_alpha_pct):'—'}</div><p class="note">${worst?`${esc(worst.entry)} · ${worst.buy_n} Buys · cohort return ${pct(worst.mkt_return_pct)}`:'Not available'}</p></div><div class="card"><h3>Best Buy cohort</h3><div class="v good">${best?pct(best.buy_alpha_pct):'—'}</div><p class="note">${best?`${esc(best.entry)} · ${best.buy_n} Buys · cohort return ${pct(best.mkt_return_pct)}`:'Not available'}</p></div><div class="card"><h3>Evidence availability</h3><div class="availability"><div class="row"><b>Historical replay</b><br>${tag(sfa?'Included · point-in-time active + delisted':'Included · current survivors',sfa?'good':'warn')}</div><div class="row"><b>Prospective signal comparison</b><br>${tag(`${num(pros.prospective_signal_events||0)} signals · ${pros.status||'not bundled'}`,pros.prospective_signal_events?'good':'warn')}</div><div class="row"><b>Default vs challenger weights</b><br>${tag('Workflow summary only','warn')}</div></div></div></div><p class="note">Year and sector tables show full-population raw outcome returns, not independently bootstrapped alpha. Prospective signals are reported separately and never mixed into historical replay.</p>${qualityPanel(obs)}</div></section>`}
function qualityPanel(obs){let counts={};obs.forEach(o=>{let q=o.quality_grade||'unknown';counts[q]=(counts[q]||0)+1});let total=obs.length||1;return `<div class="card"><h3>Data-quality distribution ${DATA?.public_evidence_sample?'(display sample)':''}</h3><div class="stats">${Object.entries(counts).map(([k,n])=>`<div class="stat"><div class="k">${esc(k.replaceAll('_',' '))}</div><div class="v">${num(n)}</div><div class="meta">${(n/total*100).toFixed(1)}%</div></div>`).join('')}</div><p class="note">Coverage counts only observed evidence; neutral defaults no longer masquerade as available data. Public quality counts describe the licensed-data-safe drill-down sample.</p></div>`}

function ciText(x){return x?.length?`${x[0].toFixed(1)}–${x[1].toFixed(1)}%`:'—'}
function expiryText(x){return x?.length?(x[0]===x[1]?x[0]+'d':x[0]+'–'+x[1]+'d'):'—'}
function methods(b){let m=b.target_method_summary||{},rows=Object.keys(m).map(k=>{let x=m[k];return `<tr><td><b>${esc(k.replaceAll('_',' '))}</b></td><td class="num">${num(x.observations)}</td><td class="num">${num(x.unique_stocks)}</td><td class="num">${num(x.unique_cohorts)}</td><td class="num">${num(x.already_above_at_entry)}</td><td class="num">${num(x.active)}</td><td class="num">${num(x.reached)}</td><td class="num">${num(x.expired)}</td><td class="num">${num(x.evaluable)}</td><td class="num">${x.hit_rate_pct==null?'—':x.hit_rate_pct+'%'}</td><td class="num">${ciText(x.hit_rate_ci90)}</td><td class="num">${ciText(x.hit_rate_cohort_ci90)}</td><td class="num">${ciText(x.hit_rate_two_way_ci90)}</td><td class="num">${x.median_days_to_target??'—'}</td><td class="num">${pct(x.median_upside_pct)}</td><td class="num">${expiryText(x.expiry_days_range)}</td></tr>`}).join('');return `<section class="panel" id="target-methods"><div class="head"><h2>6. Did each estimated value get reached? ${help('Compares every value estimate made on a Buy date with the later daily prices.')}</h2><span class="hint meta">Buy decisions only</span></div><div class="body"><div class="goal-banner"><strong>The +100% setting is not a maximum possible gain.</strong><span>It only stops the main valuation method from choosing an implausibly distant value. Actual gains can be higher, and the return explorer now checks through +200%.</span></div><div class="callout"><b>How the reached percentage is calculated:</b> reached later ÷ (reached later + time ended). Values already below the Buy price are labeled “Already above on Buy day,” not successes. Goals still in progress are not failures.</div><details class="simple-details"><summary>Open the detailed results for every value method</summary><div class="tablewrap"><table><thead><tr><th>Value method</th><th class="num">Available estimates</th><th class="num">Different stocks</th><th class="num">Different test dates</th><th class="num">Already above on Buy day</th><th class="num">Still in progress</th><th class="num">Reached later</th><th class="num">Time ended</th><th class="num">Completed cases</th><th class="num">Reached percentage</th><th class="num">Simple likely range ${help('A likely range based on the number of completed cases.')}</th><th class="num">Range allowing for test dates ${help('Allows for stronger and weaker historical test dates.')}</th><th class="num">Most cautious range ${help('Allows for both repeated test dates and repeated companies.')}</th><th class="num">Typical days to reach</th><th class="num">Typical estimated gain</th><th class="num">Time allowed</th></tr></thead><tbody>${rows}</tbody></table></div></details><p class="note">Different value methods can have different time limits. Compare both the reached percentage and the “Time allowed” column; a four-year goal is not directly comparable with a one-year goal.</p></div></section>`}

function sfaExtras(b){if(!b.regime_summary)return '';let p=b.portfolio_summary||{},reg=Object.entries(b.regime_summary).map(([k,v])=>`<tr><td>${esc(k)}</td><td class="num">${num(v.cohorts)}</td><td class="num">${pct(v.mean_buy_alpha_pct)}</td></tr>`).join('');return `<section class="panel" id="regimes"><div class="head"><h2>SFA regime and portfolio diagnostics</h2><span class="hint meta">Point-in-time historical universe</span></div><div class="body grid2"><div class="card"><h3>Market regimes</h3><table><thead><tr><th>Regime</th><th class="num">Cohorts</th><th class="num">Buy alpha</th></tr></thead><tbody>${reg}</tbody></table></div><div class="card"><h3>Constrained Buy portfolio</h3><p>Cohort periods: <b>${num(p.cohort_periods)}</b> · cash periods: <b>${num(p.cash_periods)}</b><br>Positions traded: <b>${num(p.positions_traded)}</b> · maximum per cohort: <b>${num(p.max_positions_per_cohort)}</b><br>Compounded return: <b>${pct(p.compounded_return_pct)}</b><br>Maximum drawdown (${esc(p.drawdown_frequency||'endpoints')}): <b>${pct(p.max_drawdown_pct)}</b><br>Annualized Sharpe: <b>${p.annualized_sharpe_approx??'—'}</b></p><p class="note">Equal-weight highest-score Buys; no-Buy cohorts remain in cash; configured entry and exit costs are included. ${p.overlapping?'Holding windows overlap.':'Default cohort spacing is non-overlapping.'}</p></div></div></section>`}

function returnHorizonLabel(days){return days===90?'3 months':days===180?'6 months':days===270?'9 months':days===365?'1 year':days===730?'2 years':days===1095?'3 years':days===1825?'5 years':days+' days'}
function returnExplorer(b){let a=b.buy_return_achievement;if(!a?.views?.episodes)return '';let thresholds=a.thresholds_pct||[],horizons=a.horizons_days||[];return `<section class="panel" id="return-explorer"><div class="head"><h2>5. How often did a Buy reach my chosen gain?</h2><span class="hint meta">Trading costs included</span></div><div class="body"><div class="goal-banner"><strong>The main valuation goal is +30%.</strong><span>This explorer is different: choose any gain from +${Math.min(...thresholds)}% to +${Math.max(...thresholds)}% and see what happened historically.</span></div><p class="note">Choose a gain and a time period. We show how many completed cases reached it and how long successful cases took. Historical results are evidence, not a promise.</p><div class="return-controls"><label>Gain I want ${help('This is your question for the history. It does not change the main Practical valuation goal of at least +30%.')}<select id="return-threshold">${thresholds.map(x=>`<option value="${x}" ${x===30?'selected':''}>+${x}%</option>`).join('')}</select></label><label>Time I am willing to wait ${help('A case is complete only when this full amount of time has passed, unless the stock stopped trading earlier.')}<select id="return-horizon">${horizons.map(x=>`<option value="${x}" ${x===365?'selected':''}>${returnHorizonLabel(x)}</option>`).join('')}</select></label><label>How repeated Buys are counted ${help('A Buy signal is every date the system said Buy. A Buy episode combines consecutive Buy signals for the same company into one investment story, starting with the first Buy.')}<select id="return-view"><option value="episodes" selected>One continuous Buy period per company</option><option value="signals">Every date that said Buy</option></select></label></div><div class="return-stats"><div class="stat"><div class="k" id="return-rate-label">Reached goal</div><div class="v good" id="return-rate">—</div><div class="meta" id="return-count"></div></div><div class="stat"><div class="k">Typical time among successes</div><div class="v" id="return-days">—</div><div class="meta" id="return-days-range"></div></div><div class="stat"><div class="k">Likely historical range ${help('A range that shows the uncertainty caused by having a limited number of completed cases.')}</div><div class="v" id="return-ci">—</div><div class="meta">Incomplete cases are not treated as failures</div></div></div><div class="return-chart"><div class="return-chart-head"><h3 id="return-chart-title">Percentage reaching the chosen gain over time</h3><span class="meta" id="return-view-note"></span></div><svg id="return-svg" role="img" aria-label="Percentage of completed Buy cases reaching the selected return over time"></svg><div class="return-detail"><b id="return-detail-main"></b><span class="meta" id="return-detail-more"></span></div></div><details class="simple-details"><summary>Open every gain and time combination</summary><div class="tablewrap"><table class="return-matrix"><thead><tr><th>Chosen gain</th>${horizons.map(x=>`<th class="num">${returnHorizonLabel(x)}</th>`).join('')}</tr></thead><tbody id="return-matrix"></tbody></table></div></details><div class="callout" style="margin-top:14px"><b>Why two counting choices?</b> “One continuous Buy period” avoids making five consecutive Buy dates look like five independent investments. “Every date” remains available so you can inspect every decision the system actually made.</div><details class="simple-details"><summary>Open the exact counting rules</summary><div class="note">${esc(a.episode_definition)} ${esc(a.active_policy)}</div></details></div></section>`}
function missReasonLabel(code){return ({stayed_at_or_below_entry:'Never above entry price',modest_gain_short_of_target:'Gained, but well short',close_but_short_of_target:'Came close, but short',near_target_no_qualifying_close:'Near target, no qualifying close'})[code]||''}
function fixedEpisodeLabel(x){return ({within_one_year:'Reached within 1 year',during_year_two:'Reached during year 2',during_year_three:'Reached during year 3',after_three_years:'Reached after 3 years',never_within_three_years:'Did not reach within 3 years',closed_early_failure:'Business ended early',closed_early_excluded:'Result unavailable',missed_within_one_year_tracking:'Missed within 1 year · tracking',still_waiting:'Still waiting'})[x.fixed_30_status]||'Not available'}
function practicalEpisodeLabel(p){return ({reached:'Reached on time',reached_late:'Reached late',expired:'Did not reach by deadline',closed_early_failure:'Business ended early',closed_early_excluded:'Result unavailable',active:'Still waiting',unavailable:'No valid target',already_above_at_entry:'Already above on Buy day'})[p?.status]||'Not available'}
function practicalMethodLabel(method){return ({peer_ps:'Peer sales comparison',fcf:'Free cash flow value',fundamental:'Combined fundamental value'})[method]||'No usable method'}
function practicalUnavailableReason(p){return p?.reason||(p?.status==='unavailable'?'No tested stock-specific value was both credible and inside the allowed Practical Target gain range.':'')}
function targetFailureSummary(b){let a=b.buy_return_achievement?.primary_success_contract?.target_failure_reason_analysis;if(!a)return '';let catalog=a.catalog||[],rows=catalog.map(x=>({...x,count:a.counts?.[x.code]||0})).filter(x=>x.count).sort((x,y)=>y.count-x.count);return `<section class="panel" id="failure-reasons"><div class="head"><h2>Why failed Buy targets fell short</h2><span class="hint meta">standardized, evidence-backed reasons</span></div><div class="body"><div class="callout"><b>Failure reasons are recorded only after a target has definitively failed.</b> Successful and still-active targets have a blank Reasons field. Event explanations are not guessed when the replay lacks evidence.</div>${rows.length?`<div class="deadline-ladder">${rows.map(x=>`<div class="deadline-step"><b>${num(x.count)}</b><small>${esc(x.phrase)}</small></div>`).join('')}</div>`:'<p class="note">No completed failed targets have a verified reason in this replay.</p>'}<p class="note">${esc(a.basis||'')}</p></div></section>`}
function researchedFailureTable(b){let rows=(b.buy_return_achievement?.episode_details||[]).filter(x=>x.fixed_30_evaluation?.result==='failure'&&(x.target_failure_reasons||[]).length);if(!rows.length)return '';return `<section class="panel" id="researched-failures"><div class="head"><h2>Failed +30% within one year — researched reasons</h2><span class="hint meta">${num(rows.length)} failed Buy episodes only</span></div><div class="body"><div class="callout"><b>This is the requested Why column.</b> It contains one concise researched reason only for Buy recommendations that failed to reach +30% within one year. Successful and incomplete recommendations are excluded.</div></div><div class="tablewrap"><table><thead><tr><th>Stock</th><th>First Buy</th><th>Highest one-year gain</th><th>Why it failed to reach +30% within one year</th><th>Cause category</th><th>Research</th></tr></thead><tbody>${rows.map(x=>{let r=x.target_failure_reasons[0]||{},links=(r.sources||[]).map((u,i)=>`<a class="reason-link" href="${esc(u)}" target="_blank" rel="noopener">source ${i+1}</a>`).join(' · ');return `<tr><td><b>${esc(x.ticker)}</b><br><span class="meta">${esc(x.company||'')}</span></td><td>${esc(x.started)}</td><td class="num">${pct(x.highest_gain_within_one_year_pct)}</td><td style="white-space:normal;min-width:420px"><b>${esc(r.phrase||'Reason unavailable')}</b></td><td>${esc((r.category||'risk').replaceAll('_',' '))}</td><td>${links||'—'}</td></tr>`}).join('')}</tbody></table></div></section>`}
function failureResearchQueue(b){let q=b.failure_research_queue;if(!q)return '';let pending=q.pending_research||0;return `<section class="panel" id="failure-research-queue"><div class="head"><h2>New failure research queue</h2><span class="hint meta">${num(pending)} awaiting research</span></div><div class="body"><div class="callout"><b>${num(q.covered_by_existing_research||0)} of ${num(q.failed_episodes||0)} failed episodes are covered by saved research.</b> New uncovered failures are automatically queued after every backtest. Existing research is preserved, source-backed findings are append-only, and this qualitative information never changes the score.</div>${pending?`<p><a class="reason-link" href="${esc(q.path||'data/target-failure-research-queue.json')}" target="_blank" rel="noopener">Open pending research queue</a></p>`:'<p class="note">No new failed stocks require research.</p>'}</div></section>`}
function kv(obj,emptyLabel='None recorded'){if(obj==null)return `<p class="meta">${esc(emptyLabel)}</p>`;let entries=Array.isArray(obj)?obj.map((v,i)=>[i,v]):typeof obj==='object'?Object.entries(obj):null;if(!entries)return `<p class="meta">${esc(String(obj))}</p>`;if(!entries.length)return `<p class="meta">${esc(emptyLabel)}</p>`;return `<ul class="kv-list">${entries.map(([k,v])=>`<li><span class="kv-key">${esc(String(k).replaceAll('_',' '))}</span><span class="kv-val">${esc(v&&typeof v==='object'?JSON.stringify(v):v)}</span></li>`).join('')}</ul>`}
function reasonEvidence(r){return (r?.evidence||[]).filter(x=>x.value!=null).map(x=>`<li>${esc(x.label)}: <b>${esc(x.value)}${esc(x.unit||'')}</b></li>`).join('')}
function failureReasons(rows){return (rows||[]).map(r=>{let links=(r.sources||[]).map((u,i)=>`<a href="${esc(u)}" target="_blank" rel="noopener">source ${i+1}</a>`).join(' · ');return `<li><b>${esc(r.phrase)}</b><br><span class="meta">${esc(r.evidence||'No evidence recorded')} · existing category: ${esc((r.category||'risk').replaceAll('_',' '))}${links?' · '+links:''}</span></li>`}).join('')}

function buildToc(){

let TOC_SPY;
function setupTocSpy(){
  let links=[...document.querySelectorAll('#toc a')];if(!links.length)return;
  let byId=new Map(links.map(a=>[a.getAttribute('href').slice(1),a]));
  TOC_SPY?.disconnect();
  TOC_SPY=new IntersectionObserver(entries=>{
    entries.forEach(e=>{if(!e.isIntersecting)return;let link=byId.get(e.target.id);if(!link)return;
      document.querySelectorAll('#toc a.active').forEach(a=>a.classList.remove('active'));
      link.classList.add('active');link.scrollIntoView({block:'nearest',inline:'center',behavior:'smooth'})});
  },{rootMargin:'-35% 0px -55% 0px',threshold:0});
