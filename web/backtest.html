<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>FairEntry Backtest Evidence</title>
  <style>
    :root{--bg:#eef1f6;--panel:#fff;--ink:#171b23;--soft:#596276;--line:#dde2ec;--accent:#4a5ee0;--good:#177a45;--warn:#95670b;--bad:#b92943;--sunk:#f4f6fb;--info:#3157a4;--mono:ui-monospace,Consolas,monospace}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px system-ui,-apple-system,"Segoe UI",sans-serif}a{color:inherit;text-decoration:none}
    .top{position:sticky;top:0;z-index:3;display:flex;gap:14px;align-items:center;padding:12px 20px;background:var(--panel);border-bottom:1px solid var(--line)}.logo{font-size:19px;font-weight:850}.logo b{color:var(--accent)}.spacer{flex:1}
    .btn,select,input{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;padding:8px 10px}.btn:disabled{opacity:.45;cursor:not-allowed}
    .wrap{max-width:1440px;margin:auto;padding:18px 20px 60px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;margin-bottom:16px;overflow:hidden}.body{padding:16px}.head{padding:13px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}.head h2{margin:0;font-size:16px}.head .hint{margin-left:auto}
    .hero{display:grid;grid-template-columns:1.45fr .55fr;gap:16px}.title{font-size:28px;margin:7px 0}.sub,.note{color:var(--soft);line-height:1.55}.meta{font:12px var(--mono);color:var(--soft)}
    .stats{display:grid;grid-template-columns:repeat(6,1fr);gap:9px;margin-top:15px}.stat{padding:11px;background:var(--sunk);border-radius:9px}.k{font-size:10px;text-transform:uppercase;color:var(--soft);font-weight:800}.v{font:800 20px var(--mono);margin-top:3px}.smallv{font:750 14px var(--mono);margin-top:5px}.good{color:var(--good)}.bad{color:var(--bad)}.warn{color:var(--warn)}.info{color:var(--info)}
    .tag{display:inline-block;padding:3px 8px;border-radius:20px;font-weight:800;font-size:11px}.tag.good{background:#e2f4e9}.tag.warn{background:#f7eed6}.tag.bad{background:#fbe4e8}.tag.info{background:#e6edfb}.tag.neutral{background:#edf0f5;color:var(--soft)}
    .contract{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.contract .cell,.card{border:1px solid var(--line);border-radius:10px;padding:12px}.contract .cell .value{font-weight:750;margin-top:4px;word-break:break-word}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card h3{margin:0 0 9px;font-size:14px}.criteria{display:grid;gap:8px}.criterion{display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--sunk);border-radius:8px}.criterion span:last-child{margin-left:auto;font-family:var(--mono)}
    .filters{display:flex;gap:8px;flex-wrap:wrap}.filters input{min-width:180px}.tablewrap{overflow:auto;max-height:680px}table{width:100%;border-collapse:collapse;min-width:900px}th,td{padding:9px;border-bottom:1px solid #edf0f5;text-align:left;white-space:nowrap}th{position:sticky;top:0;background:var(--panel);font-size:10px;text-transform:uppercase;color:var(--soft);z-index:1}.num{text-align:right;font-family:var(--mono)}tr[data-id]{cursor:pointer}tr[data-id]:hover{background:var(--sunk)}
    .pager{display:flex;align-items:center;justify-content:center;gap:8px;padding:12px 16px;border-top:1px solid var(--line);background:var(--sunk)}.pager .meta{min-width:150px;text-align:center}
    .callout{padding:12px 14px;border-left:4px solid var(--warn);background:#fff9e9;border-radius:6px;line-height:1.5}.availability{display:grid;gap:8px}.availability .row{padding:9px;background:var(--sunk);border-radius:8px}.empty{text-align:center;padding:38px;color:var(--soft)}
    dialog{width:min(1050px,94vw);max-height:90vh;border:0;border-radius:14px;padding:0;color:var(--ink);background:var(--panel);box-shadow:0 18px 60px #0005}dialog::backdrop{background:#10141d99}.dlghead{position:sticky;top:0;background:var(--panel);padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;z-index:1}.dlgbody{padding:18px;overflow:auto}.dlgbody .card{margin-bottom:14px}details{border-top:1px solid var(--line);padding:10px 0}summary{font-weight:750;cursor:pointer}.path{font:11px var(--mono);white-space:pre-wrap;color:var(--soft)}
    @media(max-width:1000px){.hero,.grid2,.grid3{grid-template-columns:1fr}.contract{grid-template-columns:repeat(2,1fr)}.stats{grid-template-columns:repeat(3,1fr)}}
    @media(max-width:620px){.wrap{padding:12px}.stats,.contract{grid-template-columns:1fr 1fr}.pager{flex-wrap:wrap}.top .meta{display:none}}
  </style>
</head>
<body>
  <nav class="top"><a href="index.html" class="logo">Fair<b>Entry</b></a><span class="meta">backtest evidence</span><a class="btn" href="backtest.html?source=sfa">SFA replay</a><a class="btn" href="backtest.html?source=legacy">Legacy replay</a><span class="spacer"></span><a class="btn" id="download-json" href="data/backtest.json" download>Download JSON</a><a class="btn" href="index.html">Board</a></nav>
  <main class="wrap" id="app"><section class="panel"><div class="empty">Loading evidence...</div></section></main>
  <dialog id="detail"><div class="dlghead"><strong id="dt"></strong><span class="spacer"></span><button class="btn" onclick="detail.close()">Close</button></div><div class="dlgbody" id="db"></div></dialog>
<script>
"use strict";
let DATA,ROWS=[],PAGE=Math.max(1,Number(new URLSearchParams(location.search).get('page'))||1),PAGE_SIZE=100;
const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pct=x=>x==null||Number.isNaN(Number(x))?"—":`${x>=0?"+":""}${Number(x).toFixed(2)}%`,money=x=>x==null?"—":"$"+Number(x).toFixed(2),num=x=>x==null?"—":Number(x).toLocaleString();
const tag=(label,tone='neutral')=>`<span class="tag ${tone}">${esc(label)}</span>`;
const mean=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;
const median=a=>{if(!a.length)return null;let s=[...a].sort((x,y)=>x-y),m=Math.floor(s.length/2);return s.length%2?s[m]:(s[m-1]+s[m])/2};
function toneForStatus(s){return s==='reached'||s==='Buy'||s==='strict'?'good':s==='expired'||s==='Avoid'||s==='experimental'?'bad':s==='active'||s==='Watch'||s==='mostly_point_in_time'||s==='already_above_at_entry'?'warn':'neutral'}
function statusTag(s,label){return tag(label||s||'unavailable',toneForStatus(s))}
function health(b){let buy=b.by_verdict?.Buy||{},spread=b.buy_minus_avoid_pct,two=b.spread_ci90_two_way||[],checks=[spread>0,b.significant===true,two.length&&two[0]>0,b.monotonic===true,buy.hit_rate_pct>50,b.cohorts>=30];return {checks,pass:checks.every(Boolean),positive:checks.filter(Boolean).length,label:checks.every(Boolean)?'Acceptance criteria met':'Backtest not validated · review gaps'}}
function actualEntryRange(b){let c=b.per_cohort||[];return c.length?[c[0].entry,c[c.length-1].entry]:b.window||[]}

function overview(b){let t=b.target_summary||{},buy=b.by_verdict?.Buy||{},h=health(b),ci=b.spread_ci90||[],entries=actualEntryRange(b),sfa=b.data_quality?.universe_bias==='active_and_delisted_point_in_time',universe=sfa?'historical active + delisted point-in-time':'current top-N survivors',sampling=sfa?'daily close':'sampled weekly close',sample=b.public_evidence_sample,independence=sfa?'Repeated cohort observations are not independent investments; cohort-block intervals reduce false precision.':'Repeated weekly observations are not independent investments. Alpha uncertainty resamples cohorts; target hit-rate uncertainty is binomial and does not remove survivorship bias.';return `<section class="hero">
  <div class="panel"><div class="body"><div class="meta">RUN ${esc(b.run_id)} · STRATEGY ${esc(b.strategy?.strategy_id)}</div><h1 class="title">Recommendation evidence, from decision to outcome</h1><p class="sub">A transparent replay of historical FairEntry decisions. Results show selection evidence, target calibration, stability and known trust boundaries.</p>
  <div>${tag(h.label,h.pass?'good':'warn')}</div><div class="stats">
    <div class="stat"><div class="k">Buy alpha (${b.hold_days}d)</div><div class="v ${buy.mean_alpha_pct>=0?'good':'bad'}">${pct(buy.mean_alpha_pct)}</div></div>
    <div class="stat"><div class="k">Buy−Avoid spread</div><div class="v ${b.buy_minus_avoid_pct>=0?'good':'bad'}">${pct(b.buy_minus_avoid_pct)}</div></div>
    <div class="stat"><div class="k">90% spread CI</div><div class="smallv">${ci.length?`${pct(ci[0])} to ${pct(ci[1])}`:'—'}</div></div>
    <div class="stat"><div class="k">Practical hit rate</div><div class="v">${t.hit_rate_pct==null?'—':t.hit_rate_pct+'%'}</div></div>
    <div class="stat"><div class="k">Cohorts</div><div class="v">${num(b.cohorts)}</div></div>
    <div class="stat"><div class="k">Entry range</div><div class="smallv">${esc(entries[0]||'—')}<br>${esc(entries[1]||'—')}</div></div>
  </div></div></div>
  <div class="panel"><div class="body note"><b>Trust boundary</b><p>${esc(b.data_quality?.warning||'No warning recorded.')}</p><p>Provider: ${esc(b.provider||'Legacy seeded sources')}<br>Snapshot: ${esc(b.snapshot_id||'Not applicable')}<br>Universe: ${esc(universe)}<br>Target detection: ${esc(sampling)}<br>Primary target: <b>${esc(t.primary_model||b.strategy?.primary_target)}</b></p><div class="callout">${esc(independence)}</div>${sample?`<p>Full-population aggregates use ${num(sample.total)} observations. The drill-down displays a licensed-data-safe sample of ${num(sample.displayed)}.</p>`:''}${b.public_data_boundary?`<p><a href="${esc(b.public_data_boundary.attribution_url)}">${esc(b.public_data_boundary.attribution)}</a> · licensed raw inputs are redacted from this public artifact.</p>`:''}</div></div>
  </section>`}

function strategyCard(b){let s=b.strategy||{},a=b.artifact||{},r=b.runtime_contract||{},entries=actualEntryRange(b),models=(s.target_models||[]).join(', ');let cells=[
  ['Strategy version',`${s.name||'—'} · v${s.version??'—'}`],['Strategy ID',s.strategy_id||'—'],['Implementation fingerprint',b.implementation_fingerprint||'Legacy artifact · not recorded'],['Generated',a.generated_at||'Not recorded in this artifact'],['Source commit',r.git_commit||a.source_commit||'Not recorded'],
  ['Raw data window',(b.window||[]).join(' → ')],['Accepted entry range',entries.join(' → ')],['Cohort cadence',`${b.step_days} days · ${b.cohorts} cohorts`],['Warmup',`${b.warmup_days} days`],
  ['Population',b.screened_only?'Screener-passing candidates':'Full universe'],['Entry rule',s.entry||'snapshot_close'],['Round-trip execution cost',`${(s.slippage_bps??0)+(s.transaction_cost_bps??0)} bps entry + ${(s.exit_slippage_bps??0)+(s.exit_transaction_cost_bps??0)} bps exit`],['Benchmark',s.benchmark||'cohort_mean'],
  ['Alpha horizon',`${b.hold_days} calendar days`],['Outcome horizons',(s.horizons_days||[]).map(x=>x+'d').join(', ')],['Target hit rule',`${s.target_hit||'close'} · ${b.data_quality?.universe_bias==='active_and_delisted_point_in_time'?'daily close':'sampled weekly'}`],['Target models',models||'—'],
  ['Primary target',`${s.primary_target||'practical'} · ${s.practical_target_policy||'nearest credible'}`],['Target expiry',`${s.target_expiry_days??'—'}d base; methods may extend`],['Target upside band',`${s.minimum_upside_pct??'—'}% to ${s.maximum_upside_pct??'—'}%`],['Data-quality policy',s.data_quality_mode||'—'],
  ['Tuning promotion',s.tuning_promotion||'—'],['Challenger windows',(s.challenger_holds_days||[]).map(x=>x+'d').join(', ')],['Evidence delivery',b.evidence_delivery?.mode||'inline'],['Generator',a.generator||'Not recorded']
];return `<section class="panel"><div class="head"><h2>1. Strategy contract</h2><span class="hint meta">What exactly was tested</span></div><div class="body"><div class="contract">${cells.map(x=>`<div class="cell"><div class="k">${esc(x[0])}</div><div class="value">${esc(x[1])}</div></div>`).join('')}</div></div></section>`}

function validation(b){let h=health(b),buy=b.by_verdict?.Buy||{},benchmark=b.strategy?.benchmark==='spy_total_return'?'SPY total return':'the average screened stock in the entry cohort',rows=['Buy','Watch','Avoid'].map(v=>{let x=b.by_verdict?.[v]||{};return `<tr><td>${statusTag(v)}</td><td class="num">${num(x.n)}</td><td class="num">${pct(x.mean_alpha_pct)}</td><td class="num">${pct(x.median_alpha_pct)}</td><td class="num">${x.hit_rate_pct==null?'—':x.hit_rate_pct+'%'}</td><td class="num">${pct(x.mean_raw_return_pct)}</td></tr>`}).join(''),strategyRows=Object.entries(b.by_strategy||{}).map(([k,x])=>{let buy=x.by_verdict?.Buy||{},avoid=x.by_verdict?.Avoid||{};return `<tr><td><b>${esc(k.replaceAll('_',' '))}</b></td><td>${esc(x.preset||'default')}</td><td class="num">${num(buy.n)}</td><td class="num">${pct(buy.mean_alpha_pct)}</td><td class="num">${num(avoid.n)}</td><td class="num">${pct(avoid.mean_alpha_pct)}</td><td class="num">${pct(x.buy_minus_avoid_pct)}</td></tr>`}).join('');let criteria=[
  ['Positive Buy−Avoid spread',b.buy_minus_avoid_pct>0,pct(b.buy_minus_avoid_pct)],['Cohort 90% CI excludes zero',b.significant===true,(b.spread_ci90||[]).map(pct).join(' to ')||'—'],['Cohort + issuer CI excludes zero',(b.spread_ci90_two_way||[])[0]>0,(b.spread_ci90_two_way||[]).map(pct).join(' to ')||'—'],['Monotonic Buy ≥ Watch ≥ Avoid',b.monotonic===true,String(b.monotonic)],['Buy alpha hit rate > 50%',buy.hit_rate_pct>50,(buy.hit_rate_pct??'—')+'%'],['At least 30 cohorts',b.cohorts>=30,String(b.cohorts)]
];return `<section class="panel"><div class="head"><h2>2. Validation health</h2>${tag(`${h.positive}/${h.checks.length} checks`,h.pass?'good':'warn')}</div><div class="body grid2"><div><div class="tablewrap"><table><thead><tr><th>Verdict</th><th class="num">Observations</th><th class="num">Mean alpha</th><th class="num">Median alpha</th><th class="num">Beat benchmark</th><th class="num">Raw return</th></tr></thead><tbody>${rows}</tbody></table></div><p class="note">Alpha = each stock's ${b.hold_days}-day return minus ${benchmark}. Observation counts include repeated stocks across entry cohorts.</p></div><div class="criteria">${criteria.map(c=>`<div class="criterion">${tag(c[1]?'Pass':'Review',c[1]?'good':'warn')}<b>${esc(c[0])}</b><span>${esc(c[2])}</span></div>`).join('')}</div></div><div class="body"><h3>Live-strategy preset replay</h3><div class="tablewrap"><table><thead><tr><th>Primary strategy</th><th>Preset</th><th class="num">Buy n</th><th class="num">Buy alpha</th><th class="num">Avoid n</th><th class="num">Avoid alpha</th><th class="num">Spread</th></tr></thead><tbody>${strategyRows||'<tr><td colspan="7">Not available</td></tr>'}</tbody></table></div><p class="note">Candidates passing both screeners use Deep Value as primary, matching the live board. Each row is scored with that strategy's configured preset.</p></div></section>`}

function horizons(b){let rows=Object.values(b.horizon_summary||{}).map(x=>{let buy=x.by_verdict?.Buy||{},avoid=x.by_verdict?.Avoid||{},ci=x.spread_ci90_cohort||[],two=x.spread_ci90_two_way||[];return `<tr><td><b>${num(x.calendar_days)}d</b><br><span class="meta">~${x.approximately_months} months</span></td><td class="num">${num(buy.n)}</td><td class="num">${pct(buy.mean_alpha_pct)}</td><td class="num">${pct(avoid.mean_alpha_pct)}</td><td class="num">${pct(x.buy_minus_avoid_pct)}</td><td class="num">${ci.length?ci.map(pct).join(' to '):'—'}</td><td class="num">${two.length?two.map(pct).join(' to '):'—'}</td><td>${tag(x.significant?'Significant':'Review',x.significant?'good':'warn')} ${tag(x.monotonic?'Monotonic':'Non-monotonic',x.monotonic?'good':'warn')}</td></tr>`}).join('');return rows?`<section class="panel"><div class="head"><h2>3. Multi-horizon validation</h2><span class="hint meta">Aligned executable dates · round-trip costs</span></div><div class="tablewrap"><table><thead><tr><th>Horizon</th><th class="num">Buy n</th><th class="num">Buy alpha</th><th class="num">Avoid alpha</th><th class="num">Spread</th><th class="num">Cohort CI</th><th class="num">Cohort + issuer CI</th><th>Health</th></tr></thead><tbody>${rows}</tbody></table></div><div class="body note">The 548-day row is the approximately 18-month strategy horizon. Cohort-and-issuer intervals are the conservative check when the same security appears repeatedly.</div></section>`:''}

function weightValidation(b){let w=b.weight_validation;if(!w)return '';let rows=Object.entries(w.strategies||{}).map(([key,x])=>{if(!x.ok)return `<tr><td>${esc(key)}</td><td colspan="6">${esc(x.reason)}</td></tr>`;let s=x.split||{};return `<tr><td><b>${esc(key.replaceAll('_',' '))}</b></td><td>${esc(x.current_preset||'default')}</td><td>${esc(x.selected_candidate)}</td><td>${s.development?.first} → ${s.development?.last}</td><td>${s.validation?.first} → ${s.validation?.last}</td><td>${s.test?.first} → ${s.test?.last}</td><td>${tag(x.promotion_eligible?'Eligible for manual review':'Keep current',x.promotion_eligible?'good':'warn')}</td></tr>`}).join('');return `<section class="panel"><div class="head"><h2>4. Chronological weight validation</h2><span class="hint meta">Development → validation → untouched test</span></div><div class="tablewrap"><table><thead><tr><th>Strategy</th><th>Current</th><th>Selected on development</th><th>Development</th><th>Validation</th><th>Untouched test</th><th>Promotion</th></tr></thead><tbody>${rows}</tbody></table></div><div class="body note">Deep Value and Quality Growth are evaluated separately. Selection uses development data only; promotion remains manual and requires validation plus final-test success.</div></section>`}

function groupedReturns(rows,keyFn,hold){let groups={};rows.forEach(o=>{let r=o.horizons?.[String(hold)]?.return_pct;if(typeof r!=='number')return;let k=keyFn(o)||'Unknown';let g=groups[k]||(groups[k]={Buy:[],Watch:[],Avoid:[],tickers:new Set()});(g[o.verdict]||=[]).push(r);g.tickers.add(o.ticker)});return Object.entries(groups).map(([key,g])=>({key,unique:g.tickers.size,n:g.Buy.length+g.Watch.length+g.Avoid.length,Buy:mean(g.Buy),Watch:mean(g.Watch),Avoid:mean(g.Avoid)}))}
function stability(b){let obs=b.observations||[],hold=b.hold_days||30,summary=b.evidence_return_summary||{},years=(summary.by_year||groupedReturns(obs,o=>(o.entry_date||'').slice(0,4),hold)).sort((a,c)=>a.key.localeCompare(c.key)),sectors=(summary.by_sector||groupedReturns(obs,o=>o.sector,hold)).sort((a,c)=>(c.n-a.n)).slice(0,12),coh=[...(b.per_cohort||[])].filter(x=>typeof x.buy_alpha_pct==='number').sort((a,c)=>a.buy_alpha_pct-c.buy_alpha_pct),worst=coh[0],best=coh[coh.length-1],pros=b.survivorship_control||{},sfa=b.data_quality?.universe_bias==='active_and_delisted_point_in_time';let table=rows=>`<div class="tablewrap"><table><thead><tr><th>Group</th><th class="num">Observations</th><th class="num">Unique</th><th class="num">Buy raw</th><th class="num">Watch raw</th><th class="num">Avoid raw</th></tr></thead><tbody>${rows.map(x=>`<tr><td>${esc(x.key)}</td><td class="num">${num(x.n)}</td><td class="num">${num(x.unique)}</td><td class="num">${pct(x.Buy)}</td><td class="num">${pct(x.Watch)}</td><td class="num">${pct(x.Avoid)}</td></tr>`).join('')}</tbody></table></div>`;return `<section class="panel"><div class="head"><h2>3. Stability and concentration</h2><span class="hint meta">Full-population raw returns at ${hold} days</span></div><div class="body"><div class="grid2"><div class="card"><h3>By entry year</h3>${table(years)}</div><div class="card"><h3>By sector (largest samples)</h3>${table(sectors)}</div></div><div class="grid3"><div class="card"><h3>Worst Buy cohort</h3><div class="v bad">${worst?pct(worst.buy_alpha_pct):'—'}</div><p class="note">${worst?`${esc(worst.entry)} · ${worst.buy_n} Buys · cohort return ${pct(worst.mkt_return_pct)}`:'Not available'}</p></div><div class="card"><h3>Best Buy cohort</h3><div class="v good">${best?pct(best.buy_alpha_pct):'—'}</div><p class="note">${best?`${esc(best.entry)} · ${best.buy_n} Buys · cohort return ${pct(best.mkt_return_pct)}`:'Not available'}</p></div><div class="card"><h3>Evidence availability</h3><div class="availability"><div class="row"><b>Historical replay</b><br>${tag(sfa?'Included · point-in-time active + delisted':'Included · current survivors',sfa?'good':'warn')}</div><div class="row"><b>Prospective signal comparison</b><br>${tag(`${num(pros.prospective_signal_events||0)} signals · ${pros.status||'not bundled'}`,pros.prospective_signal_events?'good':'warn')}</div><div class="row"><b>Default vs challenger weights</b><br>${tag('Workflow summary only','warn')}</div></div></div></div><p class="note">Year and sector tables show full-population raw outcome returns, not independently bootstrapped alpha. Prospective signals are reported separately and never mixed into historical replay.</p>${qualityPanel(obs)}</div></section>`}
function qualityPanel(obs){let counts={};obs.forEach(o=>{let q=o.quality_grade||'unknown';counts[q]=(counts[q]||0)+1});let total=obs.length||1;return `<div class="card"><h3>Data-quality distribution ${DATA?.public_evidence_sample?'(display sample)':''}</h3><div class="stats">${Object.entries(counts).map(([k,n])=>`<div class="stat"><div class="k">${esc(k.replaceAll('_',' '))}</div><div class="v">${num(n)}</div><div class="meta">${(n/total*100).toFixed(1)}%</div></div>`).join('')}</div><p class="note">Coverage counts only observed evidence; neutral defaults no longer masquerade as available data. Public quality counts describe the licensed-data-safe drill-down sample.</p></div>`}

function ciText(x){return x?.length?`${x[0].toFixed(1)}–${x[1].toFixed(1)}%`:'—'}
function expiryText(x){return x?.length?(x[0]===x[1]?x[0]+'d':x[0]+'–'+x[1]+'d'):'—'}
function methods(b){let m=b.target_method_summary||{},rows=Object.keys(m).map(k=>{let x=m[k];return `<tr><td><b>${esc(k)}</b></td><td class="num">${num(x.observations)}</td><td class="num">${num(x.unique_stocks)}</td><td class="num">${num(x.unique_cohorts)}</td><td class="num">${num(x.already_above_at_entry)}</td><td class="num">${num(x.active)}</td><td class="num">${num(x.reached)}</td><td class="num">${num(x.expired)}</td><td class="num">${num(x.evaluable)}</td><td class="num">${x.hit_rate_pct==null?'—':x.hit_rate_pct+'%'}</td><td class="num">${ciText(x.hit_rate_ci90)}</td><td class="num">${ciText(x.hit_rate_cohort_ci90)}</td><td class="num">${ciText(x.hit_rate_two_way_ci90)}</td><td class="num">${x.median_days_to_target??'—'}</td><td class="num">${pct(x.median_upside_pct)}</td><td class="num">${expiryText(x.expiry_days_range)}</td></tr>`}).join('');return `<section class="panel"><div class="head"><h2>5. Target calibration</h2><span class="hint meta">Historical Buy observations only</span></div><div class="body"><div class="callout"><b>Denominator:</b> hit rate = reached ÷ (reached + expired). Active targets and values already above at entry are excluded. “Unique” is the number of distinct tickers, while observations may repeat a ticker across entry cohorts.</div></div><div class="tablewrap"><table><thead><tr><th>Method</th><th class="num">Eligible</th><th class="num">Unique stocks</th><th class="num">Cohorts</th><th class="num">Above entry</th><th class="num">Active</th><th class="num">Reached</th><th class="num">Expired</th><th class="num">Evaluable</th><th class="num">Hit rate</th><th class="num">Wilson 90%</th><th class="num">Cohort-block 90%</th><th class="num">Cohort + issuer 90%</th><th class="num">Median days</th><th class="num">Median upside</th><th class="num">Expiry</th></tr></thead><tbody>${rows}</tbody></table></div><div class="body note">The two-way interval resamples both entry cohorts and securities. Targets with different expiry ranges remain separate and should not be compared as equal-duration forecasts.</div></section>`}

function sfaExtras(b){if(!b.regime_summary)return '';let p=b.portfolio_summary||{},reg=Object.entries(b.regime_summary).map(([k,v])=>`<tr><td>${esc(k)}</td><td class="num">${num(v.cohorts)}</td><td class="num">${pct(v.mean_buy_alpha_pct)}</td></tr>`).join('');return `<section class="panel"><div class="head"><h2>SFA regime and portfolio diagnostics</h2><span class="hint meta">Point-in-time historical universe</span></div><div class="body grid2"><div class="card"><h3>Market regimes</h3><table><thead><tr><th>Regime</th><th class="num">Cohorts</th><th class="num">Buy alpha</th></tr></thead><tbody>${reg}</tbody></table></div><div class="card"><h3>Constrained Buy portfolio</h3><p>Cohort periods: <b>${num(p.cohort_periods)}</b> · cash periods: <b>${num(p.cash_periods)}</b><br>Positions traded: <b>${num(p.positions_traded)}</b> · maximum per cohort: <b>${num(p.max_positions_per_cohort)}</b><br>Compounded return: <b>${pct(p.compounded_return_pct)}</b><br>Maximum drawdown (${esc(p.drawdown_frequency||'endpoints')}): <b>${pct(p.max_drawdown_pct)}</b><br>Annualized Sharpe: <b>${p.annualized_sharpe_approx??'—'}</b></p><p class="note">Equal-weight highest-score Buys; no-Buy cohorts remain in cash; configured entry and exit costs are included. ${p.overlapping?'Holding windows overlap.':'Default cohort spacing is non-overlapping.'}</p></div></div></section>`}

function controls(b){let years=[...new Set((b.observations||[]).map(o=>(o.entry_date||'').slice(0,4)).filter(Boolean))].sort().reverse();return `<section class="panel"><div class="head"><h2>Historical recommendations</h2><span class="spacer"></span><span class="meta" id="count"></span></div><div class="body filters"><input id="q" placeholder="Ticker or company"><select id="v"><option value="">All verdicts</option><option>Buy</option><option>Watch</option><option>Avoid</option></select><select id="s"><option value="">All target states</option><option>reached</option><option>expired</option><option>active</option><option value="already_above_at_entry">Above at entry</option></select><select id="g"><option value="">All quality grades</option><option>strict</option><option>mostly_point_in_time</option><option>experimental</option></select><select id="year"><option value="">All entry years</option>${years.map(y=>`<option>${y}</option>`).join('')}</select><select id="order"><option value="newest">Newest entries first</option><option value="oldest">Oldest entries first</option></select><select id="page-size"><option>50</option><option selected>100</option><option>250</option><option>500</option></select></div><div class="tablewrap"><table><thead><tr><th>Entry</th><th>Ticker</th><th>Sector</th><th>Verdict</th><th class="num">Score</th><th class="num">Entry</th><th class="num">Practical target</th><th>Status</th><th class="num">Days</th><th class="num">30d</th><th class="num">60d</th><th class="num">90d</th><th>Quality</th></tr></thead><tbody id="rows"></tbody></table></div><div class="pager"><button class="btn" data-page="first">First</button><button class="btn" data-page="prev">Previous</button><span class="meta" id="page-label"></span><button class="btn" data-page="next">Next</button><button class="btn" data-page="last">Last</button></div></section>`}
function target(o){return o.target||o.outcome?.targets?.[DATA.strategy.primary_target]||{}}
function targetStatus(t){return t?.status==='already_above_at_entry'||t?.role==='reference'&&t?.days_to_target===0?'Already above at entry (Day 0)':String(t?.status||'unavailable').replaceAll('_',' ')}
function draw(){let q=$('#q').value.toLowerCase(),v=$('#v').value,s=$('#s').value,g=$('#g').value,year=$('#year').value,order=$('#order').value;PAGE_SIZE=Number($('#page-size').value)||100;ROWS=(DATA.observations||[]).filter(o=>(!q||(o.ticker+' '+(o.company||'')).toLowerCase().includes(q))&&(!v||o.verdict===v)&&(!s||target(o).status===s)&&(!g||o.quality_grade===g)&&(!year||o.entry_date?.startsWith(year))).sort((a,b)=>order==='newest'?String(b.entry_date).localeCompare(String(a.entry_date)):String(a.entry_date).localeCompare(String(b.entry_date)));let pages=Math.max(1,Math.ceil(ROWS.length/PAGE_SIZE));PAGE=Math.min(Math.max(1,PAGE),pages);let start=(PAGE-1)*PAGE_SIZE,end=Math.min(start+PAGE_SIZE,ROWS.length);$('#count').textContent=ROWS.length?`${num(start+1)}–${num(end)} of ${num(ROWS.length)} observations`:'0 observations';$('#page-label').textContent=`Page ${num(PAGE)} of ${num(pages)}`;document.querySelector('[data-page="first"]').disabled=document.querySelector('[data-page="prev"]').disabled=PAGE===1;document.querySelector('[data-page="next"]').disabled=document.querySelector('[data-page="last"]').disabled=PAGE===pages;let url=new URL(location.href);if(PAGE===1)url.searchParams.delete('page');else url.searchParams.set('page',PAGE);history.replaceState(null,'',url);$('#rows').innerHTML=ROWS.slice(start,end).map(o=>{let t=target(o),h=o.horizons||o.outcome?.horizons||{};return `<tr data-id="${esc(o.observation_id)}"><td>${esc(o.entry_date)}</td><td><b>${esc(o.ticker)}</b></td><td>${esc(o.sector||'—')}</td><td>${statusTag(o.verdict)}</td><td class="num">${o.score}</td><td class="num">${money(o.entry_price)}</td><td class="num">${money(t.price)}</td><td>${statusTag(t.status,targetStatus(t))}</td><td class="num">${t.days_to_target??'—'}</td><td class="num">${pct(h['30']?.return_pct)}</td><td class="num">${pct(h['60']?.return_pct)}</td><td class="num">${pct(h['90']?.return_pct)}</td><td>${statusTag(o.quality_grade)}</td></tr>`}).join('');document.querySelectorAll('tr[data-id]').forEach(r=>r.onclick=()=>openObservation(r.dataset.id))}
function movePage(where){let pages=Math.max(1,Math.ceil(ROWS.length/PAGE_SIZE));PAGE=where==='first'?1:where==='prev'?PAGE-1:where==='next'?PAGE+1:pages;draw();$('#rows').closest('.tablewrap').scrollTop=0}
async function openObservation(id){let summary=(DATA.observations||[]).find(o=>o.observation_id===id);if(summary.detail_path){$('#dt').textContent='Loading evidence...';$('#db').innerHTML='<div class="empty">Loading stock evidence...</div>';detail.showModal();let pack=await fetch(summary.detail_path,{cache:'no-store'}).then(x=>x.json());show(pack.observations.find(o=>o.observation_id===id),true)}else show(summary)}
function show(o,alreadyOpen){let targets=Object.entries(o.outcome?.targets||{}).sort((a,b)=>(a[0]==='practical'?-1:b[0]==='practical'?1:a[1].price-b[1].price)).map(([k,t])=>`<tr><td><b>${esc(k)}</b><br><span class="meta">${esc(t.role||'')} ${t.excluded?'· excluded':''}</span></td><td>${money(t.price)}</td><td>${pct(t.upside_pct)}</td><td>${statusTag(t.status,targetStatus(t))}</td><td>${t.hit_date||'—'}</td><td class="num">${t.days_to_target??'—'}</td><td>${esc(t.basis||'—')}</td></tr>`).join(''),h=Object.entries(o.outcome?.horizons||{}).map(([k,x])=>`<tr><td>${k}d</td><td>${x.date||x.status}</td><td>${money(x.price)}</td><td class="num">${pct(x.return_pct)}</td></tr>`).join(''),cats=(o.categories||[]).map(c=>`<details><summary>${esc(c.label)} — ${c.score??'unknown'} (weight ${c.weight})</summary>${(c.items||[]).map(i=>`<p><b>${esc(i.label)}</b>: ${esc(i.actual)} · score ${i.score??'unknown'} · ${esc(i.status)}<br><span class="meta">${esc(i.source)} · ${esc(i.fetched_at)}</span></p>`).join('')}</details>`).join(''),fields=(o.data_quality?.fields||[]).map(f=>`<tr><td>${esc(f.field)}</td><td>${esc(f.value)}</td><td>${esc(f.source)}</td><td>${esc(f.effective_at)}</td><td>${statusTag(f.quality)}</td></tr>`).join('');$('#dt').textContent=`${o.ticker} · ${o.entry_date} · ${o.verdict}`;$('#db').innerHTML=`<div class="grid2"><div class="card"><h3>Frozen practical expectation</h3><p>Raw close ${money(o.raw_close)} · adjusted entry ${money(o.entry_price)}<br>Target ${money(o.practical_target?.price)} · expected within ${o.practical_target?.expiry_days||'—'} days<br>Status ${statusTag(o.practical_target?.status,targetStatus(o.practical_target))} · days ${o.practical_target?.days_to_target??'—'}<br>Max gain ${pct(o.outcome?.max_gain_pct)} · max drawdown ${pct(o.outcome?.max_drawdown_pct)}</p><p class="meta">Weights ${esc(JSON.stringify(o.weights))}</p></div><div class="card"><h3>Screening</h3>${(o.screening||[]).map(s=>`<p><b>${esc(s.id)}</b>: ${s.passed?tag('passed','good'):tag('failed','bad')}<br><span class="meta">${esc(JSON.stringify(s.detail))}</span></p>`).join('')}</div></div><div class="card"><h3>All target milestones</h3><div class="tablewrap"><table><tr><th>Model</th><th>Price</th><th>Upside</th><th>Status</th><th>Hit date</th><th>Days</th><th>Basis</th></tr>${targets}</table></div></div><div class="card"><h3>Forward outcomes</h3><table><tr><th>Horizon</th><th>Date</th><th>Price</th><th>Return</th></tr>${h}</table></div><div class="card"><h3>Scoring factors, gates and vetoes</h3><p><b>Gates:</b> ${esc(JSON.stringify(o.soft_gates))}<br><b>Vetoes:</b> ${esc(JSON.stringify(o.vetoes))}</p>${cats}</div><details><summary>Raw point-in-time inputs and provenance</summary><div class="tablewrap"><table><tr><th>Field</th><th>Value</th><th>Source</th><th>Effective</th><th>Quality</th></tr>${fields}</table></div></details><details><summary>Price path</summary><div class="path">${esc(JSON.stringify(o.outcome?.path||[],null,2))}</div></details>`;if(!alreadyOpen)detail.showModal()}

const SOURCE=new URLSearchParams(location.search).get('source')==='legacy'?'legacy':'sfa',ARTIFACT=SOURCE==='sfa'?'data/backtest-sfa.json':'data/backtest.json';$('#download-json').href=ARTIFACT;
fetch(ARTIFACT,{cache:'no-store'}).then(r=>{if(!r.ok)throw Error();return r.json()}).then(b=>{DATA=b;$('#app').innerHTML=overview(b)+strategyCard(b)+validation(b)+horizons(b)+weightValidation(b)+stability(b)+sfaExtras(b)+methods(b)+controls(b);['q','v','s','g','year','order','page-size'].forEach(id=>$('#'+id).oninput=()=>{PAGE=1;draw()});document.querySelector('.pager').onclick=e=>{let x=e.target.closest('[data-page]');if(x&&!x.disabled)movePage(x.dataset.page)};draw()}).catch(err=>$('#app').innerHTML=`<section class="panel"><div class="empty">No ${esc(SOURCE)} evidence artifact found. Generate ${esc(ARTIFACT)} first.<br>${esc(err.message||'')}</div></section>`);
</script>
</body>
</html>
